<h2 id="instalaci%C3%B3n-de-vite">Instalación de Vite</h2>
<ul>
<li>Documentación de Vite → <a href="https://vitejs.dev/">Vite</a></li>
<li>Creamos estructura de carpetas y un fichero <code>vite.config.js</code></li>
</ul>
<split-slide style="--left: 30%; --right: 70%;">
<pre><code class="language-bash"><span class="hljs-built_in">mkdir</span> project-name
<span class="hljs-built_in">cd</span> project-name
pnpm init --init-type module
pnpm add -D vite
<span class="hljs-built_in">touch</span> vite.config.js
code .

pnpm add -D gh-pages
</code></pre>
<pre><code class="language-js"><span class="hljs-keyword">import</span> { defineConfig } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;vite&#x27;</span>;

<span class="hljs-keyword">export</span> <span class="hljs-keyword">default</span> <span class="hljs-title function_">defineConfig</span>({
  <span class="hljs-attr">root</span>: <span class="hljs-string">&quot;/&quot;</span>,                   <span class="hljs-comment">/* index.html fuera de src/ */</span>
  <span class="hljs-attr">publicDir</span>: <span class="hljs-string">&quot;public&quot;</span>,
  <span class="hljs-attr">plugins</span>: [],
  <span class="hljs-attr">server</span>: { <span class="hljs-attr">port</span>: <span class="hljs-number">1234</span> },
  <span class="hljs-attr">build</span>: {
    <span class="hljs-attr">outDir</span>: <span class="hljs-string">&quot;dist&quot;</span>,
  }
});
</code></pre>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="seguridad">Seguridad</h2>
<ul>
<li>Evitar problemas de seguridad de tipo Supply chain (ataque a la cadena de suministro)</li>
<li>Tu web es vulnerable al hacer un <code>npm install</code> porque una de tus dependencias fue comprometida</li>
<li>Ejemplo de problema de seguridad: <a href="https://www.stepsecurity.io/blog/axios-compromised-on-npm-malicious-versions-drop-remote-access-trojan">paquete axios comprometido</a> v1.14.1 (31-03-2026)</li>
</ul>
<split-slide>
<pre><code class="language-bash">minimumReleaseAge: 1440
minimumReleaseAgeExclude:
- vite
- lightningcss
</code></pre>
<div>
<h2 id="seguridad-1">Seguridad</h2>
<ul>
<li>Crea un fichero <code>pnpm-workspace.yaml</code> (necesita pnpm 10.16.0+)</li>
<li>Añade el campo <code>minimumReleaseAge</code> con el tiempo <code>1440</code> (24h)</li>
<li>Pnpm no instalará ninguna dependencia que haya sido publicada en menos de 24h</li>
<li>Con <code>minimumReleaseAgeExclude</code> no influye a ciertas dependencias</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="scripts-de-generaci%C3%B3n">Scripts de generación</h2>
<ul>
<li>Creamos 3 scripts: desarrollo, generación de build y despliegue</li>
</ul>
<split-slide>
<pre><code class="language-bash"><span class="hljs-comment"># Entorno de desarrollo</span>
pnpm run dev

<span class="hljs-comment"># Creamos producción en dist/</span>
pnpm run build

<span class="hljs-comment"># Revisamos la web de producción</span>
pnpm run preview

<span class="hljs-comment"># Desplegamos producción</span>
pnpm run deploy
</code></pre>
<pre><code class="language-json"><span class="hljs-punctuation">{</span>
  <span class="hljs-comment">/* ... */</span>
  <span class="hljs-attr">&quot;scripts&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span>
    <span class="hljs-attr">&quot;dev&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;vite&quot;</span><span class="hljs-punctuation">,</span>
    <span class="hljs-attr">&quot;build&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;vite build&quot;</span><span class="hljs-punctuation">,</span>
    <span class="hljs-attr">&quot;preview&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;vite preview&quot;</span><span class="hljs-punctuation">,</span>
    <span class="hljs-attr">&quot;deploy&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;gh-pages -d dist&quot;</span>
  <span class="hljs-punctuation">}</span><span class="hljs-punctuation">,</span>
  <span class="hljs-comment">/* ... */</span>
<span class="hljs-punctuation">}</span>
</code></pre>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="preparaci%C3%B3n-para-despliegue-en-github-pages-varia-en-otros-providers">Preparación para despliegue en GitHub Pages (varia en otros providers)</h2>
<split-slide style="--font-size: 1rem;">
<steps>
<step>
<pre><code class="language-js"><span class="hljs-keyword">import</span> { defineConfig } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;vite&#x27;</span>;

<span class="hljs-keyword">export</span> <span class="hljs-keyword">default</span> <span class="hljs-title function_">defineConfig</span>({
  <span class="hljs-attr">root</span>: <span class="hljs-string">&quot;src&quot;</span>,
  <span class="hljs-attr">base</span>: <span class="hljs-string">&quot;/repo-name/&quot;</span>,
  <span class="hljs-attr">publicDir</span>: <span class="hljs-string">&quot;../public&quot;</span>,
  <span class="hljs-attr">plugins</span>: [],
  <span class="hljs-attr">server</span>: { <span class="hljs-attr">port</span>: <span class="hljs-number">1234</span> },
  <span class="hljs-attr">build</span>: {
    <span class="hljs-attr">outDir</span>: <span class="hljs-string">&quot;../dist&quot;</span>,
  }
});
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">import</span> path <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;node:path&quot;</span>;
<span class="hljs-keyword">import</span> { defineConfig } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;vite&#x27;</span>;

<span class="hljs-keyword">const</span> prod = process.<span class="hljs-property">env</span>.<span class="hljs-property">NODE_ENV</span> === <span class="hljs-string">&quot;production&quot;</span>;

<span class="hljs-keyword">export</span> <span class="hljs-keyword">default</span> <span class="hljs-title function_">defineConfig</span>({
  <span class="hljs-attr">root</span>: <span class="hljs-string">&quot;src&quot;</span>,
  <span class="hljs-attr">base</span>: prod ? <span class="hljs-string">`/<span class="hljs-subst">${path.basename(process.cwd())}</span>/`</span> : <span class="hljs-string">&quot;/&quot;</span>,
  <span class="hljs-attr">mode</span>: prod ? <span class="hljs-string">&quot;production&quot;</span> : <span class="hljs-string">&quot;development&quot;</span>,
  <span class="hljs-attr">publicDir</span>: <span class="hljs-string">&quot;../public&quot;</span>,
  <span class="hljs-attr">plugins</span>: [],
  <span class="hljs-attr">server</span>: { <span class="hljs-attr">port</span>: <span class="hljs-number">1234</span> },
  <span class="hljs-attr">build</span>: {
    <span class="hljs-attr">outDir</span>: <span class="hljs-string">&quot;../dist&quot;</span>,
  }
});
</code></pre>
</step>
</steps>
<div>
<ul>
<li>GitHub Pages requiere despliegue en ruta específica.</li>
<li>La URL es <code>https://user.github.io/repo-name/</code></li>
<li>Por lo tanto, la base es <code>/repo-name/</code></li>
</ul>
<h2 id="%E2%9E%A1-automatizaci%C3%B3n"><img class="emoji" draggable="false" alt="➡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/27a1.svg" data-marp-twemoji=""/> Automatización:</h2>
<ul>
<li>Esta configuración automatiza para que use <code>/</code> en local, y por otro lado <code>/repo-name/</code> en producción</li>
<li>La variable <code>prod</code>detecta si estás ejecutando <code>vite</code> en modo <code>build</code> (producción)</li>
<li>En ese caso, hace el build usando el nombre de la carpeta como nombre de repo (mode)</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">

<h2 id="reemplazar-postcss-por-lightningcss">Reemplazar PostCSS por LightningCSS</h2>
<ul>
<li>Documentación: <a href="https://lightningcss.dev/">LightningCSS</a></li>
<li>Instalar LightningCSS → <code>pnpm i -D lightningcss</code></li>
<li>Ejemplo: Drafts: <a href="https://lightningcss.dev/transpilation.html#custom-media-queries">Custom Media Queries</a></li>
</ul>
<split-slide>
<pre><code class="language-js"><span class="hljs-keyword">import</span> { defineConfig } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;vite&#x27;</span>;

<span class="hljs-keyword">export</span> <span class="hljs-keyword">default</span> <span class="hljs-title function_">defineConfig</span>({
  <span class="hljs-comment">/* ... */</span>
  <span class="hljs-attr">css</span>: {
    <span class="hljs-attr">transformer</span>: <span class="hljs-string">&quot;lightningcss&quot;</span>, <span class="hljs-comment">/* &quot;postcss&quot; */</span>
    <span class="hljs-comment">// lightningcss: {</span>
    <span class="hljs-comment">//   drafts: {</span>
    <span class="hljs-comment">//     customMedia: true</span>
    <span class="hljs-comment">//   }</span>
    <span class="hljs-comment">// }</span>
  }
});
</code></pre>
<pre><code class="language-css"><span class="hljs-keyword">@custom-media</span> --modern (<span class="hljs-attribute">width</span> &lt;= <span class="hljs-number">900px</span>);

<span class="hljs-selector-tag">body</span> {
  <span class="hljs-attribute">background</span>: <span class="hljs-number">#111</span>;
  <span class="hljs-attribute">color</span>: <span class="hljs-number">#eee</span>;

  <span class="hljs-keyword">@media</span> (--modern) {
    <span class="hljs-attribute">background</span>: indigo;
  }
}
</code></pre>
</split-slide>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="importaciones-en-vite">Importaciones en Vite</h2>
<ul>
<li>NO SON estándar: Sin Vite no te funcionarán (<img class="emoji" draggable="false" alt="🟥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e5.svg" data-marp-twemoji=""/> dependencia de Vite <img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a1.svg" data-marp-twemoji=""/>)</li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">import</span> image <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;../assets/image.png&quot;</span>;        <span class="hljs-comment">// URL producción: &quot;/assets/image.2d8efhg.png&quot;</span>
<span class="hljs-keyword">import</span> image <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;../assets/image.png?inline&quot;</span>; <span class="hljs-comment">// Obtiene como Base64 (inline)</span>
<span class="hljs-keyword">import</span> image <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;../assets/image.svg?raw&quot;</span>;    <span class="hljs-comment">// Obtiene como texto (contenido)</span>
<span class="hljs-keyword">import</span> data <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./assets/file.json&quot;</span>;          <span class="hljs-comment">// Obtiene JSON y parsea directamente a objeto</span>
<span class="hljs-keyword">import</span> styles <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./assets/file.css&quot;</span>;         <span class="hljs-comment">// Obtiene CSS y parsea directamente a texto</span>
</code></pre>
<ul>
<li>Consejo: Prefiere siempre que puedas la vía estándar (funcionará en proyectos sin Vite) → <a href="https://rolldown.rs/guide/notable-features#css-bundling">Rolldown no soporta CSS modules aún</a></li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">import</span> data <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./assets/file.json&quot;</span> <span class="hljs-keyword">with</span> { <span class="hljs-attr">type</span>: <span class="hljs-string">&quot;json&quot;</span> }; <span class="hljs-comment">// Actualmente compatible con Vite</span>
<span class="hljs-keyword">import</span> styles <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./assets/file.css&quot;</span> <span class="hljs-keyword">with</span> { <span class="hljs-attr">type</span>: <span class="hljs-string">&quot;css&quot;</span> }; <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> Actualmente, no compatible con Vite</span>
</code></pre>

<tr>

<pre><code class="language-js"><span class="hljs-comment">// No devuelve nada nunca (undefined)</span>

<h2 id="array-functions-foreach-vs-map">Array functions: <code>.forEach()</code> vs <code>.map()</code></h2>
<split-slide>
<div>
<table>
<thead>
<tr>
<th>'Gato'</th>
<th>'Pato'</th>
<th>'Oso'</th>
<th>'Topito'</th>
</tr>
</thead>
</table>
<pre><code class="language-js"><span class="hljs-comment">// No devuelve nada nunca (undefined)</span>
animals.<span class="hljs-title function_">forEach</span>(<span class="hljs-function">(<span class="hljs-params">el, index</span>) =&gt;</span> {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Elemento #<span class="hljs-subst">${index}</span>: <span class="hljs-subst">${el}</span>`</span>);
});
</code></pre>
</div>
<div>
<table>
<thead>
<tr>
<th>4</th>
<th>4</th>
<th>3</th>
<th>6</th>
</tr>
</thead>
</table>
<pre><code class="language-js"><span class="hljs-comment">// Transforma el array original en uno derivado</span>
<span class="hljs-keyword">const</span> sizes = animals.<span class="hljs-title function_">map</span>(<span class="hljs-function">(<span class="hljs-params">el, index, array</span>) =&gt;</span> {
  <span class="hljs-keyword">return</span> el.<span class="hljs-property">length</span>;
});

<span class="hljs-comment">// Versión abreviada</span>
<span class="hljs-keyword">const</span> sizes = animals.<span class="hljs-title function_">map</span>(<span class="hljs-function">(<span class="hljs-params">el</span>) =&gt;</span> el.<span class="hljs-property">length</span>);
</code></pre>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-marpit-scope-JWxWPQNB="" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="array-functions-every-vs-some">Array functions: <code>.every()</code> vs <code>.some()</code></h2>
<split-slide>
<div>
<table>
<thead>
<tr>
<th>'Gato'</th>
<th>'Pato'</th>
<th>'Oso'</th>
<th>'Topito'</th>
</tr>
</thead>
</table>
<pre><code class="language-js"><span class="hljs-keyword">const</span> all = animals.<span class="hljs-title function_">every</span>(<span class="hljs-function">(<span class="hljs-params">el</span>) =&gt;</span> {
  <span class="hljs-keyword">if</span> (el.<span class="hljs-title function_">includes</span>(<span class="hljs-string">&quot;a&quot;</span>)) <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>;
  <span class="hljs-keyword">else</span> <span class="hljs-keyword">return</span> <span class="hljs-literal">false</span>;
});

<span class="hljs-comment">// Lo anterior es redundante:</span>
animals.<span class="hljs-title function_">every</span>(<span class="hljs-function"><span class="hljs-params">el</span> =&gt;</span> el.<span class="hljs-title function_">includes</span>(<span class="hljs-string">&quot;a&quot;</span>)); <span class="hljs-comment">// F</span>
animals.<span class="hljs-title function_">every</span>(<span class="hljs-function"><span class="hljs-params">el</span> =&gt;</span> el.<span class="hljs-title function_">endsWith</span>(<span class="hljs-string">&quot;o&quot;</span>)); <span class="hljs-comment">// T</span>
</code></pre>
</div>
<div>
<table>
<thead>
<tr>
<th>'Gato'</th>
<th>'Pato'</th>
<th>'Oso'</th>
<th>'Topito'</th>
</tr>
</thead>
</table>
<pre><code class="language-js"><span class="hljs-keyword">const</span> all = animals.<span class="hljs-title function_">some</span>(<span class="hljs-function">(<span class="hljs-params">el</span>) =&gt;</span> {
  <span class="hljs-keyword">if</span> (el.<span class="hljs-title function_">includes</span>(<span class="hljs-string">&quot;a&quot;</span>)) <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>;
  <span class="hljs-keyword">else</span> <span class="hljs-keyword">return</span> <span class="hljs-literal">false</span>;
});

<span class="hljs-comment">// Lo anterior es redundante:</span>
animals.<span class="hljs-title function_">some</span>(<span class="hljs-function"><span class="hljs-params">el</span> =&gt;</span> el.<span class="hljs-title function_">includes</span>(<span class="hljs-string">&quot;a&quot;</span>)); <span class="hljs-comment">// T</span>
animals.<span class="hljs-title function_">some</span>(<span class="hljs-function"><span class="hljs-params">el</span> =&gt;</span> el.<span class="hljs-title function_">endsWith</span>(<span class="hljs-string">&quot;o&quot;</span>)); <span class="hljs-comment">// T</span>
</code></pre>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="array-functions-find-vs-findindex-vs-filter">Array functions: <code>.find()</code> vs <code>.findIndex()</code> vs <code>.filter()</code></h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<div>
<pre><code class="language-js"><span class="hljs-keyword">const</span> users = [
  { <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Alons&quot;</span>, <span class="hljs-attr">life</span>: <span class="hljs-number">39</span> },
  { <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;felixicaza&quot;</span>, <span class="hljs-attr">life</span>: <span class="hljs-number">75</span> },
  { <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;krepssi&quot;</span>, <span class="hljs-attr">life</span>: <span class="hljs-number">99</span> },
  { <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;DHardySD&quot;</span>, <span class="hljs-attr">life</span>: -<span class="hljs-number">5</span> },
];

users.<span class="hljs-title function_">find</span>(<span class="hljs-function"><span class="hljs-params">el</span> =&gt;</span> el.<span class="hljs-property">life</span> &lt; <span class="hljs-number">50</span>);
<span class="hljs-comment">// { name: &quot;Alons&quot;, life: 39 }</span>

users.<span class="hljs-title function_">findIndex</span>(<span class="hljs-function"><span class="hljs-params">el</span> =&gt;</span> el.<span class="hljs-property">life</span> &lt; <span class="hljs-number">50</span>);
<span class="hljs-comment">// 0</span>
</code></pre>
</div>
<div>
<pre><code class="language-js"><span class="hljs-keyword">const</span> filteredUsers = users.<span class="hljs-title function_">filter</span>(<span class="hljs-function"><span class="hljs-params">el</span> =&gt;</span> el.<span class="hljs-property">life</span> &gt; <span class="hljs-number">50</span>);
<span class="hljs-comment">// [</span>
<span class="hljs-comment">//  { name: &quot;felixicaza&quot;, life: 75 }</span>
<span class="hljs-comment">//  { name: &quot;krepssi&quot;, life: 99 }</span>
<span class="hljs-comment">// ]</span>

users.<span class="hljs-title function_">filter</span>(<span class="hljs-function"><span class="hljs-params">el</span> =&gt;</span> el.<span class="hljs-property">life</span> &gt; <span class="hljs-number">500</span>);    <span class="hljs-comment">// []</span>
users.<span class="hljs-title function_">find</span>(<span class="hljs-function"><span class="hljs-params">el</span> =&gt;</span> el.<span class="hljs-property">life</span> &gt; <span class="hljs-number">500</span>);      <span class="hljs-comment">// undefined</span>
users.<span class="hljs-title function_">findIndex</span>(<span class="hljs-function"><span class="hljs-params">el</span> =&gt;</span> el.<span class="hljs-property">life</span> &gt; <span class="hljs-number">500</span>); <span class="hljs-comment">// -1</span>

users.<span class="hljs-title function_">findLast</span>();      <span class="hljs-comment">// Idem pero buscando desde el final</span>
users.<span class="hljs-title function_">findLastIndex</span>(); <span class="hljs-comment">// Idem pero buscando desde el final</span>
</code></pre>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="array-functions-flat-vs-flatmap">Array functions: <code>.flat()</code> vs <code>.flatMap()</code></h2>
<split-slide>
<div>
<pre><code class="language-js"><span class="hljs-keyword">const</span> animals = [
  [<span class="hljs-string">&quot;Gato&quot;</span>, <span class="hljs-string">&quot;Tigre&quot;</span>],
  [<span class="hljs-string">&quot;Pato&quot;</span>, [ <span class="hljs-string">&quot;Ganso&quot;</span>, <span class="hljs-string">&quot;Gansa&quot;</span> ] ],
  <span class="hljs-string">&quot;Oso&quot;</span>
];

animals.<span class="hljs-title function_">flat</span>(<span class="hljs-number">1</span>);
<span class="hljs-comment">// [&#x27;Gato&#x27;, &#x27;Tigre&#x27;, &#x27;Pato&#x27;, Array(2), &#x27;Oso&#x27;]</span>

animals.<span class="hljs-title function_">flat</span>(<span class="hljs-number">2</span>);
animals.<span class="hljs-title function_">flat</span>(<span class="hljs-title class_">Infinity</span>);
<span class="hljs-comment">// [&#x27;Gato&#x27;, &#x27;Tigre&#x27;, &#x27;Pato&#x27;, &#x27;Ganso&#x27;, &#x27;Gansa&#x27;, &#x27;Oso&#x27;]</span>
</code></pre>
</div>
<div>
<pre><code class="language-js">animals.<span class="hljs-title function_">flatMap</span>(<span class="hljs-function"><span class="hljs-params">el</span> =&gt;</span> <span class="hljs-comment">/* ... */</span>);

<span class="hljs-comment">// Equivalente a:</span>
animals.<span class="hljs-title function_">map</span>(<span class="hljs-function"><span class="hljs-params">el</span> =&gt;</span> <span class="hljs-comment">/* ... */</span>).<span class="hljs-title function_">flat</span>(<span class="hljs-number">1</span>);

<span class="hljs-comment">// ...pero más eficiente:</span>

<span class="hljs-comment">// → flatMap (1 bucle)</span>
<span class="hljs-comment">// → map + flat (2 bucles)</span>
</code></pre>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="array-functions-reduce-vs-reduceright">Array functions: <code>.reduce()</code> vs <code>.reduceRight()</code></h2>
<split-slide>
<div>
<pre><code class="language-js"><span class="hljs-keyword">const</span> values = [<span class="hljs-number">25</span>, <span class="hljs-number">25</span>, <span class="hljs-number">25</span>, <span class="hljs-number">25</span>];

values.<span class="hljs-title function_">reduce</span>(<span class="hljs-function">(<span class="hljs-params">acc, first</span>) =&gt;</span> acc + first);
<span class="hljs-comment">// 25 + 25 + 25 + 25 = 100</span>

values.<span class="hljs-title function_">reduce</span>(<span class="hljs-function">(<span class="hljs-params">acc, first</span>) =&gt;</span> acc - first);
<span class="hljs-comment">// 25 - 25 - 25 - 25 = -50</span>

<span class="hljs-comment">// Último parámetro: Valor inicial</span>
values.<span class="hljs-title function_">reduce</span>(<span class="hljs-function">(<span class="hljs-params">acc, first</span>) =&gt;</span> acc - first, <span class="hljs-number">0</span>);
<span class="hljs-comment">// 0 - 25 - 25 - 25 - 25 = -100</span>
</code></pre>
</div>
<div>
<pre><code class="language-js"><span class="hljs-keyword">const</span> values = [<span class="hljs-number">5</span>, <span class="hljs-number">10</span>, <span class="hljs-number">15</span>, <span class="hljs-number">20</span>];

values.<span class="hljs-title function_">reduceRight</span>(<span class="hljs-function">(<span class="hljs-params">acc, first</span>) =&gt;</span> acc - first);
<span class="hljs-comment">// 20 - 15 - 10 - 5 = -10</span>

<span class="hljs-comment">// Último parámetro: Valor inicial</span>
values.<span class="hljs-title function_">reduceRight</span>(<span class="hljs-function">(<span class="hljs-params">acc, first</span>) =&gt;</span> acc - first, <span class="hljs-number">0</span>);
<span class="hljs-comment">// 0 - 20 - 15 - 10 - 5 = -50</span>
</code></pre>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="notaci%C3%B3n-big-on">Notación Big O(N)</h2>
<ul>
<li>Complejidad: <a href="https://www.luisllamas.es/complejidad-algoritmica-big-o/#la-notaci%C3%B3n-big-on">La notación Big O(N)</a></li>
<li>Es una forma de medir la complejidad del código (tiempo de CPU o memoria) según aumenta el tamaño de la entrada.</li>
</ul>
<table>
<thead>
<tr>
<th>Complejidad</th>
<th>Denominación</th>
<th>Descripción</th>
</tr>
</thead>
<tbody>
<tr>
<td>O(1)</td>
<td>Constante</td>
<td>Acceso una carta concreta. Da igual cuantas sean. Inmediato.</td>
</tr>
<tr>
<td>O(log n)</td>
<td>Logarítmica</td>
<td>Cartas ordenadas. Búsqueda binaria. Eliminas la mitad y sigues buscando.</td>
</tr>
<tr>
<td>O(n)</td>
<td>Lineal</td>
<td>Buscas una carta concreta. Carta por carta hasta encontrarla.</td>
</tr>
<tr>
<td>O(n log n)</td>
<td>Lineal-logarítmica</td>
<td>Mazo desordenado. Divides en montones, ordenadas y combinas.</td>
</tr>
<tr>
<td>O(n²)</td>
<td>Cuadrática <img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a0.svg" data-marp-twemoji="" /></td>
<td>Ordenas mazo comparando cada carta con el resto.</td>
</tr>
<tr>
<td>O(2ⁿ)</td>
<td>Exponencial <img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a0.svg" data-marp-twemoji="" /><img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a0.svg" data-marp-twemoji="" /></td>
<td>Cada carta que añades, dobla el total.</td>
</tr>
<tr>
<td>O(n!)</td>
<td>Factorial <img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a0.svg" data-marp-twemoji="" /><img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a0.svg" data-marp-twemoji="" /><img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a0.svg" data-marp-twemoji="" /></td>
<td>Explora todas las combinaciones posibles.</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="complejidad">Complejidad</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js">{
  <span class="hljs-string">&quot;$schema&quot;</span>: <span class="hljs-string">&quot;./node_modules/oxlint/configuration_schema.json&quot;</span>,
  <span class="hljs-string">&quot;env&quot;</span>: { <span class="hljs-string">&quot;es2024&quot;</span>: <span class="hljs-literal">true</span> },
  <span class="hljs-string">&quot;ignorePatterns&quot;</span>: [<span class="hljs-string">&quot;**/node_modules/**&quot;</span>],
  <span class="hljs-string">&quot;plugins&quot;</span>: [<span class="hljs-string">&quot;eslint&quot;</span>, <span class="hljs-string">&quot;unicorn&quot;</span>, <span class="hljs-string">&quot;oxc&quot;</span>],
  <span class="hljs-string">&quot;jsPlugins&quot;</span>: [<span class="hljs-string">&quot;oxlint-plugin-complexity&quot;</span>],
  <span class="hljs-string">&quot;rules&quot;</span>: {
    <span class="hljs-string">&quot;complexity/complexity&quot;</span>: [<span class="hljs-string">&quot;warn&quot;</span>, {
      <span class="hljs-string">&quot;cyclomatic&quot;</span>: <span class="hljs-number">4</span>,
      <span class="hljs-string">&quot;cognitive&quot;</span>: <span class="hljs-number">4</span>
    }]
  }
}
</code></pre>
<div>
<ul>
<li>Complejidad ciclomática: Número de caminos independientes que puede seguir el código (matemático).</li>
<li>Complejidad cognitiva: Mide lo difícil que es para un humano leer y entender el código.</li>
</ul>
<h2 id="recordemos">Recordemos:</h2>
<ul>
<li>Debes tener instalado <a href="https://lenguajejs.com/javascript/calidad-de-codigo/oxlint/">oxlint</a> para usar esta configuración
<ul>
<li><code>pnpm i -D oxlint</code></li>
<li><code>pnpx oxlint --init</code></li>
</ul>
</li>
<li>Instala dependencia <a href="https://npmx.dev/package/oxlint-plugin-complexity"><code>oxlint-plugin-complexity</code></a></li>
<li>Fichero de ejemplo para testear → <a href="../assets/bad.js">bad.js</a></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="iteradores">Iteradores</h2>
<ul>
<li>Iterar es avanzar por una estructura de forma eficiente (bajo demanda)</li>
</ul>
<steps>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> data = [<span class="hljs-string">&quot;One&quot;</span>, <span class="hljs-string">&quot;Two&quot;</span>, <span class="hljs-string">&quot;Three&quot;</span>, <span class="hljs-string">&quot;Four&quot;</span>];

<span class="hljs-comment">// Sin iteradores</span>
<span class="hljs-keyword">for</span> (<span class="hljs-keyword">let</span> i = <span class="hljs-number">0</span>; i &lt; data.<span class="hljs-property">length</span>; i++) {
  <span class="hljs-keyword">const</span> number = data[i];
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(number);
}
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> data = [<span class="hljs-string">&quot;One&quot;</span>, <span class="hljs-string">&quot;Two&quot;</span>, <span class="hljs-string">&quot;Three&quot;</span>, <span class="hljs-string">&quot;Four&quot;</span>];

<span class="hljs-comment">// Iterador implícito</span>
data.<span class="hljs-title function_">forEach</span>(<span class="hljs-function"><span class="hljs-params">number</span> =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(number));

<span class="hljs-comment">// En los arrays, tenemos un iterador &quot;escondido&quot;</span>
data[<span class="hljs-title class_">Symbol</span>.<span class="hljs-property">iterator</span>]

<span class="hljs-comment">// Veamos como funciona... <img class="emoji" draggable="false" alt="➡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/27a1.svg" data-marp-twemoji=""/></span>
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> data = [<span class="hljs-string">&quot;One&quot;</span>, <span class="hljs-string">&quot;Two&quot;</span>, <span class="hljs-string">&quot;Three&quot;</span>, <span class="hljs-string">&quot;Four&quot;</span>];

data[<span class="hljs-title class_">Symbol</span>.<span class="hljs-property">iterator</span>] === data.<span class="hljs-property">values</span>   <span class="hljs-comment">// true</span>
<span class="hljs-keyword">const</span> iterator = data.<span class="hljs-title function_">values</span>()  <span class="hljs-comment">// Array Iterator {}</span>

iterator.<span class="hljs-title function_">next</span>() <span class="hljs-comment">// { value: &quot;One&quot;, done: false }</span>
iterator.<span class="hljs-title function_">next</span>() <span class="hljs-comment">// { value: &quot;Two&quot;, done: false }</span>
<span class="hljs-comment">// ...</span>
iterator.<span class="hljs-title function_">next</span>() <span class="hljs-comment">// { value: undefined, done: true }</span>

[...iterator]   <span class="hljs-comment">// [] (Ya se han &quot;consumido&quot;)</span>
<span class="hljs-comment">// Al usar .values(), creas una copia</span>
</code></pre>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="m%C3%A9todos-de-iteradores">Métodos de iteradores</h2>
<ul>
<li><code>.take(n)</code> → Toma los elementos desde el actual hasta el indicado</li>
<li><code>.drop(n)</code> → Descarta los <code>n</code> primeros elementos</li>
<li><code>.toArray()</code> → Convierte a Array (o usar spread <code>[...]</code>)</li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">const</span> data = [<span class="hljs-string">&quot;One&quot;</span>, <span class="hljs-string">&quot;Two&quot;</span>, <span class="hljs-string">&quot;Three&quot;</span>, <span class="hljs-string">&quot;Four&quot;</span>, <span class="hljs-string">&quot;Five&quot;</span>, <span class="hljs-string">&quot;Six&quot;</span>, <span class="hljs-string">&quot;Seven&quot;</span>];

<span class="hljs-keyword">const</span> iterator = data.<span class="hljs-title function_">values</span>();

data.<span class="hljs-title function_">values</span>()     <span class="hljs-comment">// Hace copia</span>
  .<span class="hljs-title function_">drop</span>(<span class="hljs-number">3</span>)        <span class="hljs-comment">// Descarta los 3 primeros</span>
  .<span class="hljs-title function_">take</span>(<span class="hljs-number">2</span>)        <span class="hljs-comment">// Se queda sólo con los dos siguientes</span>
  .<span class="hljs-title function_">toArray</span>();     <span class="hljs-comment">// Convierte a Array</span>

<span class="hljs-comment">// [&quot;Four&quot;, &quot;Five&quot;]</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="array-functions-para-iteradores">Array functions para Iteradores</h2>
<ul>
<li>Podemos aplicar las clásicas array functions a los iteradores</li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">const</span> messages = [<span class="hljs-string">&quot;Hola a todos&quot;</span>, <span class="hljs-string">&quot;Estoy muy contento&quot;</span>, <span class="hljs-string">&quot;Adiós&quot;</span>];

<span class="hljs-keyword">const</span> iterator = <span class="hljs-title class_">Iterator</span>.<span class="hljs-title function_">from</span>(messages);

iterator.<span class="hljs-title function_">values</span>().<span class="hljs-title function_">forEach</span>(...)  <span class="hljs-comment">// Por cada elemento...</span>
iterator.<span class="hljs-title function_">values</span>().<span class="hljs-title function_">every</span>(...)    <span class="hljs-comment">// Si todas cumplen...</span>
iterator.<span class="hljs-title function_">values</span>().<span class="hljs-title function_">some</span>(...)     <span class="hljs-comment">// Si al menos una cumple...</span>
iterator.<span class="hljs-title function_">values</span>().<span class="hljs-title function_">filter</span>(...)   <span class="hljs-comment">// Filtrar elementos</span>
iterator.<span class="hljs-title function_">values</span>().<span class="hljs-title function_">find</span>(...)     <span class="hljs-comment">// Busca un elemento...</span>
iterator.<span class="hljs-title function_">values</span>().<span class="hljs-title function_">map</span>(...)      <span class="hljs-comment">// Transforma cada elemento...</span>
iterator.<span class="hljs-title function_">values</span>().<span class="hljs-title function_">flatMap</span>(...)  <span class="hljs-comment">// Transforma y aplana cada elemento...</span>
iterator.<span class="hljs-title function_">values</span>().<span class="hljs-title function_">reduce</span>(...)   <span class="hljs-comment">// Aplica función, acumulándola...</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="crear-estructuras-iterables">Crear estructuras iterables</h2>
<ul>
<li>Funciones pausables, con múltiples retornos → <a href="https://lenguajejs.com/javascript/funciones/generadores/">Funciones generadoras</a></li>
<li>Valores únicos e irrepetibles → <a href="https://lenguajejs.com/javascript/tipos/symbols/">Symbols</a></li>
</ul>
<steps>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> data = {
  <span class="hljs-attr">from</span>: <span class="hljs-number">1</span>,
  <span class="hljs-attr">to</span>: <span class="hljs-number">5</span>,
}

[...data]         <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> Uncaught TypeError: data is not iterable</span>
</code></pre>
</step>
<step>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.9rem;">
<pre><code class="language-js"><span class="hljs-keyword">function</span> *<span class="hljs-title function_">generator</span>(<span class="hljs-params"></span>) {
  <span class="hljs-keyword">yield</span> <span class="hljs-number">1</span>;
  <span class="hljs-keyword">yield</span> <span class="hljs-string">&quot;a&quot;</span>;
  <span class="hljs-keyword">yield</span> <span class="hljs-number">42</span>;
}

<span class="hljs-keyword">const</span> it = <span class="hljs-title function_">generator</span>()
it.<span class="hljs-title function_">next</span>()     <span class="hljs-comment">// {value: 1, done: false }</span>
it.<span class="hljs-title function_">next</span>()     <span class="hljs-comment">// {value: &quot;a&quot;, done: false }</span>
it.<span class="hljs-title function_">next</span>()     <span class="hljs-comment">// {value: 42, done: false }</span>
it.<span class="hljs-title function_">next</span>()     <span class="hljs-comment">// {value: undefined, done: true }</span>
</code></pre>
<pre><code class="language-js"><span class="hljs-keyword">const</span> data = {
  <span class="hljs-attr">from</span>: <span class="hljs-number">1</span>,
  <span class="hljs-attr">to</span>: <span class="hljs-number">5</span>,
  *[<span class="hljs-title class_">Symbol</span>.<span class="hljs-property">iterator</span>]() {
    <span class="hljs-keyword">for</span> (<span class="hljs-keyword">let</span> i = <span class="hljs-variable language_">this</span>.<span class="hljs-property">from</span>; i &lt;= <span class="hljs-variable language_">this</span>.<span class="hljs-property">to</span>; i++) {
      <span class="hljs-keyword">yield</span> i;
    }
  }
}

[...data]        <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> [1, 2, 3, 4, 5]</span>
</code></pre>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-scope-EN3rZqQN="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="24" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="39">
<h1 id="c%C3%B3digo-limpio">Código limpio</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="nombrado-inteligente">Nombrado inteligente</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-keyword">const</span> d = <span class="hljs-number">42</span>;                         <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/></span>
<span class="hljs-keyword">const</span> days = <span class="hljs-number">42</span>;                      <span class="hljs-comment">// <img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e9.svg" data-marp-twemoji=""/></span>
<span class="hljs-keyword">const</span> daysSinceCreation = <span class="hljs-number">42</span>;         <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></span>

<span class="hljs-keyword">const</span> genymdhms = <span class="hljs-comment">/* ... */</span>           <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/></span>
<span class="hljs-keyword">const</span> generateTimestamp = <span class="hljs-comment">/* ... */</span>   <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></span>

<span class="hljs-keyword">const</span> <span class="hljs-title function_">calculateTotal</span> = (<span class="hljs-params"></span>) =&gt; { ... }
<span class="hljs-keyword">const</span> <span class="hljs-title function_">sendEmail</span> = (<span class="hljs-params"></span>) =&gt; { ... }
<span class="hljs-keyword">class</span> <span class="hljs-title class_">User</span> { ... }
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Invoice</span> { ... }
<span class="hljs-keyword">const</span> isValid = <span class="hljs-literal">true</span>;
</code></pre>
<div>
<ul>
<li>Buen nombre → código limpio, breve y sin explicaciones</li>
<li>Verbos → funciones</li>
<li>Sustantivos → clases</li>
<li>Prefijos <code>is</code>/<code>has</code> → booleanos</li>
<li>Evita tipos en nombres (ya los da el compilador/editor)</li>
<li>Nombres de una letra, sólo en bucles</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="dry-no-te-repitas">DRY (No te repitas)</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> No te repitas</span>
$product.<span class="hljs-property">textContent</span> = <span class="hljs-string">`$<span class="hljs-subst">${(product.price).toFixed(<span class="hljs-number">2</span>)}</span>`</span>;
$cart.<span class="hljs-property">textContent</span> = <span class="hljs-string">`$<span class="hljs-subst">${(cart.total).toFixed(<span class="hljs-number">2</span>)}</span>`</span>;
$summary.<span class="hljs-property">textContent</span> = <span class="hljs-string">`$<span class="hljs-subst">${(summary.amount).toFixed(<span class="hljs-number">2</span>)}</span>`</span>;

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Generaliza</span>
<span class="hljs-keyword">const</span> <span class="hljs-title function_">formatPrice</span> = (<span class="hljs-params">n</span>) =&gt; <span class="hljs-string">`$<span class="hljs-subst">${n.toFixed(<span class="hljs-number">2</span>)}</span>`</span>;

$product.<span class="hljs-property">textContent</span> = <span class="hljs-title function_">formatPrice</span>(product.<span class="hljs-property">price</span>);
$cart.<span class="hljs-property">textContent</span> = <span class="hljs-title function_">formatPrice</span>(cart.<span class="hljs-property">total</span>);
$summary.<span class="hljs-property">textContent</span> = <span class="hljs-title function_">formatPrice</span>(summary.<span class="hljs-property">amount</span>);
</code></pre>
<div>
<ul>
<li>Si detectas que repites la misma lógica... significa que podrías reutilizar.</li>
<li>Extrae la lógica, generaliza si es necesario, y usa una función reutilizable.</li>
<li>Más legible, más fácil de mantener si tienes que hacer cambios.</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="yagni-no-lo-necesitas">YAGNI (No lo necesitas)</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-bash">⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢀⣀⣠⣤⣀⠀⠀⠀⠀⠀⠀⠀⠀
⠀⠀⠀⠀⠀⣀⣀⣀⣠⠔⠊⠑⠒⣷⠆⢸⢳⠀⠀⠀⠀⠀⠀⠀
⠀⠀⢀⠔⠋⠁⠀⠀⠉⠁⠒⠤⣄⠋⠀⠈⢧⡇⠀⠀⣰⣶⢆⠀
⠀⠀⡏⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢉⣐⠒⠼⠿⠔⣊⣿⣿⢸⠀
⠀⠀⡇⠀⠀⠀⠀⢀⣤⡒⠋⣩⢉⠙⠛⢿⣿⡶⣾⣿⣿⣿⡌⠀
⠀⠀⠹⡄⠀⠀⢀⣾⣾⠁⢘⣭⣷⣶⠃⣿⣾⣷⣿⣿⣟⠝⠀⠀
⠀⠀⠀⠈⠢⣀⣸⢳⠛⡄⠀⠀⠀⠁⠀⣧⡀⢸⡽⠗⠁⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠈⠳⡄⠁⢠⠀⠀⠋⢱⢿⣷⡿⠁⠀⠀⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠀⡿⠀⢀⠐⠀⢭⣭⣽⣩⡇⠀⠀⠀⠀⠀⠀
⠀⠀⠀⠀⠀⠀⢀⣴⡇⠑⢬⣀⠀⠀⠀⠀⣿⠀⠀⠀⠀⠀⠀⠀
⠀⠀⠀⠀⠀⢀⠎⠹⡕⠠⢀⣈⠻⢿⣿⣿⣷⣄⠀⠀⠀⠀⠀⠀
⠀⣀⠤⠒⠒⡇⠀⠀⠈⠢⣔⣭⣙⣛⣿⣽⣇⡏⣣⣀⠀⠀⠀⠀
⠉⠀⠀⠀⠀⠘⡄⠀⠀⣠⠴⡟⠍⡻⠟⣿⠘⣷⣇⢧⡉⠉⠉⠁
⠀⠀⠀⠀⠀⠀⣇⣠⠾⠃⠀⠓⠤⢔⣄⢣⠃⡇⣿⠚⠉
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠸⠉⢧⠁⡇
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠃⠀⠛
</code></pre>
<div>
<p>Busca el punto medio entre dos extremos:</p>
<ul>
<li>YAGNI → You Aren't Gonna Need It (evita el «por si acaso»)</li>
<li>COWBOY → Estilo «llanero solitario» (no pensar NADA en el futuro)</li>
<li>Evita construir cosas genéricas para problemas que aún no tienes.</li>
<li>Abstracción prematura, añade complejidad sin beneficios.</li>
<li>Pero tampoco vayas estilo libre, sin pensar más allá del futuro inmediato</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="funciones-puras">Funciones puras</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-comment">// Función pura: Misma entrada, siempre misma salida</span>
<span class="hljs-keyword">const</span> <span class="hljs-title function_">add</span> = (<span class="hljs-params">a, b</span>) =&gt; a + b;

<span class="hljs-comment">// Función impura: Depende de algo externo (y lo modifica)</span>
<span class="hljs-keyword">let</span> total = <span class="hljs-number">0</span>;
<span class="hljs-keyword">const</span> <span class="hljs-title function_">addToTotal</span> = (<span class="hljs-params">n</span>) =&gt; {
  total += n;
  <span class="hljs-keyword">return</span> total;
}
</code></pre>
<div>
<ul>
<li>Una función que siempre produce el mismo resultado para los mismos argumentos.</li>
<li>Una función que no modifica nada fuera de su ámbito.</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Son predecibles y fáciles de testear</li>
<li>Una función aleatoria sería impura (no es predecible).</li>
<li>Una función que consulta una API es impura (no es predecible).</li>
<li>Efectos secundarios: Cambios fuera del alcance de la función.</li>
<li>Ej: modificar variable global, escribir en disco, llamar API...</li>
<li>No se trata de evitarlas, sino de aislarlas.</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="tama%C3%B1o-de-las-funciones">Tamaño de las funciones</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-comment">// oxlint.json</span>

{
  <span class="hljs-string">&quot;rules&quot;</span>: {
    <span class="hljs-string">&quot;max-lines&quot;</span>: [<span class="hljs-string">&quot;warn&quot;</span>, {
      <span class="hljs-string">&quot;max&quot;</span>: <span class="hljs-number">300</span>,
      <span class="hljs-string">&quot;skipBlankLines&quot;</span>: <span class="hljs-literal">false</span>,
      <span class="hljs-string">&quot;skipComments&quot;</span>: <span class="hljs-literal">false</span>
    }],
    <span class="hljs-string">&quot;max-lines-per-function&quot;</span>: [<span class="hljs-string">&quot;warn&quot;</span>, <span class="hljs-number">50</span>],
  }
}
</code></pre>
<div>
<ul>
<li>Si una función no cabe en tu pantalla... hace demasiadas cosas.</li>
<li>Divídela y que tengan solo una responsabilidad cada una.</li>
<li>No se trata de hacer literalmente una cosa, sino una tarea.</li>
<li>Puedes configurar <code>oxlint</code> para que te ayude a detectarlo.</li>
<li>Formato rápido (número), formato largo (objeto con opciones)</li>
<li>Puedes limitar también el número de líneas por fichero.</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="evita-n%C3%BAmeros-y-strings-m%C3%A1gicos">Evita números y strings mágicos</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> Números mágicos</span>
<span class="hljs-keyword">if</span> (user.<span class="hljs-property">role</span> === <span class="hljs-number">3</span>) <span class="hljs-title function_">showAdminPanel</span>();
<span class="hljs-keyword">if</span> (password.<span class="hljs-property">length</span> &lt; <span class="hljs-number">8</span>) <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Error</span>(<span class="hljs-string">&#x27;Muy corta&#x27;</span>);
<span class="hljs-built_in">setTimeout</span>(logout, <span class="hljs-number">900000</span>); <span class="hljs-comment">// 15 min</span>

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Constantes descriptivas</span>
<span class="hljs-keyword">const</span> <span class="hljs-variable constant_">ROLE_ADMIN</span> = <span class="hljs-number">3</span>;
<span class="hljs-keyword">const</span> <span class="hljs-variable constant_">MIN_PASSWORD_LENGTH</span> = <span class="hljs-number">8</span>;
<span class="hljs-keyword">const</span> <span class="hljs-variable constant_">SESSION_TIMEOUT</span> = <span class="hljs-number">15</span> * <span class="hljs-number">60</span> * <span class="hljs-number">1000</span>;

<span class="hljs-keyword">if</span> (user.<span class="hljs-property">role</span> === <span class="hljs-variable constant_">ROLE_ADMIN</span>) <span class="hljs-title function_">showAdminPanel</span>();
<span class="hljs-keyword">if</span> (password.<span class="hljs-property">length</span> &lt; <span class="hljs-variable constant_">MIN_PASSWORD_LENGTH</span>)
  <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Error</span>(<span class="hljs-string">&#x27;Muy corta&#x27;</span>);
<span class="hljs-built_in">setTimeout</span>(logout, <span class="hljs-variable constant_">SESSION_TIMEOUT</span>);
</code></pre>
<div>
<ul>
<li>Un <code>42</code> o un <code>&quot;alonso&quot;</code> suelto no dice nada.</li>
<li>Crea una constante <code>MAX_VALUE </code>o <code>ADMIN_USER</code> y ayudas a que se entienda mejor.</li>
<li>Los números con separador:  <code>900_000</code> mejor que <code>900000</code>.</li>
<li>Pero aún mejor, <code>15 * 60 * 1000</code> (min x seg x ms)</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="composici%C3%B3n-vs-herencia">Composición vs Herencia</h2>
<ul>
<li>El problema no es usar herencia, es abusar de la herencia</li>
</ul>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Bird</span> {
  <span class="hljs-title function_">fly</span>(<span class="hljs-params"></span>) { <span class="hljs-comment">/* ... */</span> }
}

<span class="hljs-keyword">class</span> <span class="hljs-title class_">Duck</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_ inherited__">Bird</span> {
  <span class="hljs-title function_">quack</span>(<span class="hljs-params"></span>) { <span class="hljs-comment">/* ... */</span> }
}

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="🚨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6a8.svg" data-marp-twemoji=""/> No vuela, pero hereda fly()</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">RubberDuck</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_ inherited__">Duck</span> {
  <span class="hljs-title function_">fly</span>(<span class="hljs-params"></span>) { <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Error</span>(<span class="hljs-string">&#x27;Patito de goma y no hay nada mal&#x27;</span>); }
}
</code></pre>
<pre><code class="language-js"><span class="hljs-comment">// Composición</span>
<span class="hljs-keyword">const</span> canQuack = { <span class="hljs-title function_">quack</span>(<span class="hljs-params"></span>) {} };
<span class="hljs-keyword">const</span> canFly   = { <span class="hljs-title function_">fly</span>(<span class="hljs-params"></span>) {} };

<span class="hljs-keyword">const</span> duck       = { ...canQuack, ...canFly };
<span class="hljs-keyword">const</span> rubberDuck = { ...canQuack };
</code></pre>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="cl%C3%A1usulas-de-guarda--early-returns">Cláusulas de guarda / Early returns</h2>
<ul>
<li>Retorna lo antes posible cuando una condición no se cumple.</li>
<li>Evita anidamiento excesivo y hace que el flujo del código sea más fácil de leer.</li>
</ul>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> Anidación excesiva, difícil de leer</span>
<span class="hljs-keyword">function</span> <span class="hljs-title function_">processOrder</span>(<span class="hljs-params">user, cart</span>) {
  <span class="hljs-keyword">if</span> (user) {
    <span class="hljs-keyword">if</span> (user.<span class="hljs-property">isActive</span>) {
      <span class="hljs-keyword">if</span> (cart.<span class="hljs-property">items</span>.<span class="hljs-property">length</span> &gt; <span class="hljs-number">0</span>) {
        <span class="hljs-keyword">if</span> (cart.<span class="hljs-property">total</span> &gt; <span class="hljs-number">0</span>) {
          <span class="hljs-keyword">return</span> <span class="hljs-title function_">placeOrder</span>(user, cart);
        }
      }
    }
  }
}
</code></pre>
<pre><code class="language-js"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Uso de cláusulas de guarda / early return</span>
<span class="hljs-keyword">function</span> <span class="hljs-title function_">processOrder</span>(<span class="hljs-params">user, cart</span>) {
  <span class="hljs-keyword">if</span> (!user)                  <span class="hljs-keyword">return</span> <span class="hljs-literal">null</span>;
  <span class="hljs-keyword">if</span> (!user.<span class="hljs-property">isActive</span>)         <span class="hljs-keyword">return</span> <span class="hljs-literal">null</span>;
  <span class="hljs-keyword">if</span> (!cart.<span class="hljs-property">items</span>.<span class="hljs-property">length</span>)     <span class="hljs-keyword">return</span> <span class="hljs-literal">null</span>;
  <span class="hljs-keyword">if</span> (cart.<span class="hljs-property">total</span> &lt;= <span class="hljs-number">0</span>)        <span class="hljs-keyword">return</span> <span class="hljs-literal">null</span>;

  <span class="hljs-keyword">return</span> <span class="hljs-title function_">placeOrder</span>(user, cart);
}
</code></pre>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-marpit-scope-ly3d1biv="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="33" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="39">
<h1 id="patrones">Patrones</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="patrones-1">Patrones</h2>
<ul>
<li>Patrones: Estrategias y formas de resolver problemas (que sabemos que funcionan muy bien)</li>
<li>Patrones de diseño (Programación): Formas de resolver con código un problema concreto.</li>
<li>Patrones de UI/UX (Diseño): Formas de ofrecer al usuario una interfaz para una tarea concreta.</li>
</ul>
<p><a href="https://github.com/manzdev/design-patterns"><img src="../assets/patterns.png" alt="alt text" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="patr%C3%B3n-observador-programaci%C3%B3n">Patrón Observador (Programación)</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-keyword">class</span> <span class="hljs-title class_">EventEmitter</span> {
  <span class="hljs-title function_">constructor</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">this</span>.<span class="hljs-property">listeners</span> = {};  <span class="hljs-comment">// Store de listeners</span>
  }

  <span class="hljs-title function_">on</span>(<span class="hljs-params">event, fn</span>) {
    <span class="hljs-comment">// Si no existe, inicializamos</span>
    <span class="hljs-variable language_">this</span>.<span class="hljs-property">listeners</span>[event] ??= [];
    <span class="hljs-variable language_">this</span>.<span class="hljs-property">listeners</span>[event].<span class="hljs-title function_">push</span>(fn);
  }
  <span class="hljs-title function_">emit</span>(<span class="hljs-params">event, data</span>) {
    <span class="hljs-variable language_">this</span>.<span class="hljs-property">listeners</span>[event]?.<span class="hljs-title function_">forEach</span>(<span class="hljs-function"><span class="hljs-params">fn</span> =&gt;</span> <span class="hljs-title function_">fn</span>(data));
  }
}
</code></pre>
<pre><code class="language-js"><span class="hljs-keyword">const</span> emitter = <span class="hljs-keyword">new</span> <span class="hljs-title class_">EventEmitter</span>();

<span class="hljs-comment">// Escuchar</span>
emitter.<span class="hljs-title function_">on</span>(<span class="hljs-string">&#x27;login&#x27;</span>, <span class="hljs-function"><span class="hljs-params">user</span> =&gt;</span>
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Bienvenido <span class="hljs-subst">${user}</span>`</span>)
);
emitter.<span class="hljs-title function_">on</span>(<span class="hljs-string">&#x27;login&#x27;</span>, <span class="hljs-function"><span class="hljs-params">user</span> =&gt;</span>
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Notificando acceso de <span class="hljs-subst">${user}</span>`</span>)
);

<span class="hljs-comment">// Emitir</span>
emitter.<span class="hljs-title function_">emit</span>(<span class="hljs-string">&#x27;login&#x27;</span>, <span class="hljs-string">&#x27;Alons&#x27;</span>);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="patr%C3%B3n-de-reactividad">Patrón de Reactividad</h2>
<ul>
<li>La reactividad es un patrón derivado del patrón «Observador».</li>
<li>Es un patrón en el que los datos se «actualizan» de forma automática (muy usado en ciertos frameworks).</li>
<li>Existe una <a href="https://github.com/tc39/proposal-signals">propuesta</a> para añadirlo nativamente a Javascript</li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Signal</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;https://cdn.jsdelivr.net/npm/signal-polyfill@0.2.2/dist/index.min.js&quot;</span>;

<span class="hljs-keyword">const</span> price = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Signal</span>.<span class="hljs-title class_">State</span>(<span class="hljs-number">100</span>);
<span class="hljs-keyword">const</span> quantity = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Signal</span>.<span class="hljs-title class_">State</span>(<span class="hljs-number">3</span>);
<span class="hljs-keyword">const</span> total = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Signal</span>.<span class="hljs-title class_">Computed</span>( <span class="hljs-function">() =&gt;</span> price.<span class="hljs-title function_">get</span>() * quantity.<span class="hljs-title function_">get</span>() );

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(total.<span class="hljs-title function_">get</span>()); <span class="hljs-comment">// 300 (100 * 3)</span>
price.<span class="hljs-title function_">set</span>(<span class="hljs-number">150</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(total.<span class="hljs-title function_">get</span>()); <span class="hljs-comment">// 450 (150 * 3)</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="patr%C3%B3n-breadcrumbs-dise%C3%B1o">Patrón Breadcrumbs (Diseño)</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1.1rem;">
<div>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;breadcrumbs&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;part&quot;</span>&gt;</span>Home<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;part&quot;</span>&gt;</span>Articles<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;part&quot;</span>&gt;</span>Temática<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
<pre><code class="language-css"><span class="hljs-selector-pseudo">:root</span> {
  <span class="hljs-attr">--offset</span>: <span class="hljs-number">0.75rem</span>;
  <span class="hljs-attr">--shape-part</span>: <span class="hljs-built_in">polygon</span>(<span class="hljs-number">0</span> <span class="hljs-number">0</span>,
    <span class="hljs-built_in">calc</span>(<span class="hljs-number">100%</span> - <span class="hljs-built_in">var</span>(--offset)) <span class="hljs-number">0</span>, <span class="hljs-number">100%</span> <span class="hljs-number">50%</span>,
    <span class="hljs-built_in">calc</span>(<span class="hljs-number">100%</span> - <span class="hljs-built_in">var</span>(--offset)) <span class="hljs-number">100%</span>, <span class="hljs-number">0</span> <span class="hljs-number">100%</span>,
    <span class="hljs-built_in">var</span>(--offset) <span class="hljs-number">50%</span>
  );
}
</code></pre>
</div>
<pre><code class="language-css"><span class="hljs-selector-class">.breadcrumbs</span> {
  <span class="hljs-attribute">display</span>: flex;
  <span class="hljs-attribute">color</span>: <span class="hljs-number">#ccc</span>;
  <span class="hljs-attribute">font-family</span>: <span class="hljs-string">&quot;Victor Mono&quot;</span>, sans-serif;
  <span class="hljs-attribute">font-weight</span>: <span class="hljs-number">600</span>;
  <span class="hljs-attribute">filter</span>: <span class="hljs-built_in">drop-shadow</span>(<span class="hljs-number">0</span> <span class="hljs-number">0</span> <span class="hljs-number">2px</span> <span class="hljs-number">#2229</span>);
  <span class="hljs-attribute">cursor</span>: pointer;

  <span class="hljs-selector-class">.part</span> {
    <span class="hljs-attribute">background</span>: <span class="hljs-number">#222</span>;
    <span class="hljs-attribute">padding</span>: <span class="hljs-number">0.5rem</span> <span class="hljs-number">2rem</span>;
    <span class="hljs-attribute">clip-path</span>: <span class="hljs-built_in">var</span>(--shape-part);

    &amp;<span class="hljs-selector-pseudo">:hover</span> { <span class="hljs-attribute">background</span>: indigo }
  }
}
</code></pre>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="introducci%C3%B3n-a-componentes">Introducción a componentes</h2>
<ul>
<li>Cambiar el enfoque global por un enfoque local</li>
<li>Pequeños fragmentos de HTML/CSS/JS reutilizables, enfocados en una parte concreta</li>
</ul>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1.1rem;">
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;user&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>Paco<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">img</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;images/paco.webp&quot;</span> <span class="hljs-attr">alt</span>=<span class="hljs-string">&quot;Paco&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;user&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>Sara<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">img</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;images/sara.webp&quot;</span> <span class="hljs-attr">alt</span>=<span class="hljs-string">&quot;Sara&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-comment">&lt;!-- ... --&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>
</code></pre>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">user-component</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;Paco&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">user-component</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">user-component</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;Sara&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">user-component</span>&gt;</span>

  <span class="hljs-tag">&lt;<span class="hljs-name">script</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;module&quot;</span>&gt;</span><span class="language-javascript">
    <span class="hljs-keyword">const</span> user = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;user-component&quot;</span>);
    user.<span class="hljs-title function_">action</span>();  <span class="hljs-comment">// Su propio JS</span>
    user.<span class="hljs-property">shadowRoot</span>.<span class="hljs-property">adoptedStyleSheet</span> <span class="hljs-comment">// Su propio CSS</span>
  </span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>
</code></pre>
