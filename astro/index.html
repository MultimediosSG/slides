<h2 id="%C2%BFqu%C3%A9-es-astro">¿Qué es Astro?</h2>
<ul>
<li>Arquitectura de navegación: <strong>MPA</strong>, <strong>SPA</strong></li>
<li>Modalidad de renderizado: <strong>SSG</strong>, <strong>SSR</strong>, <strong>CSR</strong> → <a href="../assets/ssr-ssg-csr.png">Modalidades</a></li>
<li>Ejemplos:
<ul>
<li><strong>React</strong> = SPA + CSR (HTML casi vacío + JS lo hace todo en cliente)</li>
<li><strong>NextJS</strong> = SPA + SSR (aunque también puede otros como SSG o CSR)</li>
<li><strong>Astro</strong> = MPA + SSG (aunque también puede SPA con frameworks UI y SSR)</li>
<li><strong>Laravel</strong> = MPA + SSR (apps con backends más tradicionales, como PHP o Java)</li>
<li><strong>HTML/JS vanilla</strong> = MPA/SPA + CSR/SSR/SSG (puede ser cualquiera)</li>
</ul>
</li>
</ul>

<div>

</ul>
</div>
</step>
<step>
<pre><code class="language-js">{

<div>
<ul>

<li>Ahora, en los import podemos usar aliases

<h1 id="frontmatter">FrontMatter</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="frontmatter-de-astro">FrontMatter de Astro</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<div>
<ul>
<li>
<p>Los <code>.astro</code> provienen de los FrontMatter → <a href="https://jekyllrb.com/docs/front-matter/">Front Matter</a></p>
</li>
<li>
<p>Front Matter de <strong>Jekyll</strong> → <code>YAML</code> + <code>.md</code> (markdown)</p>
</li>
<li>
<p>Front Matter de <strong>Astro</strong> → <code>NodeJS</code> + <code>.html</code></p>
</li>
<li>
<p>Puedes empezar en <code>src/pages/index.astro</code></p>
</li>
<li>
<p>Cuando haces <code>pnpm run dev</code>...</p>
<ul>
<li>Se ejecuta node, y se manda HTML al browser</li>
</ul>
</li>
<li>
<p>Cuando haces <code>pnpm run build</code>...</p>
<ul>
<li>Se ejecuta node, y se genera el HTML en <code>dist/</code></li>
</ul>
</li>
</ul>
</div>
<steps>
<step>
<pre><code class="language-js">---
# frontmatter.<span class="hljs-property">md</span>
<span class="hljs-attr">title</span>: <span class="hljs-string">&quot;Presentación&quot;</span>
<span class="hljs-attr">author</span>: <span class="hljs-string">&quot;ManzDev&quot;</span>
<span class="hljs-attr">date</span>: <span class="hljs-string">&quot;2026-06-30&quot;</span>
---

<span class="hljs-title class_">Hola</span> a **todos**, ¿Cómo se encuentran? <span class="hljs-title class_">Echa</span> un vistazo a mi nueva página de [<span class="hljs-title class_">Inteligencia</span> <span class="hljs-title class_">Artificial</span> local](<span class="hljs-attr">https</span>:<span class="hljs-comment">//ai.manz.dev/).</span>
</code></pre>
</step>
<step>
<pre><code class="language-js">---
<span class="hljs-comment">// index.astro</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Hola, yo soy NodeJS&quot;</span>);
---

<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>¡Hola, amigos!<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span></span>
<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>¿Qué tal están?<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span></span>
<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript">
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Yo soy JS del browser.&quot;</span>);
</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span></span>
</code></pre>
</step>
</steps>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="la-filosof%C3%ADa-de-astro">La filosofía de Astro</h2>
<ul>
<li>
<p><img class="emoji" draggable="false" alt="🟥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e5.svg" data-marp-twemoji=""/> <strong>Problema:</strong> Las webs tienen cada vez más <strong>Javascript cliente</strong></p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🟥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e5.svg" data-marp-twemoji=""/> <strong>Problema:</strong> Los developers tienden a usar <strong>Javascript innecesario</strong> por comodidad</p>
<ul>
<li><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e9.svg" data-marp-twemoji=""/> ...cuando lo lógico sería utilizar <strong>HTML</strong> antes que <strong>Javascript</strong></li>
</ul>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f680.svg" data-marp-twemoji=""/> <strong>Astro</strong> sabe esto, así que plantea la filosofía <strong>Zero JS</strong></p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e9.svg" data-marp-twemoji=""/> Si quieres hacer algo con Javascript, lo haces en la parte de <strong>Node</strong> (fenced)</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e9.svg" data-marp-twemoji=""/> <strong>Astro</strong> ejecuta ese Javascript y lo «reduce a HTML»</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e9.svg" data-marp-twemoji=""/> <strong>Astro</strong> envía al navegador todo lo posible <strong>reducido</strong> a HTML, sin Javascript</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>Nota:</strong> Si usas un <code>&lt;script&gt;</code> <strong>sí</strong> estás enviando Javascript a cliente</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="ejemplo-sencillo-de-p%C3%A1gina-con-astro">Ejemplo sencillo de página con Astro</h2>
<ul>
<li>Así puedes usar Javascript, pero con los beneficios de tenerlo todo estático en HTML</li>
</ul>
<pre><code class="language-js">---
<span class="hljs-keyword">const</span> title = <span class="hljs-string">&quot;Mi página web&quot;</span>;
<span class="hljs-keyword">const</span> description = <span class="hljs-string">&quot;Esta es la página principal de mi página web.&quot;</span>
---

<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">html</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">head</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">title</span>&gt;</span>{title}<span class="hljs-tag">&lt;/<span class="hljs-name">title</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">meta</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;description&quot;</span> <span class="hljs-attr">content</span>=<span class="hljs-string">{description}</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">head</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>ManzDev Website<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">html</span>&gt;</span>
</span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="rutas-p%C3%A1ginas">Rutas (páginas)</h2>
<ul>
<li>
<p><img class="emoji" draggable="false" alt="📁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c1.svg" data-marp-twemoji=""/> Las rutas en Astro viven en <code>/src/pages/</code></p>
<ul>
<li>Se acceden a ellas por el nombre que pongas</li>
<li><code>/src/pages/index.astro</code> es <code>/</code> o <code>/index.html</code></li>
<li><code>/src/pages/about.astro</code> es <code>/about/</code> o <code>/about/index.html</code></li>
<li><code>/src/pages/about/index.astro</code> es <code>/about/</code> o <code>/about/index.html</code></li>
</ul>
</li>
<li>
<p><img class="emoji" draggable="false" alt="👀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f440.svg" data-marp-twemoji=""/> Páginas especiales <code>/src/pages/404.astro</code></p>
<ul>
<li>Cuando ocurre un <strong>error 404</strong> (página no encontrada)</li>
</ul>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Se aconseja separar partes pequeñas en <strong>componentes</strong></p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🧱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9f1.svg" data-marp-twemoji=""/> Más adelante separaremos en <strong>Layouts</strong> (de momento, simplificaremos)</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="componentes-de-astro">Componentes de Astro</h2>
<ul>
<li><img class="emoji" draggable="false" alt="🟪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7ea.svg" data-marp-twemoji=""/> Idea principal: Separar lógica relacionada en ficheros individuales</li>
</ul>
<split-slide style="--font-size: .9rem;">
<pre><code class="language-js">---
<span class="hljs-keyword">const</span> title = <span class="hljs-string">&quot;Mi pequeño componente&quot;</span>;
---

<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">style</span>&gt;</span><span class="language-css">
  <span class="hljs-comment">/* Estilos CSS */</span>
</span><span class="hljs-tag">&lt;/<span class="hljs-name">style</span>&gt;</span></span>

<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;container&quot;</span>&gt;</span>
  <span class="hljs-comment">&lt;!-- El HTML del componente --&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span></span>
</code></pre>
<div>
<pre><code class="language-js">---
<span class="hljs-comment">/* Fichero: /src/pages/index.astro */</span>
<span class="hljs-keyword">import</span> <span class="hljs-title class_">Componente</span> <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@/components/Componente.astro
---

&lt;Componente&gt;&lt;/Componente&gt;
&lt;Componente /&gt;
</span></code></pre>
<ul>
<li><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f680.svg" data-marp-twemoji=""/> En <code>PascalCase</code> para Astro
<ul>
<li>→ <code>&lt;Componente&gt;&lt;/Componente&gt;</code></li>
<li>→ Se pueden autocerrar: <code>&lt;Componente /&gt;</code></li>
</ul>
</li>
<li><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f680.svg" data-marp-twemoji=""/> En <code>kebab-case</code> para WebComponents
<ul>
<li>→ <code>&lt;small-component&gt;&lt;/small-component&gt;</code></li>
</ul>
</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="props">Props</h2>
<ul>
<li><img class="emoji" draggable="false" alt="✈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2708.svg" data-marp-twemoji=""/> Enviar datos a través de «atributos» en Astro</li>
<li>Si tenemos muchos datos, se puede enviar desestructurando <code>&lt;Componente {...data} /&gt;</code> (más cómodo)</li>
</ul>
<split-slide style="--left: 55%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js">---
<span class="hljs-keyword">import</span> <span class="hljs-title class_">Componente</span> <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@/components/Componente.astro&quot;</span>;
<span class="hljs-keyword">const</span> title = <span class="hljs-string">&quot;Título de la página&quot;</span>;
---

&lt;!-- <span class="hljs-title class_">Enviamos</span> los datos al componente --&gt;
<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Componente</span> <span class="hljs-attr">title</span>=<span class="hljs-string">{title}</span> /&gt;</span></span>
</code></pre>
<pre><code class="language-js">---
<span class="hljs-keyword">const</span> { title } = <span class="hljs-title class_">Astro</span>.<span class="hljs-property">props</span>;  <span class="hljs-comment">// Recibe los datos de los props</span>
---

<span class="hljs-title class_">Informaci</span>ón <span class="hljs-attr">recibida</span>: {title}
</code></pre>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="slots">Slots</h2>
<ul>
<li><img class="emoji" draggable="false" alt="✈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2708.svg" data-marp-twemoji=""/> Si tenemos que enviar HTML a un componente, es más apropiado hacerlo por slots</li>
<li>Los slots son «ranuras» que creamos en los componentes para enviar información extensa desde fuera</li>
<li><img class="emoji" draggable="false" alt="➡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/27a1.svg" data-marp-twemoji=""/> También se pueden usar múltiples <code>&lt;slots&gt;</code> (slots nombrados)</li>
</ul>
<steps>
<step>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<div>
<pre><code class="language-js">---
<span class="hljs-keyword">import</span> <span class="hljs-title class_">Componente</span> <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@/components/Componente.astro&quot;</span>;
---
<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Componente</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>Hola amigo mío<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>¿Cómo te encuentras?<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">Componente</span>&gt;</span></span>

<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Componente</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">Componente</span>&gt;</span></span>  &lt;!-- o &lt;<span class="hljs-title class_">Componente</span> /&gt; --&gt;
</code></pre>
<p>Componente 1: muestra el contenido interior. Componente 2: texto por defecto.</p>
</div>
<pre><code class="language-js">---
---
<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">slot</span>&gt;</span>Contenido por defecto<span class="hljs-tag">&lt;/<span class="hljs-name">slot</span>&gt;</span></span>
</code></pre>
</split-slide>
</step>
<step>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js">---
<span class="hljs-keyword">import</span> <span class="hljs-title class_">Componente</span> <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@/components/Componente.astro&quot;</span>;
---
<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Componente</span> /&gt;</span></span>
  <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">h1</span> <span class="hljs-attr">slot</span>=<span class="hljs-string">&quot;name&quot;</span>&gt;</span>ManzDev<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span></span>
  <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">slot</span>=<span class="hljs-string">&quot;text&quot;</span>&gt;</span>Streamer de programación en español.<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span></span>
&lt;/<span class="hljs-title class_">Componente</span>&gt;

<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Componente</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">Componente</span>&gt;</span></span>  &lt;!-- o &lt;<span class="hljs-title class_">Componente</span> /&gt; --&gt;
</code></pre>
<pre><code class="language-js">---
---
<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">slot</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;name&quot;</span>&gt;</span>Nombre desconocido<span class="hljs-tag">&lt;/<span class="hljs-name">slot</span>&gt;</span></span>
<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">slot</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;text&quot;</span>&gt;</span>El personaje no tiene descripción.<span class="hljs-tag">&lt;/<span class="hljs-name">slot</span>&gt;</span></span>
</code></pre>
</split-slide>
</step>
</steps>
</section>

<h1 id="css-y-javascript-en-astro">CSS y Javascript en Astro</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="css-en-astro">CSS en Astro</h2>
<ul>
<li>
<p><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Forma preferida: Coloca un <code>&lt;style&gt;&lt;/style&gt;</code> en cada componente</p>
<ul>
<li>Es local (los estilos solo afectan al fichero donde están)</li>
<li>Astro se encarga de ponerlo en un fichero <code>.css</code> a parte</li>
<li>Nosotros lo tenemos organizado en el componente donde afecta</li>
</ul>
</li>
<li>
<p><img class="emoji" draggable="false" alt="💠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a0.svg" data-marp-twemoji=""/> Otras formas:</p>
<ul>
<li><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/32-20e3.svg" data-marp-twemoji=""/> <code>&lt;style is:global&gt;</code> o <code>:global(...) { ... }</code> si queremos estilos globales (a toda la app)</li>
<li><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/33-20e3.svg" data-marp-twemoji=""/> <code>import &quot;./styles.css&quot;</code> → El estilo es global a toda la app (útil para reutilizar)</li>
<li><img class="emoji" draggable="false" alt="4️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/34-20e3.svg" data-marp-twemoji=""/> <code>import styles from &quot;./Component.module.css&quot;</code> → si quieres usar <a href="https://lenguajecss.com/herramientas-css/css-in-js/css-modules/">Javascript CSS Modules</a></li>
<li><img class="emoji" draggable="false" alt="5️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/35-20e3.svg" data-marp-twemoji=""/> Con <code>&lt;style is:inline&gt;</code> puedes decirle a Astro que inserte los estilos tal cual sin procesarlos</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="javascript-en-astro">Javascript en Astro</h2>
<ul>
<li>
<p><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Forma preferida: Con <code>&lt;script&gt;</code></p>
</li>
<li>
<p>Astro lo procesa y lo pone en un fichero <code>.js</code> a parte</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="💠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a0.svg" data-marp-twemoji=""/> Otras formas:</p>
<ul>
<li><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Con <code>&lt;script type=&quot;module&quot;&gt;</code> → Astro no lo procesa, se usa tal cuál</li>
<li><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Con <code>&lt;script is:inline&gt;</code> → Astro lo coloca en el HTML (sin procesarlos)</li>
</ul>
</li>
</ul>
<p><img class="emoji" draggable="false" alt="🛑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6d1.svg" data-marp-twemoji=""/> CUIDADO: No hay scope por componentes del DOM o Javascript → WebComponents<br />
WebComponents en un componente Astro → <a href="https://lenguajejs.com/astro/scripts/webcomponents/">https://lenguajejs.com/astro/scripts/webcomponents/</a><br />
Aquí la <a href="https://lenguajejs.com/astro/scripts/javascript/#soporte-de-import-en-astro">diferencia entre imports en Astro</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="pasar-informaci%C3%B3n-de-node-a-cliente">Pasar información de node a cliente</h2>
<ul>
<li>Con <code>class:list={list}</code> puedes pasar arrays de strings de nodeJS a clases en HTML</li>
<li>Con <code>define:vars={list}</code> puedes enviar datos de nodeJS a JS/CSS (sólo usar en último caso)</li>
</ul>
<pre><code class="language-js">---
<span class="hljs-keyword">const</span> classList = [<span class="hljs-string">&quot;container&quot;</span>, <span class="hljs-string">&quot;title&quot;</span>];
---

<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class:list</span>=<span class="hljs-string">{classList}</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>Título de página<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
  {classList}
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span></span>

<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">script</span> <span class="hljs-attr">define:vars</span>=<span class="hljs-string">{{</span> <span class="hljs-attr">classList</span> }}&gt;</span><span class="language-javascript">
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(classList);
</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span></span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">

 <div>
<ul>
<li><img class="emoji" draggable="false" alt="🧊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ca.svg" data-marp-twemoji=""/> ¿Necesitas utilizar iconos? ¡Vamos a usar SuperSVG!</li>
<li><img class="emoji" draggable="false" alt="🎷" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3b7.svg" data-marp-twemoji=""/> Instalación → <code>pnpm install -D vite-plugin-supersvg</code></li>

<pre><code class="language-js"><span class="hljs-keyword">import</span> { defineConfig } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;astro/config&quot;</span>;

});

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="utilizando-paquetes-de-npm-para-nodejs">Utilizando paquetes de NPM para nodejs</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js">---
<span class="hljs-keyword">import</span> markdownIt <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;markdown-it&quot;</span>;

<span class="hljs-keyword">const</span> text = <span class="hljs-string">`
# Tema 1

En este *fragmento de texto* vamos a hablar de un tema **muy importante**: la pizza.
`</span>;
<span class="hljs-keyword">const</span> md = <span class="hljs-title function_">markdownIt</span>();
<span class="hljs-keyword">const</span> result = md.<span class="hljs-title function_">render</span>(text);

---

<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;content&quot;</span> <span class="hljs-attr">set:html</span>=<span class="hljs-string">{result}</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span></span>
</code></pre>
 <div>
<ul>
<li>
<p>Paquete de node: <code>markdown-it</code></p>
</li>
<li>
<p>Lo necesitamos sólo en local</p>
<ul>
<li>Astro lo usa y renderiza el HTML estático</li>
<li>Ese HTML estático es el que se sube a la web</li>
<li>Por lo tanto, <code>markdown-it</code> es dependencia de desarrollo</li>
</ul>
</li>
<li>
<p>Se instala con <code>pnpm install -D markdown-it</code></p>
</li>
<li>
<p>La librería <code>markdown-it</code> pasa markdown a HTML</p>
</li>
<li>
<p>Una vez tenemos el resultado (<code>result</code>) renderizado...</p>
<ul>
<li>Lo insertamos en el HTML con un <code>set:html</code></li>
<li>Es equivalente a un <code>innerHTML</code></li>
</ul>
</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="utilizando-paquetes-de-npm-para-cliente">Utilizando paquetes de NPM para cliente</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<steps>
<step>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">style</span>&gt;</span><span class="language-css">
  <span class="hljs-selector-class">.box</span> {
    <span class="hljs-attribute">width</span>: <span class="hljs-number">200px</span>;
    <span class="hljs-attribute">height</span>: <span class="hljs-number">200px</span>;
    <span class="hljs-attribute">background</span>: <span class="hljs-built_in">linear-gradient</span>(indigo, deeppink);
    <span class="hljs-attribute">color</span>: white;
    <span class="hljs-attribute">font-size</span>: <span class="hljs-number">2.25rem</span>;
    <span class="hljs-attribute">display</span>: grid;
    <span class="hljs-attribute">place-items</span>: center;
    <span class="hljs-attribute">font-weight</span>: <span class="hljs-number">600</span>;

    <span class="hljs-attribute">transform-style</span>: preserve-<span class="hljs-number">3</span>d;
    <span class="hljs-selector-tag">span</span> { <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">translateZ</span>(<span class="hljs-number">25px</span>); }
  }
</span><span class="hljs-tag">&lt;/<span class="hljs-name">style</span>&gt;</span>
</code></pre>
</step>
<step>
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- El paquete en cliente se usa en &lt;script&gt; --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;box&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">span</span>&gt;</span>ManzDev<span class="hljs-tag">&lt;/<span class="hljs-name">span</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript">
  <span class="hljs-keyword">import</span> <span class="hljs-title class_">Tilt</span> <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;vanilla-tilt&quot;</span>;

  <span class="hljs-keyword">const</span> box = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.box&quot;</span>);
  <span class="hljs-title class_">Tilt</span>.<span class="hljs-title function_">init</span>(box, {
    <span class="hljs-attr">glare</span>: <span class="hljs-literal">true</span>,
    <span class="hljs-attr">perspective</span>: <span class="hljs-number">500</span>,
    <span class="hljs-attr">max</span>: <span class="hljs-number">35</span>,
    <span class="hljs-comment">/* Más opciones */</span>
  });
</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
</code></pre>
</step>
</steps>
<div>
<ul>
<li>
<p>Primero, añadimos un CSS para un HTML sencillo</p>
</li>
<li>
<p>Estilos CSS simples</p>
</li>
<li>

  <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">SiteFooter</span> /&gt;</span></span>

  <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript">
    <span class="hljs-keyword">const</span> $main = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;main.games&quot;</span>);

    games.<span class="hljs-title function_">forEach</span>(<span class="hljs-function"><span class="hljs-params">game</span> =&gt;</span> {

    });
  </span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
</span></code></pre>
<div>
<ul>

</li>

<p><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Por cada <code>game:</code></p>

<div>
<ul>

}

<div>
<ul>

<h2 id="stop-%C2%BFproblemas">STOP ¿Problemas?</h2>
<ul>
<li>
<p><img class="emoji" draggable="false" alt="📒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4d2.svg" data-marp-twemoji=""/> Trabajamos en Javascript cliente (¿necesario?)</p>
<ul>
<li>Los posters se pueden construir en local</li>
<li>...y subirlos a la web ya construidos (no cambian)</li>
<li>Al ser estático, es más eficiente</li>
</ul>
</li>
<li>
<p><img class="emoji" draggable="false" alt="📃" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c3.svg" data-marp-twemoji=""/> Descargamos toda la info (JSON) al navegador (la necesitemos o no)</p>
<ul>
<li>Se podría descargar sólo la info necesaria (imagen y name)</li>
<li>...reduciendo el tamaño del json a descargar</li>
</ul>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🟨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e8.svg" data-marp-twemoji=""/> Hay partes que <strong>DEBEN</strong> ser Javascript cliente</p>
<ul>
<li>Por ejemplo, el sonido no puedes hacerlo en Node</li>
<li>...debe crearse con Javascript cliente</li>
</ul>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🟥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e5.svg" data-marp-twemoji=""/> Hacer páginas individuales con JS (SPA, tedioso y anti-SEO-friendly)</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="app-con-mentalidad-astro">App (con mentalidad Astro)</h2>
<steps>
<step>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js">---
<span class="hljs-keyword">import</span> <span class="hljs-variable constant_">GAMES</span> <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@/data/games.json&quot;</span>;
<span class="hljs-comment">// ...</span>
---

  <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">main</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;games&quot;</span>&gt;</span>
    {GAMES.map(game =&gt; (
      <span class="hljs-tag">&lt;<span class="hljs-name">img</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;poster&quot;</span>
           <span class="hljs-attr">src</span>=<span class="hljs-string">{</span>&quot;/<span class="hljs-attr">covers</span>/&quot; + <span class="hljs-attr">game.image</span>}
           <span class="hljs-attr">alt</span>=<span class="hljs-string">{game.name}</span>
      /&gt;</span>))}
  <span class="hljs-tag">&lt;/<span class="hljs-name">main</span>&gt;</span></span>
</code></pre>
<div>
<ul>
<li>
<p><img class="emoji" draggable="false" alt="🟨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e8.svg" data-marp-twemoji=""/> En lugar de hacerlo en Javascript cliente...</p>
<ul>
<li>Vamos a crearlo en local con Astro</li>
<li>...para que el navegador lo reciba ya construído</li>
</ul>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e9.svg" data-marp-twemoji=""/> Movemos el <code>games.json</code> de <code>public/</code> a <code>src/data</code></p>
<ul>
<li>El JSON no va a llegar al cliente, solo en local</li>
</ul>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e9.svg" data-marp-twemoji=""/> Utilizamos un <code>.map()</code> para recorrer la estructura</p>
<ul>
<li>...se renderiza el HTML en local</li>
<li>...se envía ya construído al navegador</li>
</ul>
</li>
</ul>
</div>
</split-slide>
</step>
<step>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js">---
<span class="hljs-keyword">import</span> <span class="hljs-variable constant_">GAMES</span> <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@/data/games.json&quot;</span>;
<span class="hljs-keyword">import</span> <span class="hljs-title class_">GamePoster</span> <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@/components/GamePoster.astro&quot;</span>;
<span class="hljs-comment">// ...</span>
---

  <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">main</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;games&quot;</span>&gt;</span>
    {GAMES.map(game =&gt; (<span class="hljs-tag">&lt;<span class="hljs-name">GamePoster</span> {<span class="hljs-attr">...game</span>} /&gt;</span>))}
  <span class="hljs-tag">&lt;/<span class="hljs-name">main</span>&gt;</span></span>
</code></pre>
<div>
<ul>
<li>
<p><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e9.svg" data-marp-twemoji=""/> Una buena práctica: dividir en componentes</p>
</li>
<li>
<p>Creamos/importamos componente <code>GamePoster.astro</code></p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e9.svg" data-marp-twemoji=""/> En el <code>.map()</code> en lugar de poner todo el HTML...</p>
<ul>
<li>...ponemos el componente (más simple y separamos)</li>
<li>...pasamos los datos de cada item del <code>.map()</code></li>
<li>En lugar de pasarlas una por una, desestructuramos</li>

</li>
</ul>

</split-slide>
</step>
<step>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js"> ---

<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">style</span>&gt;</span><span class="language-css">

  <span class="hljs-attribute">object-fit</span>: cover;

}
</span><span class="hljs-tag">&lt;/<span class="hljs-name">style</span>&gt;</span></span>
</code></pre>
<div>
<ul>
<li>
<p><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e9.svg" data-marp-twemoji=""/> Tenemos un componente con todo lo relacionado</p>
<ul>
<li>Más organizado y fácil de leer.</li>
<li>Fácil de mantener y modificar.</li>
</ul>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🎲" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3b2.svg" data-marp-twemoji=""/> Desestructuramos los datos desde <code>Astro.props</code></p>
<ul>

<li>Sacamos del CSS global, ya que solo lo queremos para este</li>
</ul>
</li>

</div>
</split-slide>
</step>
<step>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript">
  <span class="hljs-keyword">const</span> $main = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;main.games&quot;</span>);
  <span class="hljs-keyword">const</span> hover = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Audio</span>(<span class="hljs-string">&quot;/sounds/hover.mp3&quot;</span>);

  $main?.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;pointerover&quot;</span>, <span class="hljs-function">(<span class="hljs-params">ev</span>) =&gt;</span> {
    <span class="hljs-keyword">const</span> poster = ev.<span class="hljs-property">target</span>.<span class="hljs-title function_">closest</span>(<span class="hljs-string">&quot;.poster&quot;</span>);
    <span class="hljs-keyword">if</span> (!poster) <span class="hljs-keyword">return</span>;

  });
</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
</code></pre>
<div>
<ul>
<li>Seleccionamos el elemento <code>&lt;main&gt;</code></li>
<li>Usamos delegación de eventos</li>
<li>Cargamos el sonido en <code>hover</code></li>
<li>Cada vez que te muevas (pointerover) por <code>&lt;main&gt;</code>
<ul>
<li>Descartamos cuando no haya un elemento padre <code>.poster</code></li>
<li>Descartamos cuando estes en el mismo elemento <code>.poster</code></li>
</ul>
</li>
<li>Reproducimos sonido</li>
</ul>
</div>
</split-slide>
</step>
<step>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js">---

  <span class="hljs-tag">&lt;<span class="hljs-name">img</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;poster&quot;</span> <span class="hljs-attr">src</span>=<span class="hljs-string">{</span>&quot;/<span class="hljs-attr">covers</span>/&quot; + <span class="hljs-attr">image</span>} <span class="hljs-attr">alt</span>=<span class="hljs-string">{name}</span> /&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span></span>

<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">style</span>&gt;</span><span class="language-css">

<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript">
  <span class="hljs-comment">/* ... */</span>
</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span></span>
</code></pre>
<div>
<ul>
<li>
<p><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Ahora envolvemos la imagen con un enlace <code>&lt;a&gt;</code></p>

<h2 id="rutas-din%C3%A1micas-en-astro">Rutas dinámicas en Astro</h2>
<ul>
<li>
<p><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Hasta ahora hemos creado <strong>rutas estáticas</strong> → Accedes a una ruta directamente</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> No vamos a crear todas las rutas de cada juego (¿y si tengo 300 juegos?)</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Lo que haremos es indicarle a Astro:</p>
<ul>
<li>...todos los juegos que hay</li>
<li>...una plantilla dinámica</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> El revisará todos los juegos y la plantilla, y creará una página por cada uno</li>
</ul>
</li>
<li>
<p>Si intentamos hacer una ruta estática con los juegos, nos aparecerá...</p>
<ul>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> ERROR: <code>getStaticPaths()</code> function required for dynamic routes.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="las-rutas-din%C3%A1micas-getstaticpaths">Las rutas dinámicas: <code>getStaticPaths()</code></h2>
<steps>
<step>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js">---
<span class="hljs-keyword">export</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">getStaticPaths</span>(<span class="hljs-params"></span>) {
  <span class="hljs-keyword">return</span> [
    { <span class="hljs-attr">params</span>: { <span class="hljs-attr">slug</span>: <span class="hljs-string">&quot;beneath-steel-sky&quot;</span> }},
    { <span class="hljs-attr">params</span>: { <span class="hljs-attr">slug</span>: <span class="hljs-string">&quot;gabriel-knight&quot;</span> }}
  ];
}

<span class="hljs-keyword">const</span> { slug } = <span class="hljs-title class_">Astro</span>.<span class="hljs-property">params</span>;

---

{slug}
</code></pre>
<div>
<ul>
<li>
<p><img class="emoji" draggable="false" alt="📁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c1.svg" data-marp-twemoji=""/> Vamos a la carpeta <code>src/pages/games/</code></p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="📄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c4.svg" data-marp-twemoji=""/> Renombramos <code>index.astro</code> a <code>[slug].astro</code></p>
<ul>
<li>Los corchetes indican que es página dinámica</li>
<li>El nombre del interior es la variable implicada</li>
<li>Para la URL <code>/games/monkey-island</code>...
<ul>
<li><code>slug</code> va a contener <code>monkey-island</code></li>
</ul>
</li>
</ul>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e9.svg" data-marp-twemoji=""/> Exportamos la función <code>getStaticPaths()</code></p>
<ul>
<li>Devolvemos un <code>Array</code> donde tiene un objeto por página</li>
<li><code>/games/beneath-steel-sky</code> → <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li><code>/games/gabriel-knight</code> → <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li><code>/games/monkey-island</code> → <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/></li>
<li><code>/games/broken-sword</code> → <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/></li>
</ul>
</li>
</ul>
</div>
</split-slide>
</step>
<step>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js">---
<span class="hljs-keyword">import</span> <span class="hljs-variable constant_">GAMES</span> <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@/data/games.json&quot;</span>;

<span class="hljs-keyword">export</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">getStaticPaths</span>(<span class="hljs-params"></span>) {
  <span class="hljs-keyword">return</span> <span class="hljs-variable constant_">GAMES</span>.<span class="hljs-title function_">map</span>(<span class="hljs-function"><span class="hljs-params">game</span> =&gt;</span> ({ <span class="hljs-attr">params</span>: { <span class="hljs-attr">slug</span>: game.<span class="hljs-property">slug</span> } }));
}

<span class="hljs-comment">// Procesamiento por página</span>
<span class="hljs-keyword">const</span> { slug } = <span class="hljs-title class_">Astro</span>.<span class="hljs-property">params</span>;
<span class="hljs-keyword">const</span> data = <span class="hljs-variable constant_">GAMES</span>.<span class="hljs-title function_">find</span>(<span class="hljs-function"><span class="hljs-params">game</span> =&gt;</span> game.<span class="hljs-property">slug</span> === slug);
---

<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">pre</span>&gt;</span>{JSON.stringify(data)}<span class="hljs-tag">&lt;/<span class="hljs-name">pre</span>&gt;</span></span>
</code></pre>
<div>
<ul>
<li>
<p><img class="emoji" draggable="false" alt="📁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c1.svg" data-marp-twemoji=""/> Importamos desde <code>@/data/games.json</code></p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e9.svg" data-marp-twemoji=""/> En la función <code>getStaticPaths()</code></p>
<ul>
<li>Recorremos <code>GAMES</code> y devolvemos el objeto...</li>
<li><img class="emoji" draggable="false" alt="➡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/27a1.svg" data-marp-twemoji=""/> <code>{ params: { slug: &quot;SLUG-DEL-JUEGO&quot; } }</code></li>
</ul>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🟪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7ea.svg" data-marp-twemoji=""/> En cada página, <code>data</code>...</p>
<ul>
<li>Guarda los datos del juego en cuestión</li>
</ul>
</li>
<li>
<p>Ahora podemos acceder a todos los juegos:</p>
<ul>
<li><code>/games/beneath-steel-sky</code> → <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li><code>/games/gabriel-knight</code> → <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li><code>/games/monkey-island</code> → <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li><code>/games/broken-sword</code> → <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></li>
</ul>
</li>
</ul>
</div>
</split-slide>
</step>
</steps>
</section>
