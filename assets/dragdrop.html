<html>

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
</head>

<body>
  <section>
    <img class="char duck" src="./dragdrop_files/pato.png" alt="Pato">
    <img class="char cat" src="./dragdrop_files/cat.png" alt="Pato">
    <div class="box"></div>
  </section>
  <div class="status">
    Evento disparado: Moving duck...
    <br>
  </div>

  <style>
    section {
      display: flex;
      gap: 1rem;
    }

    .char {
      width: 128px;
      height: 128px;
    }

    .box {
      width: 150px;
      height: 150px;
      border: 3px solid deeppink;
      background: repeating-linear-gradient(133deg, deeppink 0 2px, transparent 2.5px 16px, deeppink 16.5px 17px);
    }

    .status {
      background: #222;
      color: #fff;
      padding: 1rem;
      height: 75px;
      margin: 1rem 0;
      overflow-y: scroll;

      &::first-line {
        color: gold;
      }
    }
  </style>

  <script type="module">
    const duck = document.querySelector(".duck");
    const cat = document.querySelector(".cat");
    const box = document.querySelector(".box");
    const status = document.querySelector(".status");

    const register = (text) => {
      status.setHTMLUnsafe(`
      Evento disparado: ${text}
      <br>${status.getHTML()}
    `);
    };

    duck.addEventListener("dragstart", () => register("Moving duck..."));
    cat.addEventListener("dragstart", () => register("Moving cat..."));
    box.addEventListener("dragenter", () => register("Enter on box"));
    box.addEventListener("dragover", (ev) => ev.preventDefault());  // Para detectar drop
    box.addEventListener("drop", () => register("Drop on box"));
  </script>
  
</body>

</html>
