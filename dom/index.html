</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:alo;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="19" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;../assets/dom_cheat.png&quot;);background-size:contain;"><figcaption>top</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="3" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:alo;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="19" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2 id="dom-moderno">DOM moderno</h2>
<ul>
<li>Buscar elementos</li>
<li>Crear elementos desde el DOM</li>
<li>CSS (Clases/styles) desde el DOM</li>
<li>Contenido desde el DOM</li>
<li>Insertar HTML desde el DOM</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="3" style="" data-marpit-pagination-total="19" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="19">
<h2 id="buscar-en-el-dom">Buscar en el DOM</h2>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Métodos modernos de selección: .querySelector*()</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Métodos «legacy» tradicionales: .getElement*() (limitado por ID, colecciones vivas...)</li>
</ul>
<steps>
<step>
<pre><code class="language-js"><span class="hljs-variable language_">document</span>           <span class="hljs-comment">// Representa al árbol completo: el documento HTML</span>

<span class="hljs-keyword">const</span> element = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">getElementById</span>(<span class="hljs-string">&quot;presentation&quot;</span>);  <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Legacy (limitado a IDs)</span>
<span class="hljs-keyword">const</span> element = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;#presentation&quot;</span>);  <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Equivalente (y más potente)</span>

<span class="hljs-keyword">const</span> elements = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">getElementsByTagName</span>(<span class="hljs-string">&quot;div&quot;</span>);    <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Devuelve HTMLCollection</span>
<span class="hljs-keyword">const</span> elements = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelectorAll</span>(<span class="hljs-string">&quot;div&quot;</span>);        <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Equivalente (NodeList)</span>
<span class="hljs-keyword">const</span> elements = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">getElementsByClassName</span>(<span class="hljs-string">&quot;pato&quot;</span>); <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Devuelve HTMLCollection</span>
<span class="hljs-keyword">const</span> elements = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelectorAll</span>(<span class="hljs-string">&quot;.pato&quot;</span>);      <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Equivalente (NodeList)</span>
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> element = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.container&quot;</span>);  <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Busca/selecciona el PRIMER elemento</span>
<span class="hljs-comment">// <img class="emoji" draggable="false" alt="🟥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e5.svg" data-marp-twemoji=""/> Si no encuentra, devuelve null</span>

<span class="hljs-keyword">const</span> elements = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelectorAll</span>(<span class="hljs-string">&quot;div&quot;</span>);     <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Busca/selecciona TODOS los elementos</span>
<span class="hljs-comment">// <img class="emoji" draggable="false" alt="🟥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e5.svg" data-marp-twemoji=""/> Si no encuentra, devuelve []</span>

<span class="hljs-comment">// Puedes hacer búsquedas acotadas (no sobre todo el documento)</span>
element.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;p&quot;</span>);
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-comment">// Imágenes que no tienen atributo &quot;alt&quot; (obligatorio)</span>
<span class="hljs-keyword">const</span> errorImg = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelectorAll</span>(<span class="hljs-string">&quot;img:not([alt])&quot;</span>);

<span class="hljs-comment">// Enlaces que lleven a una imagen PNG</span>
<span class="hljs-keyword">const</span> linkToImage = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelectorAll</span>(<span class="hljs-string">&quot;a[href$=&#x27;png&#x27;]&quot;</span>);

<span class="hljs-comment">// Enlaces que estén hechos sobre una imagen</span>
<span class="hljs-keyword">const</span> imageWithLink = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelectorAll</span>(<span class="hljs-string">&quot;a:has(img)&quot;</span>);

<span class="hljs-comment">// Las celdas de la segunda fila de cada tabla de la página</span>
<span class="hljs-keyword">const</span> cells = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelectorAll</span>(<span class="hljs-string">&quot;table tr:nth-child(2) td&quot;</span>);
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-comment">// Buscamos un elemento HTML concreto</span>
<span class="hljs-keyword">const</span> container = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.container&quot;</span>);

<span class="hljs-comment">// Ahora queremos continuar buscando pero hacia los padres, no hacia los hijos</span>

<span class="hljs-comment">// Busca el elemento más cercano (hacia arriba)</span>
<span class="hljs-keyword">const</span> ancient = container.<span class="hljs-title function_">closest</span>(<span class="hljs-string">&quot;.page&quot;</span>);
</code></pre>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-scope-Vl821JTi="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="5" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="19">
<h1 id="modificar-contenido">Modificar contenido</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="19">
<h2 id="modificar-texto-de-la-web">Modificar texto de la web</h2>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Preferir propiedad .textContent</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Evitar .innerText (más lento, oculta partes no renderizadas)</li>
</ul>
<steps>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> paragraph = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.container .post p&quot;</span>);

paragraph.<span class="hljs-property">textContent</span>             <span class="hljs-comment">// Devuelve el contenido de texto actual</span>
paragraph.<span class="hljs-property">textContent</span> = <span class="hljs-string">&quot;Hola&quot;</span>;   <span class="hljs-comment">// Modifica el contenido actual por &quot;Hola&quot;</span>

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f512.svg" data-marp-twemoji=""/> Esto es muy importante en temas de seguridad</span>
paragraph.<span class="hljs-property">textContent</span> = <span class="hljs-string">&quot;&lt;div&gt;Hola&lt;/div&gt;&quot;</span>;    <span class="hljs-comment">// Inserta código HTML literalmente</span>
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> paragraph = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.container .post&quot;</span>);

<span class="hljs-comment">// Sirve tanto para leer como para modificar</span>
paragraph.<span class="hljs-property">innerHTML</span>              <span class="hljs-comment">// &#x27;&lt;p&gt;Esto es un párrafo de texto&lt;/p&gt;&#x27;</span>
paragraph.<span class="hljs-property">innerHTML</span> = <span class="hljs-string">&quot;&lt;p&gt;Hola, soy &lt;strong&gt;Alonso&lt;/strong&gt;.&lt;/p&gt;&quot;</span>;

<span class="hljs-comment">// Confusa en ciertas situaciones. No soporta ciertos detalles modernos.</span>
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> paragraph = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.container .post&quot;</span>);

<span class="hljs-comment">// Métodos modernos (más intuitivos)</span>
paragraph.<span class="hljs-title function_">getHTML</span>();          <span class="hljs-comment">// &#x27;&lt;p&gt;Esto es un párrafo de texto&lt;/p&gt;&#x27;</span>
paragraph.<span class="hljs-title function_">setHTMLUnsafe</span>(<span class="hljs-string">&quot;&lt;p&gt;Hola, soy &lt;strong&gt;Alonso&lt;/strong&gt;&lt;/p&gt;&quot;</span>);

<span class="hljs-comment">// Deja claro que puede insertar HTML inseguro (innerHTML también lo es)</span>
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> options = {
  <span class="hljs-attr">sanitizer</span>: <span class="hljs-keyword">new</span> <span class="hljs-title class_">Sanitizer</span>({
    <span class="hljs-attr">comments</span>: <span class="hljs-literal">true</span>,                           <span class="hljs-comment">// Elimina comentarios HTML</span>
    <span class="hljs-attr">removeElements</span>: [<span class="hljs-string">&quot;script&quot;</span>, <span class="hljs-string">&quot;iframe&quot;</span>]      <span class="hljs-comment">// Elimina scripts e iframes</span>
  })
}

<span class="hljs-variable language_">document</span>.<span class="hljs-property">body</span>.<span class="hljs-title function_">setHTMLUnsafe</span>(<span class="hljs-string">&quot;&lt;p onmouseenter=&#x27;alert(1)&#x27;&gt;Hola amigo mío.&lt;/p&gt;&quot;</span>);     <span class="hljs-comment">// Inseguro</span>
<span class="hljs-variable language_">document</span>.<span class="hljs-property">body</span>.<span class="hljs-title function_">setHTML</span>(<span class="hljs-string">&quot;&lt;p onmouseenter=&#x27;alert(1)&#x27;&gt;Hola amigo mío.&lt;/p&gt;&quot;</span>, options);  <span class="hljs-comment">// Seguro</span>
</code></pre>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="19">
<h2 id="atributos-html">Atributos HTML</h2>
<ul>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Mediante propiedades .id, .style → Ojo, una propiedad != un atributo</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Mediante métodos .setAttribute(), getAttribute() o .style.setProperty()</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Extras: .toggleAttribute() y .removeAttribute()</li>
</ul>
<steps>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> element = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.element&quot;</span>);

element.<span class="hljs-property">nodeName</span>                  <span class="hljs-comment">// Esto es una propiedad (la etiqueta HTML en mayúsculas)</span>
element.<span class="hljs-title function_">getAttribute</span>(<span class="hljs-string">&quot;nodeName&quot;</span>)  <span class="hljs-comment">// Esto SI es un atributo HTML</span>
<span class="hljs-comment">// Si tuvieramos el atributo nodeName, tendríamos valores diferentes</span>

<span class="hljs-keyword">const</span> presentation = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;#presentation&quot;</span>);
element.<span class="hljs-property">id</span>                        <span class="hljs-comment">// &quot;presentation&quot;</span>
element.<span class="hljs-title function_">getAttribute</span>(<span class="hljs-string">&quot;id&quot;</span>)        <span class="hljs-comment">// &quot;presentation&quot;</span>
<span class="hljs-comment">// Es la misma porque ciertos atributos HTML los REFLEJA AUTOMÁTICAMENTE</span>
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> element = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.element&quot;</span>);

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Forma rápida</span>
element.<span class="hljs-property">id</span> = <span class="hljs-string">&quot;name&quot;</span>;
element.<span class="hljs-property">style</span>.<span class="hljs-property">backgroundColor</span> = <span class="hljs-string">&quot;indigo&quot;</span>;   <span class="hljs-comment">// Cambia la propiedad CSS background-color (inline style)</span>

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Forma metódica</span>
element.<span class="hljs-title function_">setAttribute</span>(<span class="hljs-string">&quot;id&quot;</span>, <span class="hljs-string">&quot;name&quot;</span>);
element.<span class="hljs-title function_">setAttribute</span>(<span class="hljs-string">&quot;style&quot;</span>, <span class="hljs-string">&quot;background-color: red&quot;</span>);
element.<span class="hljs-property">style</span>.<span class="hljs-title function_">setProperty</span>(<span class="hljs-string">&quot;background-color&quot;</span>, <span class="hljs-string">&quot;red&quot;</span>);
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-comment">// Caso especial: Booleanos</span>
<span class="hljs-keyword">const</span> video = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;video&quot;</span>);

video.<span class="hljs-property">controls</span> = <span class="hljs-literal">true</span>;
video.<span class="hljs-title function_">setAttribute</span>(<span class="hljs-string">&quot;controls&quot;</span>, <span class="hljs-string">&quot;&quot;</span>);     <span class="hljs-comment">// Atributo HTML booleano: false = no existe atributo</span>

video.<span class="hljs-title function_">removeAttribute</span>(<span class="hljs-string">&quot;controls&quot;</span>);
video.<span class="hljs-title function_">toggleAttribute</span>(<span class="hljs-string">&quot;controls&quot;</span>);      <span class="hljs-comment">// Si existe, lo elimina. Si no existe, lo añade</span>
</code></pre>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="19">
<h2 id="las-clases-html">Las clases HTML</h2>
<ul>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> La propiedad .style (inline styles) y .className (clase como texto)</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> El objeto .classList con métodos de clases</li>
</ul>
<pre><code class="language-js">element.<span class="hljs-property">className</span> = <span class="hljs-string">&quot;parent element&quot;</span>;           <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Debes añadirlas directamente</span>

element.<span class="hljs-property">classList</span>.<span class="hljs-property">length</span>                        <span class="hljs-comment">// 2</span>
element.<span class="hljs-property">classList</span>.<span class="hljs-title function_">item</span>(<span class="hljs-number">2</span>);                      <span class="hljs-comment">// &quot;element&quot;</span>
element.<span class="hljs-property">classList</span>.<span class="hljs-title function_">contains</span>(<span class="hljs-string">&quot;rounded&quot;</span>);          <span class="hljs-comment">// false</span>
element.<span class="hljs-property">classList</span>.<span class="hljs-title function_">add</span>(<span class="hljs-string">&quot;rounded&quot;</span>);               <span class="hljs-comment">// Añade la clase</span>
element.<span class="hljs-property">classList</span>.<span class="hljs-title function_">remove</span>(<span class="hljs-string">&quot;rounded&quot;</span>);            <span class="hljs-comment">// Elimina la clase</span>
element.<span class="hljs-property">classList</span>.<span class="hljs-title function_">toggle</span>(<span class="hljs-string">&quot;rounded&quot;</span>);            <span class="hljs-comment">// Añade (si no existe) o elimina (si existe)</span>
element.<span class="hljs-property">classList</span>.<span class="hljs-title function_">replace</span>(<span class="hljs-string">&quot;rounded&quot;</span>, <span class="hljs-string">&quot;hide&quot;</span>);   <span class="hljs-comment">// Cambia &quot;rounded&quot; por &quot;hide&quot;</span>

</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-scope-Mp8pTTBv="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="9" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="19">
<h1 id="crear-elementos-con-el-dom">Crear elementos con el DOM</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="19">
<h2 id="crear-elementos">Crear elementos</h2>
<ul>
<li>El método document.createElement()</li>
<li>Podemos crear un sistema para simplificar</li>
<li><a href="https://lenguajejs.com/dom/crear/fragmentos/">Fragmentos</a> en casos especiales (no queremos contenedor)</li>
</ul>
<steps>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> div = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">createElement</span>(<span class="hljs-string">&quot;div&quot;</span>);
div.<span class="hljs-property">classList</span>.<span class="hljs-title function_">add</span>(<span class="hljs-string">&quot;duck-element&quot;</span>);
div.<span class="hljs-property">textContent</span> = <span class="hljs-string">&quot;Protip: Don&#x27;t use Tailwind!&quot;</span>;

div.<span class="hljs-property">isConnected</span>               <span class="hljs-comment">// false (no está en el DOM, está en memoria)</span>
<span class="hljs-variable language_">document</span>.<span class="hljs-property">body</span>.<span class="hljs-title function_">append</span>(div);
div.<span class="hljs-property">isConnected</span>               <span class="hljs-comment">// true (si está en el DOM)</span>
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> <span class="hljs-title function_">createTag</span> = (<span class="hljs-params">className = <span class="hljs-string">&quot;element&quot;</span>, tag = <span class="hljs-string">&quot;div&quot;</span>, options = {}</span>) =&gt; {
  <span class="hljs-keyword">const</span> element = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">createElement</span>(tag);
  element.<span class="hljs-property">classList</span>.<span class="hljs-title function_">add</span>(className);
  <span class="hljs-keyword">if</span> (options.<span class="hljs-property">text</span>) element.<span class="hljs-property">textContent</span> = options.<span class="hljs-property">text</span>;
  <span class="hljs-keyword">if</span> (options.<span class="hljs-property">html</span>) element.<span class="hljs-title function_">setHTMLUnsafe</span>(options.<span class="hljs-property">html</span>);
  <span class="hljs-keyword">return</span> element;
}

<span class="hljs-title function_">createTag</span>(<span class="hljs-string">&quot;container&quot;</span>, <span class="hljs-string">&quot;p&quot;</span>, { <span class="hljs-attr">text</span>: <span class="hljs-string">&quot;Hello!&quot;</span> });    <span class="hljs-comment">// &lt;p class=&quot;container&quot;&gt;Hello!&lt;/p&gt;</span>
</code></pre>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="19">
<h2 id="apis-inserci%C3%B3n">APIs inserción</h2>
<ul>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <a href="https://lenguajejs.com/dom/crear/node-api/">API de Nodos</a>: La más vieja, clásica y genérica</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <a href="https://lenguajejs.com/dom/crear/element-api/">API de Element</a>: La intermedia: Corta y práctica</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <a href="https://lenguajejs.com/dom/crear/insertadjacent-api/">API de inserción adyacente</a>: La más flexible</li>
</ul>
<steps>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> parent = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.parent&quot;</span>);
<span class="hljs-comment">// &lt;div class=&quot;parent&quot;&gt;Mensaje: &lt;/div&gt;</span>

<span class="hljs-keyword">const</span> tag = <span class="hljs-title function_">createTag</span>(<span class="hljs-string">&quot;welcome&quot;</span>, <span class="hljs-string">&quot;p&quot;</span>, { <span class="hljs-attr">text</span>: <span class="hljs-string">&quot;¡Bienvenido, usuario!&quot;</span> });
<span class="hljs-comment">// &lt;p class=&quot;welcome&quot;&gt;¡Bienvenido, usuario!&lt;/p&gt;</span>

parent.<span class="hljs-title function_">appendChild</span>(tag);
<span class="hljs-comment">//                             ↓ Lo inserta aquí (poco flexible)</span>
<span class="hljs-comment">// &lt;div class=&quot;parent&quot;&gt;Mensaje: &lt;/div&gt;</span>

</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> parent = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.parent&quot;</span>);
<span class="hljs-keyword">const</span> tag = <span class="hljs-title function_">createTag</span>(<span class="hljs-string">&quot;welcome&quot;</span>, <span class="hljs-string">&quot;p&quot;</span>, { <span class="hljs-attr">text</span>: <span class="hljs-string">&quot;¡Bienvenido, usuario!&quot;</span> });

parent.<span class="hljs-title function_">before</span>(tag);     <span class="hljs-comment">// (↓) &lt;div class=&quot;parent&quot;&gt;Mensaje:&lt;/div&gt;</span>
parent.<span class="hljs-title function_">prepend</span>(tag);    <span class="hljs-comment">// &lt;div class=&quot;parent&quot;&gt;(↓) Mensaje:&lt;/div&gt;</span>
parent.<span class="hljs-title function_">append</span>(tag);     <span class="hljs-comment">// &lt;div class=&quot;parent&quot;&gt;Mensaje: (↓) &lt;/div&gt;</span>
parent.<span class="hljs-title function_">after</span>(tag);      <span class="hljs-comment">// &lt;div class=&quot;parent&quot;&gt;Mensaje:&lt;/div&gt; (↓)</span>

tag.<span class="hljs-title function_">remove</span>();           <span class="hljs-comment">// Elimina el elemento del documento HTML</span>
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> tag = <span class="hljs-title function_">createTag</span>(<span class="hljs-string">&quot;welcome&quot;</span>, <span class="hljs-string">&quot;p&quot;</span>, { <span class="hljs-attr">text</span>: <span class="hljs-string">&quot;¡Bienvenido, usuario!&quot;</span> });

<span class="hljs-comment">// API de inserción adyacente</span>
parent.<span class="hljs-title function_">insertAdjacentElement</span>(<span class="hljs-string">&quot;beforeend&quot;</span>, tag);
parent.<span class="hljs-title function_">insertAdjacentHTML</span>(<span class="hljs-string">&quot;beforeend&quot;</span>, <span class="hljs-string">`&lt;p&gt;Puedes insertar el HTML directamente&lt;/p&gt;`</span>);
parent.<span class="hljs-title function_">insertAdjacentText</span>(<span class="hljs-string">&quot;beforeend&quot;</span>, <span class="hljs-string">`O insertar textos directamente sin etiquetas HTML`</span>);
</code></pre>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="19">
<h2 id="plantillas-html">Plantillas HTML</h2>
<ul>
<li>Etiqueta <code>&lt;template&gt;</code> de HTML → <a href="https://lenguajehtml.com/html/interactivas/etiqueta-html-template/">template</a></li>
</ul>
<split-slide style="--left: 30%; --right: 70%;">
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">template</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;card&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">template</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;page&quot;</span>&gt;</span>
  <span class="hljs-comment">&lt;!-- Contenido --&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
<pre><code class="language-js"><span class="hljs-keyword">const</span> cats = [
  <span class="hljs-string">&quot;Lea&quot;</span>, <span class="hljs-string">&quot;Grisu&quot;</span>, <span class="hljs-string">&quot;Rocky&quot;</span>,
  <span class="hljs-string">&quot;Giacomino Guardiano Dell Iperspazio&quot;</span>, <span class="hljs-string">&quot;Pimpi&quot;</span>
];
<span class="hljs-keyword">const</span> page = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.page&quot;</span>);
<span class="hljs-keyword">const</span> template = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;template&quot;</span>);

cats.<span class="hljs-title function_">forEach</span>(<span class="hljs-function"><span class="hljs-params">cat</span> =&gt;</span> {
  <span class="hljs-keyword">const</span> html = template.<span class="hljs-property">content</span>.<span class="hljs-title function_">cloneNode</span>(<span class="hljs-literal">true</span>);
  html.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;h1&quot;</span>).<span class="hljs-property">textContent</span> = cat;
  page.<span class="hljs-title function_">append</span>(html);
});

</code></pre>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-marpit-scope-ympxV2kQ="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="13" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="19">
<h1 id="apis-relacionadas">APIs relacionadas</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="19">
<h2 id="tipos-de-dom">Tipos de DOM</h2>
<ul>
<li>DOM: El «DOM real», el documento general que solemos utilizar siempre</li>
<li>Virtual DOM: Un DOM en memoria que utilizan librerías como React</li>
<li><a href="https://lenguajejs.com/dom/shadow/attachshadow/">Shadow DOM</a>: Caso particular del DOM → Shadow DOM</li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">const</span> element = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.container&quot;</span>);

<span class="hljs-comment">// Creamos un Shadow DOM en el elemento (se oculta el DOM real)</span>
element.<span class="hljs-title function_">attachShadow</span>({ <span class="hljs-attr">mode</span>: <span class="hljs-string">&quot;open&quot;</span> });

<span class="hljs-comment">// Ahora podemos modificar el DOM real (que se cambia pero no se ve)</span>
element.<span class="hljs-title function_">setHTMLUnsafe</span>(<span class="hljs-string">`&lt;p&gt;Contenido del Light DOM (DOM real)&lt;/p&gt;`</span>);

<span class="hljs-comment">// ...y modificar el Shadow DOM (el que se ve actualmente)</span>
element.<span class="hljs-property">shadowRoot</span>.<span class="hljs-title function_">setHTMLUnsafe</span>(<span class="hljs-string">`&lt;p&gt;Contenido del Shadow DOM&lt;/p&gt;`</span>);

</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="19">
<h2 id="api-de-animaciones-del-dom">API de Animaciones del DOM</h2>
<ul>
<li>Animaciones CSS (pero desde Javascript) → <a href="https://lenguajecss.com/animaciones/webanimations/que-es/">WebAnimations</a></li>
</ul>
<split-slide>
<pre><code class="language-js"><span class="hljs-keyword">const</span> element = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.element&quot;</span>);

element.<span class="hljs-title function_">animate</span>({
  <span class="hljs-attr">opacity</span>: [<span class="hljs-number">1</span>, <span class="hljs-number">0</span>],
  <span class="hljs-attr">height</span>: [<span class="hljs-string">&quot;25px&quot;</span>, <span class="hljs-string">&quot;0&quot;</span>]
}, <span class="hljs-number">2000</span>);

element.<span class="hljs-title function_">animate</span>({ <span class="hljs-comment">/* ... */</span> }, {
  <span class="hljs-attr">duration</span>: <span class="hljs-number">2000</span>,
  <span class="hljs-attr">fill</span>: <span class="hljs-string">&quot;forwards&quot;</span>
});
</code></pre>
<pre><code class="language-css"><span class="hljs-comment">/* Animaciones CSS */</span>
<span class="hljs-keyword">@keyframes</span> hide {
  <span class="hljs-number">0%</span> { <span class="hljs-attribute">opacity</span>: <span class="hljs-number">1</span> }
  <span class="hljs-number">100%</span> { <span class="hljs-attribute">opacity</span>: <span class="hljs-number">0</span> }
}

<span class="hljs-keyword">@keyframes</span> reduce {
  <span class="hljs-number">0%</span> { <span class="hljs-attribute">height</span>: <span class="hljs-number">25px</span>; }
  <span class="hljs-number">100%</span> { <span class="hljs-attribute">height</span>: <span class="hljs-number">0</span>; }
}
</code></pre>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="19">
<h2 id="api-de-css-highlight">API de CSS Highlight</h2>
<ul>
<li>Posibilidad de dar estilo a fragmentos sin usar DOM → <a href="https://lenguajejs.com/javascript/web-apis/css-highlight/">CSS Highlight API</a></li>
</ul>
<steps>
<step>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">pre</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">code</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;language-css&quot;</span>&gt;</span>
  @keyframes reduce {
    0% { height: 25px; }
    100% { height: 0; }
  }
<span class="hljs-tag">&lt;/<span class="hljs-name">code</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">pre</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">style</span>&gt;</span><span class="language-css">
  <span class="hljs-selector-class">.language-css</span> <span class="hljs-selector-class">.css-at-rule</span> {
    <span class="hljs-attribute">background</span>: indigo;
    <span class="hljs-attribute">color</span>: white;
    <span class="hljs-attribute">padding</span>: <span class="hljs-number">2px</span> <span class="hljs-number">6px</span>;
  }
</span><span class="hljs-tag">&lt;/<span class="hljs-name">style</span>&gt;</span>
</code></pre>
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- En códigos grandes, DOM crece MUCHÍSIMO --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">pre</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">code</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;language-css&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">span</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;css-at-rule&quot;</span>&gt;</span>@keyframes<span class="hljs-tag">&lt;/<span class="hljs-name">span</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">span</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;css-id&quot;</span>&gt;</span>reduce<span class="hljs-tag">&lt;/<span class="hljs-name">span</span>&gt;</span> {
    <span class="hljs-tag">&lt;<span class="hljs-name">span</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;css-percent&quot;</span>&gt;</span>0%<span class="hljs-tag">&lt;/<span class="hljs-name">span</span>&gt;</span> {
      <span class="hljs-tag">&lt;<span class="hljs-name">span</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;css-property&quot;</span>&gt;</span>height<span class="hljs-tag">&lt;/<span class="hljs-name">span</span>&gt;</span>:
      <span class="hljs-tag">&lt;<span class="hljs-name">span</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;css-number&quot;</span>&gt;</span>25<span class="hljs-tag">&lt;/<span class="hljs-name">span</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">span</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;css-unit&quot;</span>&gt;</span>px<span class="hljs-tag">&lt;/<span class="hljs-name">span</span>&gt;</span>; }
    <span class="hljs-tag">&lt;<span class="hljs-name">span</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;css-percent&quot;</span>&gt;</span>100%<span class="hljs-tag">&lt;/<span class="hljs-name">span</span>&gt;</span> {
      <span class="hljs-tag">&lt;<span class="hljs-name">span</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;css-property&quot;</span>&gt;</span>height<span class="hljs-tag">&lt;/<span class="hljs-name">span</span>&gt;</span>:
      <span class="hljs-tag">&lt;<span class="hljs-name">span</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;css-number&quot;</span>&gt;</span>0<span class="hljs-tag">&lt;/<span class="hljs-name">span</span>&gt;</span>; }
  }
<span class="hljs-tag">&lt;/<span class="hljs-name">code</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">pre</span>&gt;</span>
</code></pre>
</split-slide>
</step>
<step>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">pre</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">code</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;language-css&quot;</span>&gt;</span>
  @keyframes reduce {
    0% { height: 25px; }
    100% { height: 0; }
  }
<span class="hljs-tag">&lt;/<span class="hljs-name">code</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">pre</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">style</span>&gt;</span><span class="language-css">
  ::<span class="hljs-built_in">highlight</span>(css-at-rule) {
    <span class="hljs-attr">--color</span>: indigo;
    <span class="hljs-attribute">background</span>: <span class="hljs-built_in">color-mix</span>(in srgb, <span class="hljs-built_in">var</span>(--color), white <span class="hljs-number">60%</span>);
    <span class="hljs-attribute">color</span>: <span class="hljs-built_in">var</span>(--color);
    <span class="hljs-attribute">padding</span>: <span class="hljs-number">2px</span> <span class="hljs-number">6px</span>;
  }
</span><span class="hljs-tag">&lt;/<span class="hljs-name">style</span>&gt;</span>
</code></pre>
<pre><code class="language-js"><span class="hljs-comment">// Obtenemos el elemento &lt;code&gt;</span>
<span class="hljs-keyword">const</span> code = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;pre code&quot;</span>);

<span class="hljs-comment">// Obtenemos el nodo de texto (a bajo nivel)</span>
<span class="hljs-comment">// &quot;\n  @keyframes...&quot; &lt;- Observa</span>
<span class="hljs-keyword">const</span> textNode = code.<span class="hljs-property">childNodes</span>[<span class="hljs-number">0</span>];

<span class="hljs-comment">// Creamos el rango que nos interesa</span>
<span class="hljs-keyword">const</span> range = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Range</span>();
range.<span class="hljs-title function_">setStart</span>(textNode, <span class="hljs-number">3</span>);
range.<span class="hljs-title function_">setEnd</span>(textNode, <span class="hljs-number">13</span>);

<span class="hljs-comment">// Le damos nombre</span>
<span class="hljs-variable constant_">CSS</span>.<span class="hljs-property">highlights</span>.<span class="hljs-title function_">set</span>(<span class="hljs-string">&quot;css-at-rule&quot;</span>, <span class="hljs-keyword">new</span> <span class="hljs-title class_">Highlight</span>(range));
</code></pre>
</split-slide>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="19">
<h2 id="api-de-mutaciones-del-dom">API de mutaciones del DOM</h2>
<ul>
<li>Observar mutaciones con la API de MutationObserver</li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">const</span> container = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.container&quot;</span>);

<span class="hljs-keyword">const</span> <span class="hljs-title function_">addRandomMessage</span> = (<span class="hljs-params"></span>) =&gt; {
  <span class="hljs-keyword">const</span> time = <span class="hljs-number">1000</span> + <span class="hljs-title class_">Math</span>.<span class="hljs-title function_">floor</span>(<span class="hljs-title class_">Math</span>.<span class="hljs-title function_">random</span>() * <span class="hljs-number">3000</span>);
  container.<span class="hljs-property">textContent</span> = <span class="hljs-string">`¡Mensaje recibido: <span class="hljs-subst">${time}</span>!`</span>;
  <span class="hljs-built_in">setTimeout</span>(<span class="hljs-function">() =&gt;</span> <span class="hljs-title function_">addRandomMessage</span>(), time);
}

<span class="hljs-keyword">const</span> observer = <span class="hljs-keyword">new</span> <span class="hljs-title class_">MutationObserver</span>(<span class="hljs-function">() =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Cambio detectado en el contenedor.&quot;</span>));
observer.<span class="hljs-title function_">observe</span>(container, { <span class="hljs-attr">childList</span>: <span class="hljs-literal">true</span> });

<span class="hljs-built_in">setTimeout</span>(<span class="hljs-function">() =&gt;</span> <span class="hljs-title function_">addRandomMessage</span>(), <span class="hljs-number">3000</span>);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="19">
<h2 id="plantillas-html-con-lit">Plantillas HTML (con Lit)</h2>
