<li>Acceder a API de sintetizador de voz</li>
<li>Realizar un proceso costoso que tardará</li>
</ul>
</li>
</ul>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="thennables">Thennables</h2>
<ul>
<li>¿Como consumir promesas en Javascript?</li>
</ul>
<steps>
<step>
<pre><code class="language-js"><span class="hljs-comment">// Función asíncrona devuelve siempre una promesa</span>
<span class="hljs-keyword">const</span> promise = <span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;/robots.txt&quot;</span>);

<span class="hljs-comment">// Esa promesa se activa cuando se cumple con un .then()</span>
promise.<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">data</span>) =&gt;</span> {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(data);
});

<span class="hljs-comment">// Esa promesa se activa cuando se rechaza con un .catch()</span>
promise.<span class="hljs-title function_">catch</span>(<span class="hljs-function">(<span class="hljs-params">data</span>) =&gt;</span> {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(data);
});
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-comment">// Para simplificar, esto se suele unir y escribir todo junto, sin guardar en una variable...</span>
<span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;/robots.txt&quot;</span>)
  .<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">data</span>) =&gt;</span> {
    <span class="hljs-comment">/* Cuando se cumple la promesa */</span>
  }).<span class="hljs-title function_">catch</span>(<span class="hljs-function">(<span class="hljs-params">data</span>) =&gt;</span> {
    <span class="hljs-comment">/* Cuando se rechaza la promesa */</span>
  });

<span class="hljs-comment">// NO BLOQUEANTE: Si la promesa está pendiente, se continúa con el resto del código</span>
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-comment">// En algunos casos podemos necesitar ejecutar lógica tanto si se cumple como si se rechaza</span>
<span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;/robots.txt&quot;</span>)
  .<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">data</span>) =&gt;</span> { <span class="hljs-comment">/* ... */</span> })
  .<span class="hljs-title function_">catch</span>(<span class="hljs-function">(<span class="hljs-params">data</span>) =&gt;</span> { <span class="hljs-comment">/* ... */</span> })
  .<span class="hljs-title function_">finally</span>(<span class="hljs-function">() =&gt;</span> {
    <span class="hljs-comment">/* Se ejecuta cuando se sale de estado &quot;pendiente&quot; y termina el then() o catch() */</span>
  });

<span class="hljs-comment">// Si la promesa está pendiente, se continúa con el resto del código</span>
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-comment">// Algunas funciones (como fetch) pueden requerir tratar varias promesas encadenadas...</span>
<span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;/robots.txt&quot;</span>)
  .<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">data</span>) =&gt;</span> <span class="hljs-title function_">funcion_async</span>())         <span class="hljs-comment">// funcion_async devuelve otra promesa</span>
  .<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">data</span>) =&gt;</span> { <span class="hljs-comment">/* ... */</span> })           <span class="hljs-comment">// Se procesa la promesa anterior</span>

</code></pre>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="crear-nuestras-propias-promesas">Crear nuestras propias promesas</h2>
<ul>
<li>Para usuarios avanzados</li>
</ul>
<steps>
<step>
<pre><code class="language-js"><span class="hljs-comment">// Ahora mismo es una función síncrona</span>
<span class="hljs-keyword">const</span> <span class="hljs-title function_">doTask</span> = (<span class="hljs-params"></span>) =&gt; {
  <span class="hljs-keyword">const</span> data = <span class="hljs-number">42</span>;    <span class="hljs-comment">// Lógica de mi función</span>
  <span class="hljs-comment">/* ← Necesitamos hacer una operación asíncrona */</span>
  <span class="hljs-keyword">return</span> data;
}

<span class="hljs-comment">// Ejecución de la función</span>
<span class="hljs-title function_">doTask</span>();
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-comment">// Ahora es una función asíncrona (devuelve una promesa)</span>
<span class="hljs-keyword">const</span> <span class="hljs-title function_">doTask</span> = (<span class="hljs-params"></span>) =&gt; {
  <span class="hljs-comment">/* ↓ Vamos a convertirla en asíncrona */</span>
  <span class="hljs-keyword">const</span> promise = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Promise</span>( <span class="hljs-function">(<span class="hljs-params">resolve, reject</span>) =&gt;</span> {
    <span class="hljs-keyword">const</span> data = <span class="hljs-number">42</span>;  <span class="hljs-comment">/* La lógica de mi programa */</span>
    <span class="hljs-comment">/* Lógica de la promesa (ver siguiente paso) */</span>
  } );
  <span class="hljs-keyword">return</span> promise;  <span class="hljs-comment">// Devolvemos la promesa</span>
}

<span class="hljs-comment">// Ejecución de la función</span>
<span class="hljs-title function_">doTask</span>().<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">data</span>) =&gt;</span> {
  <span class="hljs-comment">// data es lo que devuelve la lógica de la función asíncrona</span>
});
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> <span class="hljs-title function_">doTask</span> = (<span class="hljs-params"></span>) =&gt; {
  <span class="hljs-keyword">const</span> promise = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Promise</span>( <span class="hljs-function">(<span class="hljs-params">resolve, reject</span>) =&gt;</span> {
    <span class="hljs-keyword">const</span> data = <span class="hljs-number">42</span>;  <span class="hljs-comment">/* La lógica de mi programa */</span>
    <span class="hljs-comment">// Estas ejecuciones se establecen donde se necesite de nuestra lógica:</span>
    <span class="hljs-title function_">resolve</span>(<span class="hljs-number">42</span>);  <span class="hljs-comment">// La promesa se cumple y devuelve 42</span>
    <span class="hljs-title function_">reject</span>(<span class="hljs-number">0</span>);    <span class="hljs-comment">// La promesa se rechaza y devuelve 0</span>
  } );
  <span class="hljs-keyword">return</span> promise;  <span class="hljs-comment">// Devolvemos la promesa</span>
}

<span class="hljs-comment">// Ejecución de la función</span>
<span class="hljs-title function_">doTask</span>().<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">data</span>) =&gt;</span> {
  <span class="hljs-comment">// data es lo que devuelve la lógica de la función asíncrona</span>
});
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-comment">// Simplificamos para hacerlo más breve:</span>
<span class="hljs-keyword">const</span> <span class="hljs-title function_">doTask</span> = (<span class="hljs-params"></span>) =&gt; {
  <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Promise</span>( <span class="hljs-function">(<span class="hljs-params">resolve, reject</span>) =&gt;</span> {
    <span class="hljs-keyword">const</span> data = <span class="hljs-title class_">Math</span>.<span class="hljs-title function_">ceil</span>(<span class="hljs-title class_">Math</span>.<span class="hljs-title function_">random</span>() * <span class="hljs-number">6</span>);

    <span class="hljs-keyword">if</span> (data == <span class="hljs-number">6</span>) <span class="hljs-title function_">resolve</span>(<span class="hljs-number">42</span>);   <span class="hljs-comment">// Cumplimos si sale 6</span>
    <span class="hljs-title function_">reject</span>(<span class="hljs-number">0</span>);                    <span class="hljs-comment">// Rechazamos otro caso</span>
  } );
}

<span class="hljs-comment">// Ejecución de la función</span>
<span class="hljs-title function_">doTask</span>().<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">data</span>) =&gt;</span> {
  <span class="hljs-comment">// data es lo que devuelve la lógica de la función asíncrona</span>
});
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-comment">// Podemos usar la nueva api Promise.withResolvers() para simplificar aún más</span>
<span class="hljs-keyword">const</span> <span class="hljs-title function_">doTask</span> = (<span class="hljs-params"></span>) =&gt; {
  <span class="hljs-keyword">const</span> { promise, resolve, reject } = <span class="hljs-title class_">Promise</span>.<span class="hljs-title function_">withResolvers</span>();
  <span class="hljs-keyword">const</span> data = <span class="hljs-title class_">Math</span>.<span class="hljs-title function_">ceil</span>(<span class="hljs-title class_">Math</span>.<span class="hljs-title function_">random</span>() * <span class="hljs-number">6</span>);

  <span class="hljs-keyword">if</span> (data == <span class="hljs-number">6</span>) <span class="hljs-title function_">resolve</span>(<span class="hljs-number">42</span>);   <span class="hljs-comment">// Cumplimos si sale 6</span>
  <span class="hljs-title function_">reject</span>(<span class="hljs-number">0</span>);                    <span class="hljs-comment">// Rechazamos otro caso</span>
  <span class="hljs-keyword">return</span> promise;
}

<span class="hljs-comment">// Ejecución de la función</span>
<span class="hljs-title function_">doTask</span>().<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">data</span>) =&gt;</span> {
  <span class="hljs-comment">// data es lo que devuelve la lógica de la función asíncrona</span>
});
</code></pre>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-scope-SDGS307V="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="5" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="27">
<h1 id="async--await">Async / Await</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="asyncawait">Async/Await</h2>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> La sintaxis del código con async/await es más natural y menos confusa</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> El await es fácil de entender: «pausa» las funciones hasta salir de «pendiente»</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Ergo, a diferencia de .then(), son bloqueantes (para el ámbito actual)</li>
</ul>
<steps>
<step>
<pre><code class="language-js"><span class="hljs-comment">// Utilizando thennables</span>
<span class="hljs-title function_">doTask</span>().<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">data</span>) =&gt;</span> {
  <span class="hljs-comment">// Lógica usando data</span>
});

<span class="hljs-comment">// Utilizando async/await</span>
<span class="hljs-keyword">const</span> data = <span class="hljs-keyword">await</span> <span class="hljs-title function_">doTask</span>();
<span class="hljs-comment">// Lógica usando data</span>
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-comment">// A la hora de crear funciones</span>
<span class="hljs-keyword">const</span> <span class="hljs-title function_">doTask</span> = <span class="hljs-keyword">async</span> (<span class="hljs-params"></span>) =&gt; {
  <span class="hljs-keyword">const</span> data = <span class="hljs-title class_">Math</span>.<span class="hljs-title function_">ceil</span>(<span class="hljs-title class_">Math</span>.<span class="hljs-title function_">random</span>() * <span class="hljs-number">6</span>);
  <span class="hljs-keyword">if</span> (data == <span class="hljs-number">6</span>) <span class="hljs-keyword">return</span> <span class="hljs-number">42</span>;   <span class="hljs-comment">// Cumplimos si sale 6</span>
  <span class="hljs-keyword">throw</span> <span class="hljs-number">0</span>;                    <span class="hljs-comment">// Rechazamos otro caso</span>
}

<span class="hljs-keyword">try</span> {
  <span class="hljs-keyword">const</span> data = <span class="hljs-keyword">await</span> <span class="hljs-title function_">doTask</span>(); <span class="hljs-comment">// Se cumple la promesa...</span>
} <span class="hljs-keyword">catch</span> (error) { <span class="hljs-comment">/* Se rechazó la promesa... */</span> }
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> await funciona si está en el ámbito global (top await, en módulos ESM)</span>
<span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> await funciona si el await está envuelto en una función async</span>
<span class="hljs-keyword">const</span> <span class="hljs-title function_">doTask</span> = (<span class="hljs-params"></span>) =&gt; {
  <span class="hljs-keyword">const</span> data = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;/robots.txt&quot;</span>);    <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> No funcionará</span>
}

<span class="hljs-keyword">const</span> <span class="hljs-title function_">doTask</span> = <span class="hljs-keyword">async</span> (<span class="hljs-params"></span>) =&gt; {
  <span class="hljs-keyword">const</span> data = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;/robots.txt&quot;</span>);    <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Funciona</span>
}
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-comment">// Híbrido combinado (Recuerda: fetch necesita resolver dos promesas)</span>
<span class="hljs-keyword">const</span> response = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;/robots.txt&quot;</span>);
<span class="hljs-keyword">const</span> data = <span class="hljs-keyword">await</span> response.<span class="hljs-title function_">text</span>();

<span class="hljs-comment">// Esto es lo mismo que:</span>
<span class="hljs-keyword">const</span> data = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;/robots.txt&quot;</span>).<span class="hljs-title function_">then</span>(<span class="hljs-function"><span class="hljs-params">response</span> =&gt;</span> response.<span class="hljs-title function_">text</span>());
</code></pre>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-marpit-scope-8GZt7UcF="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="7" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="27">
<h1 id="promesas-en-grupo">Promesas en grupo</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="promesa-de-control">Promesa de control</h2>
<ul>
<li>Los <code>.map()</code> (y otras funciones) no esperan los <code>await</code></li>
<li>Alternativas: Usar <code>for</code> con <code>await</code>, <code>for of</code> o promesas en grupo</li>
</ul>
<steps>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> task1 = <span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;/robots.txt&quot;</span>);    <span class="hljs-comment">// Devuelve una promesa</span>
<span class="hljs-keyword">const</span> task2 = <span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;/index.css&quot;</span>);     <span class="hljs-comment">// Devuelve una promesa</span>
<span class="hljs-keyword">const</span> task3 = <span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;/index.js&quot;</span>);      <span class="hljs-comment">// Devuelve una promesa</span>

<span class="hljs-keyword">const</span> tasks = [task1, task2, task3];  <span class="hljs-comment">// Array de promesas</span>

<span class="hljs-comment">// Código teóricamente correcto...</span>
<span class="hljs-keyword">const</span> responses = tasks.<span class="hljs-title function_">map</span>(<span class="hljs-title function_">async</span> (promise) =&gt; {
  <span class="hljs-keyword">return</span> <span class="hljs-keyword">await</span> promise;
});
<span class="hljs-comment">// responses = [Promise, Promise, Promise]    // <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> pero no funciona</span>
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> task1 = <span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;/robots.txt&quot;</span>);    <span class="hljs-comment">// Devuelve una promesa</span>
<span class="hljs-keyword">const</span> task2 = <span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;/index.css&quot;</span>);     <span class="hljs-comment">// Devuelve una promesa</span>
<span class="hljs-keyword">const</span> task3 = <span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;/index.js&quot;</span>);      <span class="hljs-comment">// Devuelve una promesa</span>

<span class="hljs-keyword">const</span> tasks = [task1, task2, task3];  <span class="hljs-comment">// Array de promesas</span>

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Alternativa 1: Bucle for + await</span>
<span class="hljs-keyword">const</span> responses = [];
<span class="hljs-keyword">for</span> (<span class="hljs-keyword">let</span> i = <span class="hljs-number">0</span>; i &lt; tasks.<span class="hljs-property">length</span>; i++) {
  responses[i] = <span class="hljs-keyword">await</span> tasks[i];
}
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> task1 = <span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;/robots.txt&quot;</span>);    <span class="hljs-comment">// Devuelve una promesa</span>
<span class="hljs-keyword">const</span> task2 = <span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;/index.css&quot;</span>);     <span class="hljs-comment">// Devuelve una promesa</span>
<span class="hljs-keyword">const</span> task3 = <span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;/index.js&quot;</span>);      <span class="hljs-comment">// Devuelve una promesa</span>

<span class="hljs-keyword">const</span> tasks = [task1, task2, task3];  <span class="hljs-comment">// Array de promesas</span>

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Alternativa 2: Bucle for..of</span>
<span class="hljs-keyword">const</span> responses = [];
<span class="hljs-keyword">for</span> (<span class="hljs-keyword">const</span> promise <span class="hljs-keyword">of</span> tasks) {
  responses.<span class="hljs-title function_">push</span>(<span class="hljs-keyword">await</span> promise);
}
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> task1 = <span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;/robots.txt&quot;</span>);    <span class="hljs-comment">// Devuelve una promesa</span>
<span class="hljs-keyword">const</span> task2 = <span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;/index.css&quot;</span>);     <span class="hljs-comment">// Devuelve una promesa</span>
<span class="hljs-keyword">const</span> task3 = <span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;/index.js&quot;</span>);      <span class="hljs-comment">// Devuelve una promesa</span>

<span class="hljs-keyword">const</span> tasks = [task1, task2, task3];  <span class="hljs-comment">// Array de promesas</span>

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> La mejor alternativa: promesas en grupo</span>
<span class="hljs-keyword">const</span> responses = <span class="hljs-keyword">await</span> <span class="hljs-title class_">Promise</span>.<span class="hljs-title function_">all</span>(tasks);
</code></pre>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="promesas-en-grupo-1">Promesas en grupo</h2>
<ul>
<li><code>.all()</code> (todas cumplidas) / <code>.allSettled()</code> (todas: cumplidas o no) → <a href="../assets/promise.png" target="_blank">Métodos de promesas en grupo</a></li>
<li><code>.any()</code> (la primera que se cumpla)</li>
<li><code>.race()</code> (la primera, cumplida o no)</li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">const</span> responses = <span class="hljs-keyword">await</span> <span class="hljs-title class_">Promise</span>.<span class="hljs-title function_">all</span>(tasks);       <span class="hljs-comment">// [Response, Response, Response]</span>
<span class="hljs-keyword">const</span> results = <span class="hljs-keyword">await</span> <span class="hljs-title class_">Promise</span>.<span class="hljs-title function_">allSettled</span>(tasks);  <span class="hljs-comment">// [{ status, value, reason }, ...]</span>
<span class="hljs-keyword">const</span> response = <span class="hljs-keyword">await</span> <span class="hljs-title class_">Promise</span>.<span class="hljs-title function_">any</span>(tasks);        <span class="hljs-comment">// Response (o promesa rechazada si fallan todas)</span>
<span class="hljs-keyword">const</span> response = <span class="hljs-keyword">await</span> <span class="hljs-title class_">Promise</span>.<span class="hljs-title function_">race</span>([task1, task2, task3]); <span class="hljs-comment">// Promise (cumplida o rechazada)</span>

<span class="hljs-comment">// Devuelve directamente una promesa cumplida/rechazada</span>
<span class="hljs-title class_">Promise</span>.<span class="hljs-title function_">resolve</span>(value);
<span class="hljs-title class_">Promise</span>.<span class="hljs-title function_">reject</span>(value);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-scope-SX2wTYaU="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="10" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="27">
<h1 id="peticiones-http">Peticiones HTTP</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="fetch">Fetch</h2>
<ul>
<li>Prioriza el uso de <code>fetch</code>: Nativo, de la plataforma</li>
<li>Alternativas
<ul>
<li><code>XHR</code> (antiguo, anterior a 2015)</li>
<li><code>axios</code> (librería externa)</li>
<li><code>superagent</code> (librería externa)</li>
<li><code>ofetch</code> (librería externa)</li>
</ul>
</li>
<li>Operación asíncrona</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="trabajo-con-urls">Trabajo con URLs</h2>
<ul>
<li>En general se usan simples <code>String</code> → <a href="../assets/url-parts.png" target="_blank">Partes (I)</a> → <a href="../assets/url-parts-optionals.png" target="_blank">Partes (II)</a> → <a href="../assets/query-strings.png" target="_blank">Partes (III)</a></li>
<li>Si quieres acceder a partes concretas, usa <code>new URL()</code> o <code>new URLSearchParams()</code></li>
<li>Para comprobar coincidencias con una o varias URL, usa <code>new URLPattern()</code></li>
</ul>
<steps>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> url = <span class="hljs-keyword">new</span> <span class="hljs-title function_">URL</span>(<span class="hljs-string">&quot;https://avotz.com/no/?tech=react&amp;debug=yes&quot;</span>);

url.<span class="hljs-property">pathname</span>;                                 <span class="hljs-comment">// &#x27;/no/&#x27;</span>
url.<span class="hljs-property">searchParams</span>.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;tech&quot;</span>);                 <span class="hljs-comment">// &#x27;react&#x27;</span>
url.<span class="hljs-property">search</span>;                                   <span class="hljs-comment">// &#x27;?tech=CSS&amp;debug=yes&#x27;</span>

<span class="hljs-keyword">const</span> sp = <span class="hljs-keyword">new</span> <span class="hljs-title class_">URLSearchParams</span>(url.<span class="hljs-property">search</span>);
sp.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;debug&quot;</span>);                              <span class="hljs-comment">// &#x27;yes&#x27;</span>
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> url = <span class="hljs-keyword">new</span> <span class="hljs-title class_">URLPattern</span>({
  <span class="hljs-attr">hostname</span>: <span class="hljs-string">&quot;app.avotz.com&quot;</span>,
  <span class="hljs-attr">pathname</span>: <span class="hljs-string">&quot;/:path/&quot;</span>
});

url.<span class="hljs-title function_">test</span>(<span class="hljs-string">&quot;https://avotz.com/no/&quot;</span>)              <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> false</span>
url.<span class="hljs-title function_">test</span>(<span class="hljs-string">&quot;https://app.avotz.com/no/&quot;</span>)          <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> true</span>
url.<span class="hljs-title function_">test</span>(<span class="hljs-string">&quot;https://lenguajejs.com/no/&quot;</span>)         <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> false</span>
</code></pre>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="uso-de-fetch">Uso de fetch</h2>
<ul>
<li>Documentación: <a href="https://cdnjs.com/api">API de JSdelivr</a></li>
<li>Mejoras: Controlar errores de red/conexión, de servidor, de timeout</li>
</ul>
<steps>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> response = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;https://api.cdnjs.com/libraries/snarkdown&quot;</span>);
<span class="hljs-keyword">const</span> data = <span class="hljs-keyword">await</span> response.<span class="hljs-title function_">json</span>();

data.<span class="hljs-property">name</span>           <span class="hljs-comment">// Nombre de la librería</span>
data.<span class="hljs-property">version</span>        <span class="hljs-comment">// Versión de la librería</span>
data.<span class="hljs-property">description</span>    <span class="hljs-comment">// Descripción de la librería</span>
data.<span class="hljs-property">latest</span>         <span class="hljs-comment">// Enlace al .js de la última versión</span>
data.<span class="hljs-property">authors</span>        <span class="hljs-comment">// Array de autores { name, email }</span>
data.<span class="hljs-property">keywords</span>       <span class="hljs-comment">// Array de tags</span>
data.<span class="hljs-property">license</span>        <span class="hljs-comment">// Licencia de la librería</span>
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-comment">// Gestionar los errores con un try/catch y sacar la URL</span>
<span class="hljs-keyword">const</span> <span class="hljs-variable constant_">URL</span> = <span class="hljs-string">&quot;https://api.cdnjs.com/libraries/snarkdown&quot;</span>;

<span class="hljs-keyword">try</span> {
  <span class="hljs-keyword">const</span> response = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(<span class="hljs-variable constant_">URL</span>);
  <span class="hljs-keyword">const</span> data = <span class="hljs-keyword">await</span> response.<span class="hljs-title function_">json</span>();
} <span class="hljs-keyword">catch</span> (error) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">error</span>(<span class="hljs-string">&quot;Error al obtener los datos: &quot;</span>, error);
}
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> <span class="hljs-variable constant_">URL</span> = <span class="hljs-string">&quot;https://api.cdnjs.com/libraries/snarkdown&quot;</span>;
<span class="hljs-keyword">try</span> {
  <span class="hljs-keyword">const</span> response = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(<span class="hljs-variable constant_">URL</span>);
  <span class="hljs-keyword">if</span> (!response.<span class="hljs-property">ok</span>)
    <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Error</span>(<span class="hljs-string">`HTTP Error: <span class="hljs-subst">${response.status}</span>`</span>);  <span class="hljs-comment">// Server error: lo envía al catch</span>
  <span class="hljs-keyword">const</span> data = <span class="hljs-keyword">await</span> response.<span class="hljs-title function_">json</span>();
} <span class="hljs-keyword">catch</span> (error) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">error</span>(<span class="hljs-string">&quot;Error al obtener los datos: &quot;</span>, error);
}
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> <span class="hljs-title function_">doRequest</span> = <span class="hljs-keyword">async</span> (<span class="hljs-params">URL, TIMEOUT = <span class="hljs-number">5000</span></span>) =&gt; {
  <span class="hljs-keyword">const</span> controller = <span class="hljs-keyword">new</span> <span class="hljs-title class_">AbortController</span>();
  <span class="hljs-keyword">const</span> timeoutId = <span class="hljs-built_in">setTimeout</span>(<span class="hljs-function">() =&gt;</span> controller.<span class="hljs-title function_">abort</span>(), <span class="hljs-variable constant_">TIMEOUT</span>);
  <span class="hljs-keyword">try</span> {
    <span class="hljs-keyword">const</span> response = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(<span class="hljs-variable constant_">URL</span>, { <span class="hljs-attr">signal</span>: controller.<span class="hljs-property">signal</span> });
    <span class="hljs-keyword">if</span> (!response.<span class="hljs-property">ok</span>) <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Error</span>(<span class="hljs-string">`HTTP Error: <span class="hljs-subst">${response.status}</span>`</span>);
    <span class="hljs-keyword">return</span> <span class="hljs-keyword">await</span> response.<span class="hljs-title function_">json</span>();
  }
  <span class="hljs-keyword">catch</span> (error) { <span class="hljs-comment">/* ... */</span> }
  <span class="hljs-keyword">finally</span> { <span class="hljs-built_in">clearTimeout</span>(timeoutId); }
}
</code></pre>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:alo;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="27" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;../assets/request-response.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="14" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:alo;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="27" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2 id="partes-de-la-comunicaci%C3%B3n">Partes de la comunicación</h2>
<ul>
<li>Petición → <code>Request</code></li>
<li>Cabeceras → <code>Headers</code></li>
<li>Respuesta → <code>Response</code></li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="14" style="" data-marpit-pagination-total="27" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="petici%C3%B3n-request">Petición: Request</h2>
<ul>
<li><a href="../assets/request-response.png">Request / Response</a></li>
<li>Puede ser <code>String</code> o puede ser un objeto <code>Request</code></li>
</ul>
<split-slide>
<pre><code class="language-js"><span class="hljs-comment">// Opción 1: String/Request al fetch</span>
<span class="hljs-keyword">const</span> request = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Request</span>(<span class="hljs-variable constant_">URL</span>);
<span class="hljs-keyword">const</span> response = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(request);

<span class="hljs-comment">// Opción 2: Opciones al fetch (o al Request)</span>
<span class="hljs-keyword">const</span> opts = {
  <span class="hljs-attr">method</span>: <span class="hljs-comment">/* ... */</span>,
  <span class="hljs-attr">headers</span>: <span class="hljs-comment">/* ... */</span>,
}
<span class="hljs-keyword">const</span> request = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Request</span>(<span class="hljs-variable constant_">URL</span>); <span class="hljs-comment">/* o aquí */</span>
<span class="hljs-keyword">const</span> response = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(request, opts);
</code></pre>
<div>
<table>
<thead>
<tr>
<th>Propiedad</th>
<th>Descripción</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>body</code></td>
<td>Stream del cuerpo de la petición.</td>
</tr>
<tr>
<td><code>method</code></td>
<td>Método HTTP de la petición (<code>GET</code>, <code>POST</code>...).</td>
</tr>
<tr>
<td><code>headers</code></td>
<td>Objeto de cabeceras de la petición.</td>
</tr>
<tr>
<td><code>signal</code></td>
<td>Señal para cancelar la petición.</td>
</tr>
<tr>
<td><code>credentials</code></td>
<td>Control de credenciales.</td>
</tr>
<tr>
<td><code>url</code></td>
<td>URL de la petición.</td>
</tr>
</tbody>
</table>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="cabeceras-headers">Cabeceras: Headers</h2>
<ul>
<li>Sirven para informar al servidor o cliente</li>
<li>En la Request se pueden añadir en el <code>fetch</code> o <code>Request</code></li>
</ul>
<split-slide>
<pre><code class="language-js"><span class="hljs-comment">// Se pueden añadir como un objeto normal</span>
<span class="hljs-keyword">const</span> opts = {
  <span class="hljs-attr">headers</span>: {
    <span class="hljs-string">&quot;Content-Type&quot;</span>: <span class="hljs-string">&quot;application/json&quot;</span>,
    <span class="hljs-string">&quot;Content-Encoding&quot;</span>: <span class="hljs-string">&quot;zstd, br, gzip&quot;</span>
    <span class="hljs-comment">/* Otras cabeceras */</span>
  },
  <span class="hljs-attr">body</span>: <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">stringify</span>({ <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;ManzDev&quot;</span> });
}
<span class="hljs-keyword">const</span> response = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(request, opts);
</code></pre>
<pre><code class="language-js"><span class="hljs-comment">// Se pueden añadir como un objeto Headers</span>
<span class="hljs-keyword">const</span> headers = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Headers</span>({
  <span class="hljs-string">&quot;Content-Type&quot;</span>: <span class="hljs-string">&quot;application/json&quot;</span>,
  <span class="hljs-string">&quot;Content-Encoding&quot;</span>: <span class="hljs-string">&quot;zstd, br, gzip&quot;</span>
});

<span class="hljs-comment">// O añadir posteriormente</span>
headers.<span class="hljs-title function_">append</span>(<span class="hljs-string">&quot;Header-Name&quot;</span>, <span class="hljs-string">&quot;value&quot;</span>);

<span class="hljs-keyword">const</span> response = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(request, {
  headers,
  <span class="hljs-attr">body</span>: <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">stringify</span>({ <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;ManzDev&quot;</span> });
});
</code></pre>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="respuesta-response">Respuesta: Response</h2>
<ul>
<li><a href="../assets/request-response.png">Request / Response</a></li>
<li>Normalmente nos lo envía de vuelta el <code>fetch()</code></li>
</ul>
<split-slide>
<pre><code class="language-js"><span class="hljs-keyword">const</span> response = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(request);

<span class="hljs-comment">// Formas de tratar la respuesta</span>
response.<span class="hljs-title function_">json</span>()     <span class="hljs-comment">// Object o primitivos</span>
response.<span class="hljs-title function_">text</span>()     <span class="hljs-comment">// String (texto plano)</span>
response.<span class="hljs-title function_">blob</span>()     <span class="hljs-comment">// Blob (imágenes)</span>
response.<span class="hljs-title function_">bytes</span>()    <span class="hljs-comment">// Uint8Array (binarios)</span>
response.<span class="hljs-title function_">formData</span>() <span class="hljs-comment">// FormData (formularios)</span>
</code></pre>
<div>
<table>
<thead>
<tr>
<th>Propiedad</th>
<th>Descripción</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>body</code></td>
<td>Stream del cuerpo de la respuesta.</td>
</tr>
<tr>
<td><code>headers</code></td>
<td>Objeto de cabeceras de la respuesta.</td>
</tr>
<tr>
<td><code>ok</code></td>
<td><code>true</code> si es error HTTP <code>200-299</code>.</td>
</tr>
<tr>
<td><code>redirected</code></td>
<td>Se trata de una redirección.</td>
</tr>
<tr>
<td><code>status</code></td>
<td>Código de error HTTP.</td>
</tr>
<tr>
<td><code>statusText</code></td>
<td>Texto asociado al código de error HTTP.</td>
</tr>
<tr>
<td><code>url</code></td>
<td>URL de la respuesta.</td>
</tr>
</tbody>
</table>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-scope-AHEGPBRE="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="18" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="27">
<h1 id="ejercicio">Ejercicio</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="27">
<h2 id="ejercicio-1">Ejercicio</h2>
<ul>
<li>Utilizaremos la API <a href="https://www.tvmaze.com/api">TVMaze</a> → <a href="https://api.tvmaze.com/search/shows?q=name">Busca ID por nombre</a></li>
</ul>
<pre><code class="language-bash"><img class="emoji" draggable="false" alt="📁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c1.svg" data-marp-twemoji=""/> tv-shows                      <span class="hljs-comment"># Carpeta del proyecto</span>

<h2 id="obtener-datos-de-una-serie-por-su-id">Obtener datos de una serie por su ID</h2>
<pre><code class="language-js"><span class="hljs-keyword">const</span> <span class="hljs-variable constant_">ID</span> = <span class="hljs-string">&quot;2993&quot;</span>;
<span class="hljs-keyword">const</span> <span class="hljs-variable constant_">PLACEHOLDER_IMAGE</span> = <span class="hljs-string">&quot;https://placehold.co/210x295&quot;</span>;

<span class="hljs-keyword">const</span> <span class="hljs-title function_">getShowData</span> = <span class="hljs-keyword">async</span> (<span class="hljs-params">id</span>) =&gt; {
  <span class="hljs-keyword">const</span> <span class="hljs-variable constant_">URL</span> = <span class="hljs-string">`https://api.tvmaze.com/shows/<span class="hljs-subst">${id}</span>`</span>;
  <span class="hljs-keyword">const</span> data = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(<span class="hljs-variable constant_">URL</span>).<span class="hljs-title function_">then</span>(<span class="hljs-function"><span class="hljs-params">res</span> =&gt;</span> res.<span class="hljs-title function_">json</span>());

  <span class="hljs-keyword">return</span> {
    <span class="hljs-attr">name</span>: data.<span class="hljs-property">name</span>,
    <span class="hljs-attr">rating</span>: data.<span class="hljs-property">rating</span>,
    <span class="hljs-attr">image</span>: data.<span class="hljs-property">image</span>?.<span class="hljs-property">medium</span> ?? <span class="hljs-variable constant_">PLACEHOLDER_IMAGE</span>
  }
}
</code></pre>
</section>

<h2 id="obtener-episodios-por-temporada">Obtener episodios por temporada</h2>
<pre><code class="language-js"><span class="hljs-keyword">const</span> <span class="hljs-title function_">getEpisodeList</span> = <span class="hljs-keyword">async</span> (<span class="hljs-params">id</span>) =&gt; {
  <span class="hljs-keyword">const</span> <span class="hljs-variable constant_">URL</span> = <span class="hljs-string">`https://api.tvmaze.com/shows/<span class="hljs-subst">${id}</span>/episodes`</span>;
  <span class="hljs-keyword">const</span> episodes = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(<span class="hljs-variable constant_">URL</span>).<span class="hljs-title function_">then</span>(<span class="hljs-function"><span class="hljs-params">res</span> =&gt;</span> res.<span class="hljs-title function_">json</span>());

    <span class="hljs-attr">rating</span>: episode.<span class="hljs-property">rating</span>.<span class="hljs-property">average</span>

  <span class="hljs-keyword">return</span> episodesBySeason;
}
