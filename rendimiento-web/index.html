<li>Hay varios <strong>niveles</strong> a los que puede funcionar: <img class="emoji" draggable="false" alt="🟥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e5.svg" data-marp-twemoji=""/> mal, <img class="emoji" draggable="false" alt="🟧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e7.svg" data-marp-twemoji=""/> regular, <img class="emoji" draggable="false" alt="🟨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e8.svg" data-marp-twemoji=""/> normal, <img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/> muy bien, <img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/> excelente...</li>
<li>Normalmente esto no preocupa... hasta que <strong>falla</strong> y se vuelve un problema <strong>grave</strong>.</li>
<li>No siempre hay que aplicarlo. Pero anticiparse suele ser una buena forma de prevenir problemas graves.</li>
</ul>
<h3 id="optimizaci%C3%B3n">Optimización</h3>
<ul>
<li><strong>Memoria</strong>: Cuanta menos RAM se use, mejor. Evitar páginas lentas o «congelamiento».</li>
<li><strong>Tiempo</strong>: Reducir el tiempo que tarda en realizar tareas. Evitar páginas lentas.</li>
<li><strong>Transferencia</strong>: Reducir el tiempo que tarda en descargar recursos. Evitar páginas lentas.</li>
<li><strong>Paquetes</strong>: Reducir la cantidad de dependencias que usamos. Más código que procesar, más lentitud.</li>
<li><strong>Medición</strong>: Sin datos, no sabes que optimizar, donde está fallando o si lo que cambias está funcionando.</li>
</ul>
<p><strong>Resumen</strong>: Evitar páginas lentas.</p>

<h2 id="garbage-collector">Garbage Collector</h2>
<ul>
<li>Es un proceso automático del lenguaje que <strong>libera memoria</strong></li>
</ul>
<split-slide style="--left: 60%; --right: 40%;">
<steps>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> data = [<span class="hljs-comment">/* Array con muchos datos */</span>];

<span class="hljs-keyword">function</span> <span class="hljs-title function_">method</span>(<span class="hljs-params"></span>) {
  <span class="hljs-comment">/* ... */</span>
}

<span class="hljs-comment">// ANTES: Memoria ocupada -→ <img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🟥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e5.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🟥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e5.svg" data-marp-twemoji=""/></span>
<span class="hljs-title function_">method</span>(); <span class="hljs-comment">// Memoria ocupada <img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🟥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e5.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🟥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e5.svg" data-marp-twemoji=""/></span>
<span class="hljs-comment">// LUEGO: Memoria ocupada -→ <img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🟥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e5.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🟥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e5.svg" data-marp-twemoji=""/></span>

<span class="hljs-comment">// data es global, ocupa durante todo el programa</span>
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">function</span> <span class="hljs-title function_">method</span>(<span class="hljs-params"></span>) {
  <span class="hljs-keyword">const</span> data = [<span class="hljs-comment">/* Array con muchos datos */</span>];
  <span class="hljs-comment">/* ... */</span>
}

<span class="hljs-comment">// ANTES: Memoria libre ---→ <img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/></span>
<span class="hljs-title function_">method</span>(); <span class="hljs-comment">// Memoria ocupada <img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🟥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e5.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🟥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e5.svg" data-marp-twemoji=""/></span>
<span class="hljs-comment">/* Si no quedan referencias a data */</span>
<span class="hljs-comment">// LUEGO: Memoria libre ---→ <img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/></span>

<span class="hljs-comment">// data es local, ocupa sólo durante función</span>
</code></pre>
</step>
</steps>
<div>
<ul>
<li>El GC decide <strong>cuando</strong> liberar memoria (no lo decides tú)</li>
<li>El GC elimina cuando no son <strong>alcanzables</strong> (sin referencias)</li>
</ul>
<h3 id="recuerda">Recuerda:</h3>
<ul>
<li>
<p><code>const a = b</code> → Esto es una referencia, no una copia</p>
</li>
<li>
<p>El objeto nace</p>
</li>
<li>
<p>Si el objeto no tiene <strong>ninguna</strong> referencia a él...</p>
</li>
<li>
<p>El motor lo marca como <strong>inalcanzables</strong> (0 ref)</p>
</li>
<li>
<p>El <strong>Garbage Collector</strong> los recolecta para borrarlos</p>
</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="29">
<h2 id="memory-leaks">Memory leaks</h2>
<ul>
<li>Si existen referencias a un objeto que <strong>ya no necesitas</strong>, GC <strong>no puede liberar su memoria</strong></li>
<li>Esa memoria no podrá reutilizarse hasta cerrar la aplicación o web (que se liberan sus recursos)</li>
</ul>
<steps>
<step>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-comment">// main.js</span>
<span class="hljs-keyword">import</span> { moduleVar } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./module.js&quot;</span>;

<span class="hljs-keyword">const</span> <span class="hljs-variable language_">global</span> = []; <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Global: siempre viva</span>

<span class="hljs-keyword">function</span> <span class="hljs-title function_">method</span>(<span class="hljs-params"></span>) {
  <span class="hljs-keyword">const</span> local = [];   <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Local: Se limpia al terminar fx</span>
}

<span class="hljs-comment">// module.js</span>
<span class="hljs-keyword">const</span> moduleVar = []; <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Global: Siempre viva</span>
<span class="hljs-variable language_">window</span>.<span class="hljs-property">noRemove</span> = []; <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Global: Siempre viva</span>
globalThis.<span class="hljs-property">same</span> = []; <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Global: Siempre viva</span>
</code></pre>
<div>
<h3 id="1%EF%B8%8F%E2%83%A3-variables-globales--de-m%C3%B3dulo-%E2%86%92-%F0%9F%92%A7-leak"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Variables globales / de módulo → <img class="emoji" draggable="false" alt="💧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a7.svg" data-marp-twemoji=""/> leak</h3>
<ul>
<li>
<p><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Evita variables globales muy grandes</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Evita meter vars en <code>window</code> o <code>globalThis</code></p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Variables de módulos ESM → son singletons</p>
<ul>
<li>Se cargan una vez y viven toda la sesión</li>
</ul>
</li>
<li>
<p>🗑 Cualquier objeto asignado así <strong>nunca será recolectado</strong></p>
</li>
</ul>
</div>
</split-slide>
</step>
<step>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-keyword">const</span> cache = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Map</span>();
cache.<span class="hljs-title function_">set</span>(id, value); <span class="hljs-comment">// LEAK: Nunca se elimina <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></span>

<span class="hljs-comment">// LRU: Max. 500 (más antiguo sale) <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></span>
<span class="hljs-keyword">const</span> cache = <span class="hljs-keyword">new</span> <span class="hljs-title class_">QuickLRU</span>({ <span class="hljs-attr">maxSize</span>: <span class="hljs-number">500</span> });
cache.<span class="hljs-title function_">set</span>(id, value);

<span class="hljs-comment">// TTL: Expira por tiempo de vida <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></span>
<span class="hljs-keyword">const</span> cache = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Map</span>();
cache.<span class="hljs-title function_">set</span>(id, { value, <span class="hljs-attr">expires</span>: <span class="hljs-title class_">Date</span>.<span class="hljs-title function_">now</span>() + <span class="hljs-number">60_000</span> });
<span class="hljs-comment">// Añadir lógica para comprobar TTL y borrar</span>

<span class="hljs-comment">// WeakMap: Autoborrado si &quot;domNode&quot; muere <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></span>
<span class="hljs-keyword">const</span> cache = <span class="hljs-keyword">new</span> <span class="hljs-title class_">WeakMap</span>();
cache.<span class="hljs-title function_">set</span>(domNode, value);
</code></pre>
<div>
<h3 id="2%EF%B8%8F%E2%83%A3-cach%C3%A9-sin-l%C3%ADmite-%E2%86%92-%F0%9F%92%A7-leak"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Caché sin límite → <img class="emoji" draggable="false" alt="💧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a7.svg" data-marp-twemoji=""/> leak</h3>
<ul>
<li>Un Map o Array que no se limita → leak (silencioso)</li>
<li>No da error, simplemente consume más y más</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Un caché debería tener límite</li>
</ul>
<h3 id="soluciones">Soluciones:</h3>
<ul>
<li><strong>LRU</strong> → Least Recently Used → <a href="https://isaacs.github.io/node-lru-cache/">lru-cache</a> o <a href="https://github.com/sindresorhus/quick-lru">quick-lru</a></li>
<li><strong>TTL</strong> → Revisa si supera tiempo de vida <a href="https://github.com/isaacs/ttlcache">ttlcache</a> o <a href="https://github.com/avoidwork/tiny-lru">tiny-lru</a></li>
<li><a href="https://lenguajejs.com/javascript/set-map/que-es-map-weakmap/#qu%C3%A9-son-los-weakmap">WeakMap</a> → Si key es objeto (DOM, clase...), la entrada desaparece cuando es recolectado</li>
</ul>
</div>
</split-slide>
</step>
<step>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Leak clásico</span>
<span class="hljs-keyword">let</span> btn = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.button&quot;</span>);  <span class="hljs-comment">// global</span>
btn.<span class="hljs-title function_">remove</span>();
<span class="hljs-comment">// Se elimina el .button del DOM (HTML)</span>
<span class="hljs-comment">// &quot;btn&quot; sigue referenciado por la variable global</span>
<span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> El GC no puede recolectarlo</span>

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Correcto</span>
{
  <span class="hljs-keyword">let</span> btn = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.button&quot;</span>);  <span class="hljs-comment">// local</span>
  btn.<span class="hljs-title function_">remove</span>();
}
btn = <span class="hljs-literal">null</span>  <span class="hljs-comment">// Si es global, fuerza a eliminar la referencia</span>
<span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Ahora el GC puede recolectarlo</span>
</code></pre>
<div>
<h3 id="3%EF%B8%8F%E2%83%A3-detached-node-%E2%86%92-%F0%9F%92%A7-leak"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Detached node → <img class="emoji" draggable="false" alt="💧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a7.svg" data-marp-twemoji=""/> leak</h3>
<ul>
<li>Detached: Nodos eliminados <strong>pero aún referenciados</strong></li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Sigue referenciado → <strong>GC</strong> no puede recolectarlo</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Puede retener nodos hijos, listeners...</li>
</ul>
<h3 id="c%C3%B3mo-buscarlos">Cómo buscarlos:</h3>
<ul>
<li>Dev Tools / Memory / Buscar &quot;Detached&quot;</li>
<li>Variables globales o de módulo</li>
<li>Stores globales (montar componentes sin desmontarlos)</li>
<li>Nodos globales en array &quot;para procesar luego&quot;</li>
</ul>
</div>
</split-slide>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="29">
<h2 id="listeners-hu%C3%A9rfanos">Listeners huérfanos</h2>
<ul>
<li>Un <code>listener</code> huérfano → Continua escuchando eventos desde un elemento que se ha eliminado del DOM<br />
Como no se eliminó el evento, sigue escuchando y el <strong>GC</strong> no puede recolectarlo</li>
</ul>
<split-slide style="--left: 55%; --right: 50%; --font-size: 1rem;">
<steps>
<step>
<pre><code class="language-js"><span class="hljs-keyword">const</span> <span class="hljs-title function_">mountModal</span>(<span class="hljs-params"></span>) {
  <span class="hljs-keyword">const</span> btn = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.close&quot;</span>);
  <span class="hljs-comment">/* ... */</span>

  <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;keydown&quot;</span>, <span class="hljs-function"><span class="hljs-params">ev</span> =&gt;</span> {
    <span class="hljs-keyword">if</span> (e.<span class="hljs-property">key</span> === <span class="hljs-string">&quot;Escape&quot;</span>) <span class="hljs-title function_">closeModal</span>();
  });
}

</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">function</span> <span class="hljs-title function_">mountModal</span>(<span class="hljs-params"></span>) {
  <span class="hljs-comment">/* ... */</span>

  <span class="hljs-keyword">const</span> controller = <span class="hljs-keyword">new</span> <span class="hljs-title class_">AbortController</span>();
  <span class="hljs-keyword">const</span> { signal } = controller;

  <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;keydown&quot;</span>, <span class="hljs-function">() =&gt;</span> { ... }, { signal })
  <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;click&quot;</span>, <span class="hljs-function">() =&gt;</span> { ... }, { signal })
  globalThis.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;resize&quot;</span>, <span class="hljs-function">() =&gt;</span> { ... }, { signal })

  <span class="hljs-keyword">return</span> <span class="hljs-function">() =&gt;</span> controller.<span class="hljs-title function_">abort</span>() <span class="hljs-comment">// elimina los tres de golpe</span>
}
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Se añade un listener por botón</span>
<span class="hljs-keyword">const</span> buttons = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelectorAll</span>(<span class="hljs-string">&quot;.button&quot;</span>);
buttons.<span class="hljs-title function_">forEach</span>(<span class="hljs-function"><span class="hljs-params">btn</span> =&gt;</span>
  btn.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;click&quot;</span>, <span class="hljs-function">() =&gt;</span> { ... })
);

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Un listener padre para gobernarlos a todos <img class="emoji" draggable="false" alt="💍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f48d.svg" data-marp-twemoji=""/></span>
<span class="hljs-keyword">const</span> parent = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.parent&quot;</span>);
parent.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;click&quot;</span>, <span class="hljs-function"><span class="hljs-params">ev</span> =&gt;</span> {
  <span class="hljs-keyword">const</span> btn = ev.<span class="hljs-property">target</span>.<span class="hljs-title function_">closest</span>(<span class="hljs-string">&quot;.button&quot;</span>);
  <span class="hljs-keyword">if</span> (btn) () =&gt; { ... }
});
</code></pre>
</step>
</steps>
<div>
<ul>
<li>👁‍🗨 Cada vez que se monta, se añade listener nuevo</li>
<li><img class="emoji" draggable="false" alt="🔥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f525.svg" data-marp-twemoji=""/> Si se monta/desmonta 10 veces → 10 listeners</li>
</ul>
<h3 id="soluciones-1">Soluciones:</h3>
<ul>
<li><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> ¿Puedes resolverlo sin Javascript? → <code>&lt;dialog&gt;</code></li>
<li><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Añade un <code>removeEventListener</code></li>
<li><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Usa <code>AbortController</code> para cancelar todos</li>
<li><img class="emoji" draggable="false" alt="4️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/34-20e3.svg" data-marp-twemoji=""/> Usa delegación de eventos en el padre</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="29">
<h2 id="windowing-listas-virtuales">Windowing: Listas virtuales</h2>
<ul>
<li><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> Tenemos una web con una tabla con MUCHOS datos/elementos (nodos) → <a href="../assets/virtual-scroll.png">Windowing</a></li>
</ul>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<div>
<h3 id="el-problema">El problema</h3>
<ul>
<li><img class="emoji" draggable="false" alt="🧠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e0.svg" data-marp-twemoji=""/> Aparentemente simple, pero problema complejo.</li>
<li>Renderizar y mantener MUCHOS nodos vivos es costoso</li>
<li>Cada elemento requiere tareas de renderización</li>
<li>AL FINAL: El usuario sólo ve ~10-15 nodos</li>
<li>¿Cuando optimizar?
<ul>
<li><img class="emoji" draggable="false" alt="☁️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2601.svg" data-marp-twemoji=""/> <code>&lt; 100 nodos</code> → <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> No hace falta optimizar</li>
<li><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> <code>100-500 nodos</code> → <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Si son complejos, optimizar</li>
<li><img class="emoji" draggable="false" alt="🧱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f1.svg" data-marp-twemoji=""/> <code>&gt; 500 nodos</code> → <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Optimizar siempre</li>
</ul>
</li>
</ul>
</div>
<div>
<h3 id="soluciones-2">Soluciones</h3>
<ul>
<li>Sólo renderizar los nodos en pantalla</li>
<li>Añadir unos nodos «offset» (para evitar FOUC/saltos)</li>
<li>JS: <code>IntersectionObserver</code>
<ul>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Rompe posición scroll, sólo es lazy rendering</li>
</ul>
</li>
<li>CSS: <code>content-visibility</code>
<ul>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Ahorra rendering, pero los nodos siguen en memoria</li>
</ul>
</li>
<li>Librerías:
<ul>
<li><a href="https://tanstack.com/virtual/latest">TanStack Virtual</a></li>
<li><a href="https://github.com/inokawa/virtua">virtua</a></li>
<li><a href="https://vlist.io/examples/">vlist</a></li>
</ul>
</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-scope-Sfn4uaoo="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="10" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="29">
<h1 id="uso-de-ancho-de-banda-transferencia">Uso de ancho de banda (Transferencia)</h1>
<ul>
<li>Resource Hints</li>
<li>Lazy loading</li>
<li>Tree shaking</li>
<li>Sistemas de caché</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="29">
<h2 id="resource-hints">Resource Hints</h2>
<ul>
<li>Etiquetas <code>&lt;link&gt;</code> que indican recursos que vas a necesitar</li>
<li>Con ellas preparas al navegador antes de se soliciten y tengas que esperar a que se descarguen.</li>
</ul>
<steps>
<step>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- Mejora conexión a otros dominios --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">rel</span>=<span class="hljs-string">&quot;preconnect&quot;</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;https://fonts.googleapis.com&quot;</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">rel</span>=<span class="hljs-string">&quot;preconnect&quot;</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;https://api.dominio.com&quot;</span>&gt;</span>
<span class="hljs-comment">&lt;!-- Úsalo para APIs, CDNs de fuentes, analytics --&gt;</span>
<span class="hljs-comment">&lt;!-- Máx: 4-6 (cada conexión consume recursos) --&gt;</span>

<span class="hljs-comment">&lt;!-- Precargar script que va a ser usado (baja prioridad) --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">rel</span>=<span class="hljs-string">&quot;prefetch&quot;</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;/chunks/dashboard.js&quot;</span> <span class="hljs-attr">as</span>=<span class="hljs-string">&quot;script&quot;</span>&gt;</span>
</code></pre>
<div>
<h3 id="1%EF%B8%8F%E2%83%A3-preconnect"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> preconnect</h3>
<ul>
<li>Realiza <strong>Búsqueda DNS</strong> + <strong>Negocicación TCP/TLS</strong>
<ul>
<li><strong>Cuando</strong>: Antes de que se solicite el primer recurso</li>
</ul>
</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Ahorras <code>100–500ms</code> en la primera petición a ese origen</li>
</ul>
<h3 id="2%EF%B8%8F%E2%83%A3-prefetch"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/> prefetch</h3>
<ul>
<li>Descarga un recurso con baja prioridad
<ul>
<li><strong>Cuando</strong>: Descarga en <strong>idle</strong> + lo guarda en caché</li>
</ul>
</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Úsalo si lo necesitas en la sig. navegación (no en la actual)</li>
</ul>
</div>
</split-slide>
</step>
<step>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- Fuente crítica (dales siempre prioridad) --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">rel</span>=<span class="hljs-string">&quot;preload&quot;</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;/fonts/outfit.woff2&quot;</span> <span class="hljs-attr">as</span>=<span class="hljs-string">&quot;font&quot;</span>
      <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;font/woff2&quot;</span> <span class="hljs-attr">crossorigin</span>&gt;</span>

<span class="hljs-comment">&lt;!-- Imagen principal (en primer impacto visual) --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">rel</span>=<span class="hljs-string">&quot;preload&quot;</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;/hero.webp&quot;</span> <span class="hljs-attr">as</span>=<span class="hljs-string">&quot;image&quot;</span>&gt;</span>

<span class="hljs-comment">&lt;!-- Algo que sabes que se necesitará inmediatamente --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">rel</span>=<span class="hljs-string">&quot;preload&quot;</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;/critical.js&quot;</span> <span class="hljs-attr">as</span>=<span class="hljs-string">&quot;script&quot;</span>&gt;</span>

<span class="hljs-comment">&lt;!-- ⚠ Si precargas algo y no lo usas en 3s, warning --&gt;</span>
</code></pre>
<div>
<h3 id="3%EF%B8%8F%E2%83%A3-preload"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/> preload</h3>
<ul>
<li>Descarga un recurso lo antes posible (precarga)</li>
<li><strong>Cuando</strong>: Descarga inmediatamente, ejecuta cuando lo necesite</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Sólo si lo necesitas inmediatamente</li>
</ul>
</div>
</split-slide>
</step>
<step>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- Precarga el módulo y sus dependencias --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">rel</span>=<span class="hljs-string">&quot;modulepreload&quot;</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;/js/app.js&quot;</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">rel</span>=<span class="hljs-string">&quot;modulepreload&quot;</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;/modules/vendor-react.js&quot;</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">rel</span>=<span class="hljs-string">&quot;modulepreload&quot;</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;/modules/router.js&quot;</span>&gt;</span>
</code></pre>
<div>
<h3 id="4%EF%B8%8F%E2%83%A3-modulepreload"><img class="emoji" draggable="false" alt="4️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/34-20e3.svg" data-marp-twemoji=""/> modulepreload</h3>
<ul>
<li>Como <code>preload</code> pero para módulos (ESM).</li>
<li>Descarga, parsea y procesa el módulo</li>
<li>Crea grafo de dependencias (evita &quot;efecto cascada&quot;)</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Efecto cascada → Cada <code>import</code> &quot;descubre&quot; el siguiente</li>
</ul>
</div>
</split-slide>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="29">
<h2 id="lazy-loading">Lazy loading</h2>
<ul>
<li>Técnica que no carga un recurso <strong>hasta que se necesita</strong></li>
<li>...pero &quot;necesita&quot; puede tener significados distintos según el caso</li>
</ul>
<steps>
<step>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- Carga la imagen al procesar este HTML --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">img</span> <span class="hljs-attr">loading</span>=<span class="hljs-string">&quot;eager&quot;</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;foto.jpg&quot;</span> <span class="hljs-attr">alt</span>=<span class="hljs-string">&quot;...&quot;</span>&gt;</span>

<span class="hljs-comment">&lt;!-- Precarga. Dentro del &lt;head&gt; --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">rel</span>=<span class="hljs-string">&quot;preload&quot;</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;/img/foto.jpg&quot;</span> <span class="hljs-attr">as</span>=<span class="hljs-string">&quot;image&quot;</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">rel</span>=<span class="hljs-string">&quot;preconnect&quot;</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;https://cdn.manz.dev/&quot;</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">rel</span>=<span class="hljs-string">&quot;dns-prefetch&quot;</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;https://cdn.manz.dev/&quot;</span>&gt;</span>

<span class="hljs-comment">&lt;!-- Bloquea render. Dentro del &lt;head&gt; --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">rel</span>=<span class="hljs-string">&quot;expect&quot;</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;#nombre&quot;</span> <span class="hljs-attr">blocking</span>=<span class="hljs-string">&quot;render&quot;</span>&gt;</span>
</code></pre>
<div>
<h3 id="1%EF%B8%8F%E2%83%A3-eager-acceso-cr%C3%ADtico"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Eager (Acceso crítico)</h3>
<ul>
<li>
<p>El atributo <code>loading=&quot;eager&quot;</code> indica que realice la petición</p>
</li>
<li>
<p>Es el valor por defecto</p>
</li>
<li>
<p>El <code>preload</code> da <a href="https://lenguajehtml.com/html/recursos-externos/etiquetas-precarga-html/#por-recurso">prioridad absoluta</a> → <img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <a href="https://lenguajehtml.com/html/recursos-externos/etiquetas-precarga-html/#tipos-de-recursos">Tipos</a> fonts</p>
</li>
<li>
<p>El <code>dns-prefetch</code> <a href="https://lenguajehtml.com/html/recursos-externos/etiquetas-precarga-html/#por-dominio">precarga dominios</a> → solo dns</p>
</li>
<li>
<p>El <code>preconnect</code> → dns + tcp + tls (lo vimos antes)</p>
</li>
</ul>
<p>⚠ El <code>expect</code> bloquea render hasta que un <code>id</code> se haya cargado</p>
</div>
</split-slide>
</step>
<step>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- Imágenes: Buen soporte --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">img</span> <span class="hljs-attr">loading</span>=<span class="hljs-string">&quot;lazy&quot;</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;foto.jpg&quot;</span> <span class="hljs-attr">alt</span>=<span class="hljs-string">&quot;...&quot;</span>&gt;</span>

<span class="hljs-comment">&lt;!-- Iframe: Buen soporte --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">iframe</span> <span class="hljs-attr">loading</span>=<span class="hljs-string">&quot;lazy&quot;</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;https://manz.dev/&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">iframe</span>&gt;</span>

<span class="hljs-comment">&lt;!-- Video/Audio: Soporte reducido aún --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">video</span> <span class="hljs-attr">loading</span>=<span class="hljs-string">&quot;lazy&quot;</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;video.mp4&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">video</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">audio</span> <span class="hljs-attr">loading</span>=<span class="hljs-string">&quot;lazy&quot;</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;audio.mp3&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">audio</span>&gt;</span>
</code></pre>
<div>
<h3 id="2%EF%B8%8F%E2%83%A3-lazy-por-viewport"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Lazy por viewport</h3>
<ul>
<li>El atributo <code>loading=&quot;lazy&quot;</code> pospone carga fuera del viewport</li>
<li>El atributo <code>width</code> y <code>height</code> son obligatorios con lazy loading
<ul>
<li>Sin tamaño, navegador no sabe calcular y produce <strong>CLS</strong></li>
</ul>
</li>
<li>No uses <code>loading=&quot;lazy&quot;</code> en elementos por encima del «FOLD»</li>
</ul>
</div>
</split-slide>
</step>
<step>
<split-slide style="--font-size: 1rem;">
<div>
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- Prefetch. Dentro del &lt;head&gt; --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">rel</span>=<span class="hljs-string">&quot;prefetch&quot;</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;/img/foto.jpg&quot;</span> <span class="hljs-attr">as</span>=<span class="hljs-string">&quot;image&quot;</span>&gt;</span>
</code></pre>
<pre><code class="language-js"><span class="hljs-comment">// Carga cuando el hilo está libre</span>
<span class="hljs-title function_">requestIdleCallback</span>(<span class="hljs-function">() =&gt;</span> <span class="hljs-keyword">import</span>(<span class="hljs-string">`/pages/dashboard.js`</span>));
</code></pre>
</div>
<div>
<h3 id="3%EF%B8%8F%E2%83%A3-lazy-por-idle"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Lazy por idle</h3>
<ul>
<li>
<p>El <code>prefetch</code> carga recurso cuando está en idle (lo vimos antes)</p>
<ul>
<li>Indica en <code>as</code> el <a href="https://lenguajehtml.com/html/recursos-externos/etiquetas-precarga-html/#tipos-de-recursos">tipo de recurso</a> del que se trata</li>
</ul>
</li>
<li>
<p>El <code>requestIdleCallback()</code> se llama cuando tiene tiempo libre</p>
</li>
<li>
<p>En la función de callback se pueden realizar acciones como:</p>
<ul>
<li>Añadir <code>&lt;link&gt;</code> al <code>document.head</code></li>
<li>Importar ficheros o recursos con <code>import()</code></li>
</ul>
</li>
</ul>
</div>
</split-slide>
</step>
<step>
<split-slide style="--font-size: 1rem;">
<div>
<pre><code class="language-js"><span class="hljs-comment">// Añade el &lt;link rel=&quot;modulepreload&quot;&gt; cuando &quot;hover&quot;</span>
button.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;mouseenter&quot;</span>, <span class="hljs-function">() =&gt;</span> {
  <span class="hljs-keyword">const</span> link = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">createElement</span>(<span class="hljs-string">&quot;link&quot;</span>);
  link.<span class="hljs-property">rel</span> = <span class="hljs-string">&quot;modulepreload&quot;</span>;
  link.<span class="hljs-property">href</span> = <span class="hljs-string">`/pages/dashboard.js`</span>;
  <span class="hljs-variable language_">document</span>.<span class="hljs-property">head</span>.<span class="hljs-title function_">append</span>(link);
}, { <span class="hljs-attr">once</span>: <span class="hljs-literal">true</span> });

<span class="hljs-comment">// Se hace &quot;click&quot;, importa recurso y ejecuta render()</span>
button.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;click&quot;</span>, <span class="hljs-title function_">async</span> (ev) =&gt; {
  ev.<span class="hljs-title function_">preventDefault</span>();
  <span class="hljs-keyword">const</span> { render } = <span class="hljs-keyword">await</span> <span class="hljs-keyword">import</span>(<span class="hljs-string">&quot;/pages/dashboard.js&quot;</span>);
  <span class="hljs-title function_">render</span>();
});
</code></pre>
</div>
<div>
<h3 id="4%EF%B8%8F%E2%83%A3-lazy-por-interacci%C3%B3n"><img class="emoji" draggable="false" alt="4️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/34-20e3.svg" data-marp-twemoji=""/> Lazy por interacción</h3>
<ul>
<li>
<p>Al hacer <code>hover</code>, se añade el <strong>resource hint</strong></p>
<ul>
<li>El <code>modulepreload</code> → Descarga + parsea módulo <code>.js</code></li>
<li>Procesa las dependencias (<code>import</code>)</li>
<li>Lo deja listo para ejecutar</li>
</ul>
</li>
<li>
<p>Cuando se hace <code>click</code>...</p>
<ul>
<li>Se invalida la acción por defecto</li>
<li>Se importa el <code>render</code> ya descargado y parseado</li>
<li>Se ejecuta ``render()```</li>
</ul>
</li>
</ul>
</div>
</split-slide>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="29">
<h2 id="tree-shaking">Tree shaking</h2>
<ul>
<li>El <strong>bundler</strong> (vite, webpack...) es capaz de eliminar código que se importa pero nunca se usa.<br />
<code>El nombre viene de &quot;sacudir el árbol&quot; para que caigan las hojas muertas</code></li>
</ul>
<steps>
<step>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Usar ESM (necesario para saber que se usa)</span>
<span class="hljs-keyword">import</span> { format } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;date-fns&quot;</span>;
<span class="hljs-keyword">import</span> * <span class="hljs-keyword">as</span> utils <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./utils.js&quot;</span>;

<span class="hljs-comment">// Si importas todo, no uses keys</span>
utils.<span class="hljs-title function_">format</span>();    <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Hace tree-shaking</span>
utils[<span class="hljs-string">&quot;format&quot;</span>](); <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> No tree-shakeable</span>

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> No usar CommonJS (no puede analizar)</span>
<span class="hljs-keyword">const</span> { format } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;date-fns&quot;</span>);
</code></pre>
<div>
<h3 id="1%EF%B8%8F%E2%83%A3-tree-shaking"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Tree Shaking</h3>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Requisito fundamental: ESM puro → <code>import</code> / <code>export</code></li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Preferir <code>import</code> nombrados selectivos con <code>{</code> y <code>}</code></li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> No usar keys si importas todo el módulo</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> No sirve con CommonJS → <code>require()</code> / <code>module.exports</code></li>
</ul>
</div>
</split-slide>
</step>
<step>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> index.js re-exporta todo</span>
<span class="hljs-keyword">export</span> * <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./Button&quot;</span>;      <span class="hljs-comment">// Puede ser un archivo</span>
<span class="hljs-keyword">export</span> * <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./components&quot;</span>;  <span class="hljs-comment">// Es una carpeta</span>
<span class="hljs-keyword">export</span> * <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./Table&quot;</span>;       <span class="hljs-comment">// Pesa 50KB</span>
<span class="hljs-comment">// Bundler ve `export *` → incluye todo &quot;por si acaso&quot;</span>

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Importa directamente del archivo fuente</span>
<span class="hljs-keyword">import</span> { <span class="hljs-title class_">Button</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./components&quot;</span>;        <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> No</span>
<span class="hljs-keyword">import</span> { <span class="hljs-title class_">Button</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./components/Button&quot;</span>; <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Sí</span>

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> O usa re-exports nombrados (sin comodines)</span>
<span class="hljs-keyword">export</span> * <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./Modal&quot;</span>;            <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> No</span>
<span class="hljs-keyword">export</span> { <span class="hljs-title class_">Modal</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./Modal&quot;</span>;    <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Sí</span>
</code></pre>
<div>
<h3 id="2%EF%B8%8F%E2%83%A3-evitar-barrels"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Evitar barrels</h3>
<ul>
<li>Barrel: Entrypoint único que re-exporta todo desde otro lugar</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Evita re-exportaciones (o hazlas con cuidado)</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Un problema grave → re-exportar carpetas (común en TS)</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Si no usas bundler, no hay problema de tamaño del bundle</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Si usas barrels → directos y sin wildcards</li>
</ul>
<p>Más información sobre los <a href="https://lenguajejs.com/javascript/modulos/barrel-imports/">Barrels</a></p>
</div>
</split-slide>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="29">
<h2 id="sistemas-de-cach%C3%A9">Sistemas de caché</h2>
<ul>
<li>El caché es un almacenamiento temporal para evitar repetir acciones y hacerlas más rápido → Cache</li>
</ul>
<steps>
<step>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-bash">🅰 Sin caché (primera visita)
<img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> Browser +-→ /index.html ←→ <img class="emoji" draggable="false" alt="🌍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f30d.svg" data-marp-twemoji=""/> Internet ←→ <img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> Server
               /index.css  ←→ <img class="emoji" draggable="false" alt="🌍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f30d.svg" data-marp-twemoji=""/> Internet ←→ <img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> Server
               /index.js   ←→ <img class="emoji" draggable="false" alt="🌍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f30d.svg" data-marp-twemoji=""/> Internet ←→ <img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> Server
               /logo.webp  ←→ <img class="emoji" draggable="false" alt="🌍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f30d.svg" data-marp-twemoji=""/> Internet ←→ <img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> Server

🅱 Con caché (segunda visita)
<img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> Browser +-→ /page2.html ←→ <img class="emoji" draggable="false" alt="🌍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f30d.svg" data-marp-twemoji=""/> Internet ←→ <img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> Server
               /index.css  ☑ Cacheado. Ya lo tiene.
               /index.js   ☑ Cacheado. Ya lo tiene.
               /logo.webp  ☑ Cacheado. Ya lo tiene.
</code></pre>
<div>
<h3 id="1%EF%B8%8F%E2%83%A3-cachea-el-%C2%ABpasado%C2%BB"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Cachea el «pasado»</h3>
<ul>
<li>Aquí hablamos de <strong>caché en el navegador</strong></li>
<li>🅰 Descargas <strong>sin caché</strong> de navegador</li>
<li>🅱 Descargas <strong>con caché</strong> de navegador</li>
</ul>
</div>
</split-slide>
</step>
<step>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-bash">[<img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/>] Caché a nivel de navegador
<img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> Browser [<img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/>] → <img class="emoji" draggable="false" alt="🌍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f30d.svg" data-marp-twemoji=""/> Internet → <img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> Server

<steps>

<pre><code class="language-bash"><span class="hljs-comment"># Mostrar codecs concretos</span>

<h2 id="creando-tests-unitarios">Creando tests unitarios</h2>
<ul>
<li>API básica: <code>describe</code>, <code>it</code>, <code>test</code>, <code>expect</code> y matchers <code>toBe</code>, <code>toEqual</code>...</li>
</ul>
<split-slide style="--left: 30%; --right: 70%; --font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-comment">// Fichero add.js</span>
<span class="hljs-keyword">export</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">add</span>(<span class="hljs-params">a, b</span>) {
  <span class="hljs-keyword">return</span> a + b
}

<span class="hljs-comment">/**
 *
 * add(1, 2) devuelve 3
 *
 * add(-1, -1) devuelve -2
 *
 * add(5, 0) devuelve 5
 *
 * add(2) devuelve
 *
 */</span>
</code></pre>
<pre><code class="language-js"><span class="hljs-comment">// Fichero add.test.js</span>
<span class="hljs-keyword">import</span> { describe, it, test, expect } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;vitest&quot;</span>;

<span class="hljs-title function_">describe</span>(<span class="hljs-string">&quot;add&quot;</span>, <span class="hljs-function">() =&gt;</span> {
  <span class="hljs-title function_">it</span>(<span class="hljs-string">&quot;suma dos números positivos&quot;</span>, <span class="hljs-function">() =&gt;</span> {
    <span class="hljs-title function_">expect</span>(<span class="hljs-title function_">add</span>(<span class="hljs-number">1</span>, <span class="hljs-number">2</span>)).<span class="hljs-title function_">toBe</span>(<span class="hljs-number">3</span>)                <span class="hljs-comment">// Si sumas 1 + 2, esperas 3</span>
  })

  <span class="hljs-title function_">it</span>(<span class="hljs-string">&quot;suma números negativos&quot;</span>, <span class="hljs-function">() =&gt;</span> {
    <span class="hljs-title function_">expect</span>(<span class="hljs-title function_">add</span>(-<span class="hljs-number">1</span>, -<span class="hljs-number">2</span>)).<span class="hljs-title function_">toBe</span>(-<span class="hljs-number">3</span>)             <span class="hljs-comment">// Si sumas -1 + -2, esperas -3</span>
  })

  <span class="hljs-title function_">test</span>(<span class="hljs-string">&quot;suma cero&quot;</span>, <span class="hljs-function">() =&gt;</span> {                  <span class="hljs-comment">// it() y test() son idénticos</span>
    <span class="hljs-title function_">expect</span>(<span class="hljs-title function_">add</span>(<span class="hljs-number">5</span>, <span class="hljs-number">0</span>)).<span class="hljs-title function_">toBe</span>(<span class="hljs-number">5</span>)                <span class="hljs-comment">// Si sumas 5 + 0, esperas 5</span>
  })
});
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="29">
<h2 id="componente-clickcounterjs">Componente ClickCounter.js</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-keyword">class</span> <span class="hljs-title class_">ClickCounter</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_ inherited__">HTMLElement</span> {
  #count = <span class="hljs-number">0</span>

  <span class="hljs-title function_">handleEvent</span>(<span class="hljs-params">ev</span>) {
    <span class="hljs-keyword">if</span> (!ev.<span class="hljs-property">target</span>.<span class="hljs-title function_">closest</span>(<span class="hljs-string">&quot;button&quot;</span>)) <span class="hljs-keyword">return</span>;
    <span class="hljs-keyword">if</span> (ev.<span class="hljs-property">type</span> === <span class="hljs-string">&quot;click&quot;</span>) <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">incr</span>();
  }

  <span class="hljs-title function_">connectedCallback</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;click&quot;</span>, <span class="hljs-variable language_">this</span>);
    <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">render</span>();
  }

  <span class="hljs-title function_">disconnectedCallback</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">removeEventListener</span>(<span class="hljs-string">&quot;click&quot;</span>, <span class="hljs-variable language_">this</span>);
  }

  <span class="hljs-title function_">reset</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">this</span>.#count = <span class="hljs-number">0</span>;
    <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">render</span>()
  }
</code></pre>
<pre><code class="language-js"><span class="hljs-title function_">incr</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">this</span>.#count++;
    <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">render</span>();
    <span class="hljs-keyword">const</span> event = <span class="hljs-keyword">new</span> <span class="hljs-title class_">CustomEvent</span>(<span class="hljs-string">&quot;count-changed&quot;</span>, {
      <span class="hljs-attr">detail</span>: <span class="hljs-variable language_">this</span>.#count
    });
    <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">dispatchEvent</span>(event);
  }

  <span class="hljs-title function_">render</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">this</span>.<span class="hljs-property">innerHTML</span> = <span class="hljs-comment">/* html */</span><span class="hljs-string">`&lt;button&gt;
      Clicks: <span class="hljs-subst">${<span class="hljs-variable language_">this</span>.#count}</span>
    &lt;/button&gt;`</span>;
  }
}

customElements.<span class="hljs-title function_">define</span>(<span class="hljs-string">&quot;click-counter&quot;</span>, <span class="hljs-title class_">ClickCounter</span>);
</code></pre>
<ul>
<li>Repositorio de ejemplo: <a href="https://github.com/MultimediosSG/click-counter">click-counter</a></li>
