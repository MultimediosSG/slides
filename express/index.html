<li>Instalar <a href="https://httpie.io/">httpie</a> → sudo apt install httpie → Mejor aún: <a href="https://github.com/ducaale/xh">xh</a> (soporte HTTP2)</li>
</ul>
<split-slide style="--left: 40%; --right: 60%; --font-size: 1rem;">
<steps>
<step>
<pre><code class="language-bash">$ http HEAD https://avotz.com/

HTTP/1.1 200 OK
Connection: keep-alive
Content-Encoding: gzip
Content-Type: text/html; charset=utf-8
Date: Mon, 27 Apr 2026 10:26:56 GMT
ETag: W/<span class="hljs-string">&quot;69ef2a37-80b7&quot;</span>
Last-Modified: Mon, 27 Apr 2026 09:19:51 GMT
Server: nginx/1.22.1
X-Content-Type-Options: nosniff, nosniff
X-Frame-Options: DENY, SAMEORIGIN
X-Powered-By: PHP 9.0.1
X-XSS-Protection: 1; mode=block, 1; mode=block
</code></pre>
</step>
<step>
<pre><code class="language-bash">$ xh HEAD https://avotz.com/

HTTP/2.0 200 OK
content-encoding: gzip
content-type: text/html; charset=utf-8
<span class="hljs-built_in">date</span>: Mon, 27 Apr 2026 11:10:28 GMT
etag: W/<span class="hljs-string">&quot;69ef2a37-80b7&quot;</span>
last-modified: Mon, 27 Apr 2026 09:19:51 GMT
server: nginx/1.22.1
x-content-type-options: nosniff
x-frame-options: DENY
x-frame-options: SAMEORIGIN
x-powered-by: PHP 9.0.1
x-xss-protection: 1; mode=block
</code></pre>
</step>
</steps>
<div>
<ul>
<li>Con <code>http https://avotz.com/</code> haces una petición a una URL
<ul>
<li>...que es equivalente a <code>http GET https://avotz.com/</code></li>
<li>Esto te devuelve las cabeceras (head) y el cuerpo (body)</li>
<li>No confundir con el <code>&lt;head&gt;</code> y <code>&lt;body&gt;</code> del HTML</li>
</ul>
</li>
<li>Con <code>http HEAD https://avotz.com/</code> defines el método a usar
<ul>
<li>Permite usar otros métodos como HEAD, POST, etc...</li>
</ul>
</li>
<li>Con <code>http --follow --all HEAD https://discord.avotz.com/</code>
<ul>
<li>...puedes seguir redirecciones HTTP</li>
</ul>
</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="24">
<h2 id="c%C3%B3digos-http-de-error">Códigos HTTP de error</h2>
<ul>
<li><code>200</code> → <strong>OK</strong> (todo ha ido bien)</li>
<li><code>404</code> → <strong>Not Found</strong> (recurso o página no encontrada)</li>
<li><code>301</code> → <strong>Redireccion permanente</strong> (muy usada para SEO)</li>
<li><code>302</code> → <strong>Redirección temporal</strong> (provisional o temporal)</li>
<li><code>403</code> → <strong>Acceso prohibido</strong> (no puedes entrar aquí)</li>
<li><code>500</code> → <strong>Error del servidor</strong> (algo está mal en el servidor)</li>
<li><code>4xx</code> → <strong>Error en el cliente</strong> (problema a nivel de navegador)</li>
<li><code>5xx</code> → <strong>Error en el servidor</strong> (problema a nivel de máquina)</li>
<li><a href="https://http.cat/">Otros códigos de error con gatos</a></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="24">
<h2 id="cabeceras-http">Cabeceras HTTP</h2>
<steps>
<step>
<ul>
<li>Cabeceras que puede enviar el cliente (navegador)</li>
</ul>
<table>
<thead>
<tr>
<th>Cabecera</th>
<th>Descripción</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Accept</code></td>
<td>Tipos (MIME) que acepta el cliente. Comodines: <code>*/*</code> o <code>image/*</code></td>
</tr>
<tr>
<td><code>Accept-Encoding</code></td>
<td>Codificaciones/compresión aceptada por cliente</td>
</tr>
<tr>
<td><code>Accept-Language</code></td>
<td>Idioma preferido que acepta el navegador</td>
</tr>
<tr>
<td><code>Accept-Ranges</code></td>
<td>El servidor permite descargar partes (streaming, resumir descargas...)</td>
</tr>
<tr>
<td><code>Authorization</code></td>
<td>Credenciales del cliente. <code>Bearer</code>, <code>Basic</code>, <code>Digest</code>, <code>ApiKey</code>.</td>
</tr>
<tr>
<td><code>Host</code></td>
<td>Host al que quieres acceder. Obligatorio en HTTP1.</td>
</tr>
<tr>
<td><code>Referer</code></td>
<td>URL exacta desde donde procedes. Cuidado, no confiar.</td>
</tr>
<tr>
<td><code>User-Agent</code></td>
<td>Identificación del cliente o navegador. Cuidado, no confiar.</td>
</tr>
</tbody>
</table>
</step>
<step>
<ul>
<li>Cabeceras que envía el servidor, relacionadas con el <strong>contenido</strong></li>
</ul>
<table>
<thead>
<tr>
<th>Cabecera</th>
<th>Descripción</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>HTTP/1.1 200 OK</code></td>
<td>Protocolo usado y el código HTTP de error.</td>
</tr>
<tr>
<td><code>Connection</code> <img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/31-20e3.svg" data-marp-twemoji="" /></td>
<td>Gestión de la conexión <code>keep-alive</code> (la deja abierta) o <code>close</code> (la cierra).</td>
</tr>
<tr>
<td><code>Content-type</code></td>
<td>Define el tipo (MIME) de contenido (html, json...) y la codificación.</td>
</tr>
<tr>
<td><code>Content-encoding</code></td>
<td>Define la codificación/compresión. <code>identity</code> &lt; <code>deflate</code> &lt; <code>gzip</code> &lt; <code>br</code> (brotli) ~ <code>zstd</code></td>
</tr>
<tr>
<td><code>Content-length</code></td>
<td>Define el tamaño del body. Es el "opuesto" a <code>transfer-encoding: chunked</code>.</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji="" /> <code>Transfer-encoding</code> <img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/31-20e3.svg" data-marp-twemoji="" /></td>
<td>Valor <code>chunked</code>. Envío por bloques. No necesita saber el tamaño <code>content-length</code>.</td>
</tr>
<tr>
<td><code>Location</code></td>
<td>Redirección en códigos HTTP 3xx.</td>
</tr>
<tr>
<td><code>Allow</code></td>
<td>Métodos permitidos para el recurso, separados por coma <code>GET, POST</code>.</td>
</tr>
</tbody>
</table>
</step>
<step>
<ul>
<li>Cabeceras que envía el servidor, relacionadas con <strong>caché</strong></li>
</ul>
<table>
<thead>
<tr>
<th>Cabecera</th>
<th>Descripción</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Date</code></td>
<td>Fecha/hora del servidor.</td>
</tr>
<tr>
<td><code>ETag</code></td>
<td>Identificador del recurso. Usado para tareas de caché.</td>
</tr>
<tr>
<td><code>Last-Modified</code></td>
<td>Fecha de última modificación del recurso. Usado para tareas de caché.</td>
</tr>
<tr>
<td><code>Cache-Control</code></td>
<td>Directivas de caché. <code>no-cache</code>, <code>no-store</code>, <code>public</code>, <code>private</code>, <code>max-age=...</code>, <code>must-revalidate</code></td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji="" /> <code>Expires</code></td>
<td>Fecha en la que expira la caché. Obsoleta.</td>
</tr>
</tbody>
</table>
</step>
<step>
<ul>
<li>Cabeceras que envía el servidor, relacionadas con <strong>seguridad</strong></li>
</ul>
<table>
<thead>
<tr>
<th>Cabecera</th>
<th>Descripción</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Server</code></td>
<td>Software del servidor. Texto libre, cuidado con dar información.</td>
</tr>
<tr>
<td><code>X-*</code></td>
<td>Cabecera personalizada. Puedes enviar tus propias cabeceras.</td>
</tr>
<tr>
<td><code>X-Powered-By</code></td>
<td>Tecnología del backend. Texto libre, cuidado con dar información.</td>
</tr>
<tr>
<td><code>X-Content-Type-Options</code></td>
<td>Seguridad. <code>nosniff</code> evita MIME sniffing.</td>
</tr>
<tr>
<td><code>X-Frame-Options</code></td>
<td>Seguridad. <code>DENY</code> controla iframes. Otro valor: <code>SAMEORIGIN</code></td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji="" /> <code>X-XSS-Protection</code></td>
<td>Filtro XSS legacy. Obsoleto.</td>
</tr>
</tbody>
</table>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="24">
<h2 id="petici%C3%B3n-completa">Petición completa</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-bash">$ xh GET https://avotz.com/

HTTP/2.0 200 OK
content-length: 32949
content-type: text/html; charset=utf-8
...

&lt;!DOCTYPE html&gt;&lt;html lang=<span class="hljs-string">&quot;es&quot;</span> data-astro-cid-lg3izgkh&gt; &lt;<span class="hljs-built_in">head</span>&gt;&lt;meta charset=<span class="hljs-string">&quot;UTF-8&quot;</span>&gt;&lt;meta name=<span class="hljs-string">&quot;viewport&quot;</span> content=<span class="hljs-string">&quot;width=device-width, initial-scale=1.0&quot;</span>&gt;&lt;<span class="hljs-built_in">link</span> rel=<span class="hljs-string">&quot;preload&quot;</span> href=<span class="hljs-string">&quot;/assets/fonts/montserrat-vf.woff2&quot;</span> as=<span class="hljs-string">&quot;font&quot;</span> crossorigin=<span class="hljs-string">&quot;anonymous&quot;</span>&gt; ...
</code></pre>
<div>
<ul>
<li>Una petición <code>HEAD</code> sólo muestra cabeceras</li>
<li>Una petición GET envía cabeceras + body</li>
<li>El body es el cuerpo de la página (HTML, JSON, etc...)</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-marpit-scope-F9AmBSJU="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="7" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="24">
<h1 id="nodejs--express">NodeJS + Express</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="24">
<h2 id="rutas-simples-con-express">Rutas simples con Express</h2>
<steps>
<step>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-keyword">import</span> express <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;express&quot;</span>;
<span class="hljs-keyword">const</span> app = <span class="hljs-title function_">express</span>();

app.<span class="hljs-title function_">enable</span>(<span class="hljs-string">&quot;strict routing&quot;</span>);

<span class="hljs-keyword">const</span> <span class="hljs-variable constant_">HOST</span> = <span class="hljs-string">&quot;localhost&quot;</span>;
<span class="hljs-keyword">const</span> <span class="hljs-variable constant_">PORT</span> = <span class="hljs-number">4321</span>;

app.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/&quot;</span>, <span class="hljs-function">(<span class="hljs-params">req, res</span>) =&gt;</span> res.<span class="hljs-title function_">send</span>(<span class="hljs-string">&quot;HOME&quot;</span>));
app.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/about&quot;</span>, <span class="hljs-function">(<span class="hljs-params">req, res</span>) =&gt;</span> res.<span class="hljs-title function_">send</span>(<span class="hljs-string">&quot;ABOUT&quot;</span>));

app.<span class="hljs-title function_">listen</span>(<span class="hljs-variable constant_">PORT</span>, <span class="hljs-variable constant_">HOST</span>, <span class="hljs-function">() =&gt;</span> {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Server at http://<span class="hljs-subst">${HOST}</span>:<span class="hljs-subst">${PORT}</span>/`</span>)
});
</code></pre>
<div>
<ul>
<li>
<p>Con <code>pnpx nodemon index.js</code> ejecutamos el script</p>
</li>
<li>
<p>Cuando guardemos, se recargan los cambios</p>
</li>
<li>
<p><code>node --watch index.js</code> (no compatible con WSL2)</p>
</li>
<li>
<p>Normaliza las rutas <code>/about</code> != <code>/about/</code> → SEO</p>
</li>
<li>
<p>Las variables <code>HOST</code> y <code>PORT</code> se externalizarán en <code>.env</code></p>
</li>
<li>
<p>Con <code>app.listen()</code> escuchamos peticiones en IP y puerto</p>
</li>
<li>
<p>Con <code>app.get()</code>  ejecutamos funciones al recibir rutas</p>
</li>
<li>
<p>Si accedes a <code>http://localhost:4321/</code> vas a HOME</p>
</li>
<li>
<p>Si accedes a <code>http://localhost:4321/about</code> vas a ABOUT</p>
</li>
<li>
<p>Otra ruta de acceso da un error 404</p>
</li>
</ul>
</div>
</split-slide>
</step>
<step>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js">app.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/page/&quot;</span>, <span class="hljs-function">(<span class="hljs-params">req, res</span>) =&gt;</span> {
  res.<span class="hljs-title function_">header</span>(<span class="hljs-string">&quot;Content-type&quot;</span>, <span class="hljs-string">&quot;text/html&quot;</span>);
  <span class="hljs-keyword">const</span> html = <span class="hljs-comment">/* html */</span><span class="hljs-string">`
    &lt;style&gt;
      body {
        background: #222;
        color: #fff;
      }
    &lt;/style&gt;
    &lt;h1&gt;Página principal&lt;/h1&gt;
    &lt;p&gt;Esta es la página
      principal de mi sitio web.&lt;/p&gt;
  `</span>;
  res.<span class="hljs-title function_">send</span>(html);
});
</code></pre>
<pre><code class="language-js"><span class="hljs-keyword">import</span> { cwd } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;node:process&quot;</span>;

<span class="hljs-keyword">const</span> <span class="hljs-variable constant_">PATH</span> = <span class="hljs-title function_">cwd</span>();

app.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/robots&quot;</span>, <span class="hljs-function">(<span class="hljs-params">req, res</span>) =&gt;</span>
  res.<span class="hljs-title function_">sendFile</span>(<span class="hljs-string">`<span class="hljs-subst">${PATH}</span>/robots.txt`</span>));

app.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/youtube&quot;</span>, <span class="hljs-function">(<span class="hljs-params">req, res</span>) =&gt;</span>
  res.<span class="hljs-title function_">redirect</span>(<span class="hljs-string">&quot;https://youtube.com/@manzdev&quot;</span>));

app.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/forbidden/&quot;</span>, <span class="hljs-function">(<span class="hljs-params">req, res</span>) =&gt;</span> {
  <span class="hljs-keyword">const</span> data = { <span class="hljs-attr">error</span>: <span class="hljs-string">&quot;403&quot;</span> };
  res.<span class="hljs-title function_">status</span>(<span class="hljs-number">403</span>).<span class="hljs-title function_">json</span>(data);
});
</code></pre>
</split-slide>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="24">
<h2 id="rutas-din%C3%A1micas">Rutas dinámicas</h2>
<ul>
<li>Las rutas dinámicas son formas de crear múltiples rutas con una sola</li>
</ul>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-js">app.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/users&quot;</span>, <span class="hljs-function">(<span class="hljs-params">req, res</span>) =&gt;</span>
  res.<span class="hljs-title function_">send</span>(<span class="hljs-string">&quot;Lista de usuarios&quot;</span>));

app.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/user/:name&quot;</span>, <span class="hljs-function">(<span class="hljs-params">req, res</span>) =&gt;</span> {
  <span class="hljs-keyword">const</span> name = req.<span class="hljs-property">params</span>.<span class="hljs-property">name</span>; <span class="hljs-comment">// ⚠ Cuidado</span>
  res.<span class="hljs-title function_">send</span>(<span class="hljs-string">`Usuario: <span class="hljs-subst">${name}</span>`</span>);
});

app.<span class="hljs-title function_">listen</span>(<span class="hljs-variable constant_">PORT</span>, <span class="hljs-variable constant_">HOST</span>, <span class="hljs-function">() =&gt;</span> {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Server at http://<span class="hljs-subst">${HOST}</span>:<span class="hljs-subst">${PORT}</span>/`</span>)
});
</code></pre>
<div>
<ul>
<li>
<p>La ruta <code>/users</code> debería mostrar los usuarios existentes</p>
</li>
<li>
<p>La ruta <code>/user/:name</code> es dinámica:</p>
<ul>
<li><code>/user/alons</code> da los datos de <code>alons</code></li>
<li><code>/user/manzdev</code> da los datos de <code>manzdev</code></li>
</ul>
</li>
<li>
<p>En <code>req.params.name</code> tenemos los datos del <code>:name</code></p>
<ul>
<li><code>:name</code> proviene del usuario</li>
<li>¡<strong>NUNCA</strong> confíes en los datos del usuario!</li>
</ul>
</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-scope-mwR6rAdw="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="10" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="24">
<h1 id="api-de-videojuegos-aventuras-gr%C3%A1ficas-cl%C3%A1sicas">API de videojuegos (aventuras gráficas clásicas)</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="24">
<h2 id="empecemos-por-una-api-sencilla">Empecemos por una API sencilla</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js">[
  {
    <span class="hljs-string">&quot;name&quot;</span>: <span class="hljs-string">&quot;The Secret of Monkey Island&quot;</span>,
    <span class="hljs-string">&quot;author&quot;</span>: <span class="hljs-string">&quot;Lucasfilm Games&quot;</span>,
    <span class="hljs-string">&quot;genre&quot;</span>: <span class="hljs-string">&quot;comedia&quot;</span>,
    <span class="hljs-string">&quot;characters&quot;</span>: [<span class="hljs-string">&quot;Guybrush Threepwood&quot;</span>],
    <span class="hljs-string">&quot;enemies&quot;</span>: [<span class="hljs-string">&quot;LeChuck&quot;</span>],
    <span class="hljs-string">&quot;year&quot;</span>: <span class="hljs-number">1990</span>,
    <span class="hljs-string">&quot;image&quot;</span>: <span class="hljs-string">&quot;monkey-island.avif&quot;</span>,
    <span class="hljs-string">&quot;slug&quot;</span>: <span class="hljs-string">&quot;monkey-island&quot;</span>,
    <span class="hljs-string">&quot;summary&quot;</span>: <span class="hljs-string">&quot;Un aspirante a pirata quiere ser leyenda.&quot;</span>,
    <span class="hljs-string">&quot;description&quot;</span>: <span class="hljs-string">&quot;Guybrush Threepwood intenta convertirse en un temido pirata enfrentándose al fantasma LeChuck usando ingenio, insultos y humor.&quot;</span>
  },
  ...
]
</code></pre>
<div>
<ul>
<li>
<p>Lo primero, los datos</p>
<ul>
<li>De momento, un fichero <code>.json</code></li>
<li>Y sus imágenes respectivas en <code>covers/</code></li>
</ul>
</li>
<li>
<p>Pueden existir múltiples protagonistas y enemigos</p>
</li>
<li>
<p>La <code>image</code> y <code>slug</code> podría fusionarse en un dato</p>
</li>
<li>
<p>Tenemos un <code>summary</code> (descripción corta)</p>
</li>
<li>
<p>Tenemos un <code>description</code> (descripción larga)</p>
</li>
<li>
<p>Nuestro <code>.json</code> tendrá varios objetos así</p>
</li>
<li>
<p>Esa será <strong>de momento</strong> nuestra base de información</p>
</li>
<li>
<p>Fichero con los datos: <a href="../assets/api/data.json">data.json</a></p>
</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="24">
<h2 id="ruta-principal-y-de-los-juegos">Ruta principal y de los juegos</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-keyword">import</span> express <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;express&quot;</span>;
<span class="hljs-keyword">import</span> data <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./data.json&quot;</span> <span class="hljs-keyword">with</span> { <span class="hljs-attr">type</span>: <span class="hljs-string">&quot;json&quot;</span> };

<span class="hljs-keyword">const</span> app = <span class="hljs-title function_">express</span>();

<span class="hljs-keyword">const</span> <span class="hljs-variable constant_">HOST</span> = <span class="hljs-string">&quot;localhost&quot;</span>;
<span class="hljs-keyword">const</span> <span class="hljs-variable constant_">PORT</span> = <span class="hljs-number">4321</span>;

app.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/&quot;</span>, <span class="hljs-function">(<span class="hljs-params">req, res</span>) =&gt;</span> res.<span class="hljs-title function_">send</span>(<span class="hljs-string">&quot;Alo API 1.0&quot;</span>));

app.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/games&quot;</span>, <span class="hljs-function">(<span class="hljs-params">req, res</span>) =&gt;</span> {
  res.<span class="hljs-title function_">header</span>(<span class="hljs-string">&quot;Content-type&quot;</span>, <span class="hljs-string">&quot;application/json&quot;</span>);
  res.<span class="hljs-title function_">send</span>(data.<span class="hljs-title function_">map</span>(<span class="hljs-function"><span class="hljs-params">item</span> =&gt;</span> item.<span class="hljs-property">slug</span>));
});
</code></pre>
<div>
<ul>
<li>
<p>Importamos el <code>.json</code> usando import attributes</p>
</li>
<li>
<p>Recuerda que <code>HOST</code> y <code>PORT</code> deberían externalizarse</p>
</li>
<li>
<p>La ruta <code>/</code> devuelve información sobre la API</p>
</li>
<li>
<p>La ruta <code>/games</code> devuelve una lista de <code>id</code> de los juegos</p>
<ul>
<li>Con un <code>map</code> nos quedamos sólo con los <code>slugs</code></li>
</ul>
</li>
<li>
<p>El <code>header()</code> con el <code>Content-type</code> es didáctico</p>
<ul>
<li>Por ejemplo, usar <code>json()</code> ya lo hace por nosotros</li>
</ul>
</li>
<li>
<p>Evitar enviar demasiada información (sólo slugs)</p>
<ul>
<li><code>[&quot;monkey-island&quot;, &quot;loom&quot;, &quot;toonstruck&quot;]</code></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="24">
<h2 id="ruta-de-juego-espec%C3%ADfico">Ruta de juego específico</h2>
<split-slide style="--font-size: .9rem;">
<pre><code class="language-js"><span class="hljs-keyword">const</span> <span class="hljs-title function_">notFound</span> = (<span class="hljs-params">res, message</span>) =&gt; {
  <span class="hljs-keyword">return</span> res.<span class="hljs-title function_">status</span>(<span class="hljs-number">404</span>).<span class="hljs-title function_">json</span>({ <span class="hljs-attr">error</span>: message });
}

app.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/game/:slug&quot;</span>, <span class="hljs-function">(<span class="hljs-params">req, res</span>) =&gt;</span> {
  <span class="hljs-keyword">const</span> game = data
    .<span class="hljs-title function_">find</span>(<span class="hljs-function"><span class="hljs-params">item</span> =&gt;</span> item.<span class="hljs-property">slug</span> === req.<span class="hljs-property">params</span>.<span class="hljs-property">slug</span>);

  <span class="hljs-keyword">if</span> (!game)
    <span class="hljs-keyword">return</span> <span class="hljs-title function_">notFound</span>(res, <span class="hljs-string">&quot;Game not found&quot;</span>);

  res.<span class="hljs-title function_">json</span>(game);
});
</code></pre>
<div>
<ul>
<li>
<p>La ruta <code>/game/:slug</code> se espera el <code>slug</code> de un juego</p>
</li>
<li>
<p>Buscamos con <code>find</code> si hay juego que coincida con <code>slug</code></p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Si no hay, devolvemos un <code>notFound</code></p>
<ul>
<li>Función que da un <code>404</code> y devuelve ¡JSON! de error</li>
<li>Somos una API, errores también devuelven <code>.json</code></li>
</ul>
</li>
<li>
<p><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Si existe, devolvemos los datos del juego (<code>game</code>)</p>
<ul>
<li>En este caso si devolvemos datos extensos (es la idea)</li>
</ul>
</li>
<li>
<p>Recuerda: Si se entra en una ruta, debería procesarse</p>
</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="24">
<h2 id="ruta-de-juegos-por-a%C3%B1o-y-aleatorio">Ruta de juegos por año y aleatorio</h2>
<split-slide style="--left: 55%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js">app.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/year/:year&quot;</span>, <span class="hljs-function">(<span class="hljs-params">req, res</span>) =&gt;</span> {
  <span class="hljs-keyword">const</span> games = data
    .<span class="hljs-title function_">filter</span>(<span class="hljs-function"><span class="hljs-params">item</span> =&gt;</span> item.<span class="hljs-property">year</span> == req.<span class="hljs-property">params</span>.<span class="hljs-property">year</span>)
    .<span class="hljs-title function_">map</span>(<span class="hljs-function"><span class="hljs-params">item</span> =&gt;</span> item.<span class="hljs-property">slug</span>);

  res.<span class="hljs-title function_">json</span>(games);
});

app.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/random&quot;</span>, <span class="hljs-function">(<span class="hljs-params">req, res</span>) =&gt;</span> {
  <span class="hljs-keyword">const</span> i = <span class="hljs-title class_">Math</span>.<span class="hljs-title function_">floor</span>(<span class="hljs-title class_">Math</span>.<span class="hljs-title function_">random</span>() * data.<span class="hljs-property">length</span>);
  res.<span class="hljs-title function_">json</span>(data[i]);
});
</code></pre>
<div>
<ul>
<li>En las rutas por año...
<ul>
<li>Filtramos por el año en cuestión <code>req.params.year</code></li>
<li>Nos quedamos sólo con el <code>slug</code></li>
</ul>
</li>
<li>Si no existe ningún juego por año indicado:
<ul>
<li>Devolvemos un array vacío <code>[]</code></li>
<li>El año si existe, la ruta es correcta</li>
<li>...sólo que no tiene juegos</li>
</ul>
</li>
<li>En la ruta <code>random</code>:
<ul>
<li>Obtenemos número al azar entre <code>0</code> y el número de juegos</li>
<li>Devolvemos la información</li>
</ul>
</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="24">
<h2 id="par%C3%A1metros-est%C3%A1ticos-y-catch-all">Parámetros, estáticos y catch-all</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js">app.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/games&quot;</span>, <span class="hljs-function">(<span class="hljs-params">req, res</span>) =&gt;</span> {
  <span class="hljs-keyword">const</span> isFull = req.<span class="hljs-property">query</span>.<span class="hljs-property">include</span> === <span class="hljs-string">&quot;full&quot;</span>;
  <span class="hljs-keyword">const</span> contents = isFull
    ? data
    : data.<span class="hljs-title function_">map</span>(<span class="hljs-function"><span class="hljs-params">item</span> =&gt;</span> item.<span class="hljs-property">slug</span>);

  res.<span class="hljs-title function_">json</span>(contents);
});

app.<span class="hljs-title function_">use</span>(express.<span class="hljs-title function_">static</span>(<span class="hljs-string">&quot;public&quot;</span>));

app.<span class="hljs-title function_">use</span>(<span class="hljs-function">(<span class="hljs-params">req, res</span>) =&gt;</span> {
  res.<span class="hljs-title function_">status</span>(<span class="hljs-number">404</span>).<span class="hljs-title function_">json</span>({ <span class="hljs-attr">error</span>: <span class="hljs-string">&quot;Path not found&quot;</span> });
});
</code></pre>
<div>
<ul>
<li>
<p>Si el usuario añade <code>?include=full</code> a /games...</p>
<ul>
<li>Devolvemos la información detallada</li>
<li>Puede ser útil para no hacer muchas peticiones</li>
<li>Valorar si el contenido es demasiado extenso</li>
</ul>
</li>
<li>
<p>Con <code>app.use</code> usamos un middleware</p>
<ul>
<li><code>express.static()</code> permite devolver ficheros estáticos</li>
<li>Ej: Responde a <code>/covers/monkey-island.avif</code></li>
<li>Cuidado: No incluyas más que ficheros estáticos</li>
</ul>
</li>
<li>
<p><strong>Catch-all</strong>: Si no entras en ninguna otra ruta, entra aquí</p>
<ul>
<li>Devolvemos un <code>404</code> con ruta no encontrada</li>
</ul>
</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="24">
<h2 id="buscador">Buscador</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js">app.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/search/:text&quot;</span>, <span class="hljs-function">(<span class="hljs-params">req, res</span>) =&gt;</span> {
  <span class="hljs-keyword">const</span> query = req.<span class="hljs-property">params</span>.<span class="hljs-property">text</span>.<span class="hljs-title function_">toLowerCase</span>();

  <span class="hljs-keyword">const</span> results = data
    .<span class="hljs-title function_">filter</span>(<span class="hljs-function"><span class="hljs-params">game</span> =&gt;</span> {
      <span class="hljs-keyword">const</span> json = <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">stringify</span>(game).<span class="hljs-title function_">toLowerCase</span>();
      <span class="hljs-keyword">return</span> json.<span class="hljs-title function_">includes</span>(query);
    })
    .<span class="hljs-title function_">map</span>(<span class="hljs-function"><span class="hljs-params">game</span> =&gt;</span> game.<span class="hljs-property">slug</span>);

  res.<span class="hljs-title function_">json</span>(results);
});
</code></pre>
<div>
<ul>
<li>
<p>En la ruta <code>/search/</code> podemos realizar una búsqueda</p>
</li>
<li>
<p>Pasamos los datos a minúsculas</p>
</li>
<li>
<p>Filtramos por juego, pasamos a texto toda su info</p>
</li>
<li>
<p>Comprobamos si existe el texto buscado</p>
</li>
<li>
<p>De los encontrados, devolvemos su <code>slug</code></p>
</li>
<li>
<p>Convendría poner un tamaño mínimo → <code>/search/a</code></p>
</li>
<li>
<p>Convendría asegurar y validar la entrada de datos</p>
</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-scope-NdTRyPmF="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="17" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="24">
<h1 id="separar-y-organizar-l%C3%B3gica">Separar y organizar lógica</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="24">
<h2 id="controladores-y-m%C3%B3dulos">Controladores y módulos</h2>
<ul>
<li>Obtenemos información sensible al entorno en el .env</li>
</ul>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<steps>
<step>
<pre><code class="language-js"><span class="hljs-keyword">import</span> express <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;express&quot;</span>;

<span class="hljs-keyword">import</span> { search } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./routes/games/search.js&quot;</span>;
<span class="hljs-keyword">import</span> { random } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./routes/games/random.js&quot;</span>;
<span class="hljs-keyword">import</span> { getBySlug } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./routes/games/getBySlug.js&quot;</span>;
<span class="hljs-keyword">import</span> { getByYear } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./routes/games/getByYear.js&quot;</span>;
<span class="hljs-keyword">import</span> { getAll } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./routes/games/getAll.js&quot;</span>;

<span class="hljs-keyword">const</span> app = <span class="hljs-title function_">express</span>();

app.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/&quot;</span>, <span class="hljs-function">(<span class="hljs-params">req, res</span>) =&gt;</span> res.<span class="hljs-title function_">send</span>(<span class="hljs-string">&quot;Alo API 1.0&quot;</span>));
app.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/games&quot;</span>, getAll);
app.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/game/:slug&quot;</span>, getBySlug);
app.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/year/:year&quot;</span>, getByYear);
app.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/search/:text&quot;</span>, search);
app.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/random&quot;</span>, random);
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">import</span> data <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;../../data.json&quot;</span> <span class="hljs-keyword">with</span> { <span class="hljs-attr">type</span>: <span class="hljs-string">&quot;json&quot;</span> };

<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> <span class="hljs-title function_">search</span> = (<span class="hljs-params">req, res</span>) =&gt; {
  <span class="hljs-keyword">const</span> query = req.<span class="hljs-property">params</span>.<span class="hljs-property">text</span>.<span class="hljs-title function_">toLowerCase</span>();

  <span class="hljs-keyword">const</span> results = data
    .<span class="hljs-title function_">filter</span>(<span class="hljs-function"><span class="hljs-params">game</span> =&gt;</span> {
      <span class="hljs-keyword">const</span> json = <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">stringify</span>(game).<span class="hljs-title function_">toLowerCase</span>();
      <span class="hljs-keyword">return</span> json.<span class="hljs-title function_">includes</span>(query);
    })
    .<span class="hljs-title function_">map</span>(<span class="hljs-function"><span class="hljs-params">game</span> =&gt;</span> game.<span class="hljs-property">slug</span>);

  res.<span class="hljs-title function_">json</span>(results);
}
</code></pre>
</step>
</steps>
<div>
<ul>
<li>
<p>Vamos a separar las funciones en controladores</p>
</li>
<li>
<p>La carpeta <code>/routes/games/</code> contendrá los controladores</p>
<ul>
<li><code>search.js</code> contendrá la lógica de búsqueda</li>
<li><code>random.js</code> contendrá la lógica de juego al azar</li>
<li>etc...</li>
</ul>
</li>
<li>
<p>La función <code>search</code> está exportada en el <code>search.js</code></p>
</li>
<li>
<p>De momento, se trae los datos de ../../data.json</p>
</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="24">
<h2 id="validaciones-con-zod">Validaciones con zod</h2>
<ul>
<li>Instalamos <a href="https://zod.dev/">zod</a> con <code>pnpm add zod</code> → <a href="https://zod.dev/api">API de zod</a></li>
</ul>
<split-slide style="--left: 60%; --right: 40%; --font-size: 1rem;">
<steps>
<step>
<pre><code class="language-js"><span class="hljs-keyword">import</span> { z } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;zod&quot;</span>;

<span class="hljs-keyword">const</span> schema = z.<span class="hljs-title function_">object</span>({
  <span class="hljs-attr">text</span>: z.<span class="hljs-title function_">string</span>()
    .<span class="hljs-title function_">trim</span>()
    .<span class="hljs-title function_">nonempty</span>(<span class="hljs-string">&quot;Búsqueda no puede estar vacía&quot;</span>)
    .<span class="hljs-title function_">min</span>(<span class="hljs-number">3</span>, <span class="hljs-string">&quot;Debe tener al menos 3 carácteres&quot;</span>)
    .<span class="hljs-title function_">max</span>(<span class="hljs-number">50</span>, <span class="hljs-string">&quot;No puede tener más de 50 carácteres&quot;</span>)
    .<span class="hljs-title function_">transform</span>(<span class="hljs-function"><span class="hljs-params">value</span> =&gt;</span> value.<span class="hljs-title function_">toLowerCase</span>())
});

<span class="hljs-keyword">export</span> <span class="hljs-keyword">default</span> schema;
</code></pre>
</step>
<step>
<pre><code class="language-js">z.<span class="hljs-title function_">string</span>();                    z.<span class="hljs-title function_">number</span>()
    .<span class="hljs-title function_">length</span>(<span class="hljs-number">5</span>)                     .<span class="hljs-title function_">gt</span>(<span class="hljs-number">5</span>)
    .<span class="hljs-title function_">regex</span>(<span class="hljs-regexp">/A.+/</span>)                  .<span class="hljs-title function_">lt</span>(<span class="hljs-number">5</span>)
    .<span class="hljs-title function_">uppercase</span>()                   .<span class="hljs-title function_">positive</span>()
    .<span class="hljs-title function_">lowercase</span>()                   .<span class="hljs-title function_">multipleOf</span>(<span class="hljs-number">5</span>)
    .<span class="hljs-title function_">includes</span>()
    .<span class="hljs-title function_">email</span>()                     z.<span class="hljs-title function_">set</span>()
    .<span class="hljs-title function_">url</span>()                         .<span class="hljs-title function_">min</span>(<span class="hljs-number">5</span>)
    .<span class="hljs-title function_">emoji</span>()                       .<span class="hljs-title function_">max</span>(<span class="hljs-number">5</span>)
    .<span class="hljs-title function_">ipv4</span>()                        .<span class="hljs-title function_">size</span>(<span class="hljs-number">5</span>)
    .<span class="hljs-title function_">hash</span>(<span class="hljs-string">&quot;sha256&quot;</span>)
    .<span class="hljs-property">iso</span>.<span class="hljs-title function_">datetime</span>()              z.<span class="hljs-title function_">array</span>()
    .<span class="hljs-property">iso</span>.<span class="hljs-title function_">duration</span>()              z.<span class="hljs-title function_">date</span>()
  <span class="hljs-comment">/* ... */</span>
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">import</span> schema <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./search.schema.js&quot;</span>;

<span class="hljs-keyword">const</span> <span class="hljs-variable constant_">DEFAULT</span> = <span class="hljs-string">&quot;Búsqueda inválida&quot;</span>;

<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> <span class="hljs-title function_">search</span> = (<span class="hljs-params">req, res</span>) =&gt; {

<ul>
<li>Se estarán preguntando <strong>¿Y por qué no Fastify?</strong>... (u otra) → <a href="https://fastify.dev/">Fastify</a></li>

<split-slide style="--font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-keyword">import</span> <span class="hljs-title class_">Fastify</span> <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;fastify&quot;</span>;
<span class="hljs-keyword">import</span> fastifyStatic <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@fastify/static&quot;</span>;
<span class="hljs-keyword">const</span> app = <span class="hljs-title class_">Fastify</span>({ <span class="hljs-attr">logger</span>: <span class="hljs-literal">true</span> });

app.<span class="hljs-title function_">register</span>(fastifyStatic, {
  <span class="hljs-attr">root</span>: <span class="hljs-title function_">join</span>(<span class="hljs-title function_">cwd</span>(), <span class="hljs-string">&quot;public&quot;</span>),
  <span class="hljs-attr">prefix</span>: <span class="hljs-string">&quot;/&quot;</span>,
});

app.<span class="hljs-title function_">setNotFoundHandler</span>(<span class="hljs-function">(<span class="hljs-params">req, res</span>) =&gt;</span> {
  res.<span class="hljs-title function_">code</span>(<span class="hljs-number">404</span>).<span class="hljs-title function_">send</span>({ <span class="hljs-attr">error</span>: <span class="hljs-string">&quot;Path not found&quot;</span> });
});

app.<span class="hljs-title function_">listen</span>({ <span class="hljs-attr">port</span>: <span class="hljs-variable constant_">PORT</span> });
</code></pre>
<div>

<li>
<p>Usamos <code>app.register()</code> en lugar del <code>app.use()</code></p>
</li>
<li>
<p>Usamos <code>app.setNotFoundHandler()</code> en lugar del <code>app.use()</code></p>
</li>
<li>
<p>Usamos otra sintaxis en <code>app.listen()</code></p>
</li>
<li>
<p>Usamos <code>.send()</code> en lugar de <code>.json()</code></p>
</li>
<li>
<p>Algunos cambios más y tendremos <strong>Fastify</strong> funcionando</p>

<h2 id="sqlite">SQLite</h2>
<steps>
<step>
<split-slide style="--left: 60%; --right: 40%; --font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">DatabaseSync</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;node:sqlite&quot;</span>;
<span class="hljs-keyword">import</span> data <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./data.json&quot;</span> <span class="hljs-keyword">with</span> { <span class="hljs-attr">type</span>: <span class="hljs-string">&quot;json&quot;</span> };
<span class="hljs-keyword">import</span> { cwd } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;node:process&quot;</span>;
<span class="hljs-keyword">import</span> { readFileSync } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;node:fs&quot;</span>;

<span class="hljs-keyword">const</span> <span class="hljs-variable constant_">DATABASE_FILE</span> = <span class="hljs-string">`<span class="hljs-subst">${cwd()}</span>/data/games.db`</span>;
<span class="hljs-keyword">const</span> <span class="hljs-variable constant_">CREATE_SCRIPT</span> = <span class="hljs-string">`<span class="hljs-subst">${cwd()}</span>/data/CREATE.SQL`</span>;

<span class="hljs-comment">// Establecemos acceso a la base de datos</span>
<span class="hljs-keyword">const</span> db = <span class="hljs-keyword">new</span> <span class="hljs-title class_">DatabaseSync</span>(<span class="hljs-variable constant_">DATABASE_FILE</span>);

<span class="hljs-comment">// Lee script, lo ejecuta y crea tablas en SQLite</span>
<span class="hljs-keyword">const</span> sql = <span class="hljs-title function_">readFileSync</span>(<span class="hljs-variable constant_">CREATE_SCRIPT</span>, <span class="hljs-string">&quot;utf-8&quot;</span>);
db.<span class="hljs-title function_">exec</span>(sql);
</code></pre>
<div>
<ul>
<li>
<p>Node 22+ → soporte nativo de <a href="https://nodejs.org/api/sqlite.html">SQLite</a></p>
</li>
<li>
<p>Instala <a href="https://marketplace.visualstudio.com/items?itemName=alexcvzz.vscode-sqlite">Extensión VSCode SQLite</a></p>
</li>
<li>
<p>Vamos a pasar los datos del <code>.json</code> a SQLite</p>
</li>
<li>
<p>Creamos un script <code>data/createdb.js</code></p>
</li>
<li>
<p>Creamos un <code>data/games.db</code> (BD SQLite)</p>
</li>
<li>
<p>Leemos el fichero <code>data/CREATE.SQL</code> (Script SQL)</p>
</li>
<li>
<p>Ejecutamos la consulta del script SQL</p>
</li>
</ul>
</div>
</split-slide>
</step>
<step>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> games (
  id <span class="hljs-type">INTEGER</span> <span class="hljs-keyword">PRIMARY KEY</span> AUTOINCREMENT,
  name TEXT <span class="hljs-keyword">NOT NULL</span>,
  author TEXT <span class="hljs-keyword">NOT NULL</span>,
  genre TEXT,
  <span class="hljs-keyword">year</span> <span class="hljs-type">INTEGER</span>,
  characters TEXT,      <span class="hljs-comment">/* ⚠ NO RELACIONAL */</span>
  enemies TEXT,         <span class="hljs-comment">/* ⚠ NO RELACIONAL */</span>
  image TEXT,
  slug TEXT <span class="hljs-keyword">UNIQUE</span> <span class="hljs-keyword">NOT NULL</span>,
  summary TEXT,
  description TEXT
);
</code></pre>
<div>
<ul>
<li>
<p>Creamos una tabla SQL llamada <code>games</code></p>
<ul>
<li>Un <code>id</code> con un valor numérico autoincremental</li>
<li>Campos <code>name</code>, <code>author</code>, <code>genre</code> y <code>year</code></li>
<li>⚠ <code>characters</code> y <code>enemies</code> <strong>deberían</strong> ser tablas</li>
<li>Campo <code>image</code> es el nombre de la <code>imagen.ext</code></li>
<li>Campo <code>slug</code> es el valor de la URL</li>
<li>Campo <code>summary</code> y <code>description</code> textos largos</li>
</ul>
</li>
<li>
<p>SQLite tiene campos básicos: <code>TEXT</code>, <code>INTEGER</code>...</p>
</li>
</ul>
</div>
</split-slide>
</step>
<step>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-comment">// Preparar inserción de datos de juegos</span>
<span class="hljs-keyword">const</span> games = db.<span class="hljs-title function_">prepare</span>(<span class="hljs-comment">/* SQL */</span><span class="hljs-string">`INSERT INTO games (name,
  author, genre, year, characters, enemies, image, slug,
  summary, description) VALUES (:name, :author, :genre, :year,
  :characters, :enemies, :image, :slug, :summary, :description)`</span>);

<span class="hljs-keyword">for</span> (<span class="hljs-keyword">const</span> game <span class="hljs-keyword">of</span> data) {
  games.<span class="hljs-title function_">run</span>({
    ...game,
    <span class="hljs-attr">characters</span>: <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">stringify</span>(game.<span class="hljs-property">characters</span>),
    <span class="hljs-attr">enemies</span>: <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">stringify</span>(game.<span class="hljs-property">enemies</span>)
  });
}

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Base de datos creada y poblada con éxito.&quot;</span>);
</code></pre>
<div>
<ul>
<li>
<p>Otra forma es incluir la consulta <code>SQL</code> en línea</p>
</li>
<li>
<p>Utilizamos <code>db.prepare()</code> para preparar la consulta</p>
<ul>
<li>Permite anticiparse a sus parámetros</li>
<li>Evita SQL Injection</li>
<li>Mejor rendimiento</li>
</ul>
</li>
<li>
<p>Recorremos json <code>data</code> → obtenemos cada juego en <code>game</code></p>
</li>
<li>
<p>Ejecutamos la consulta <code>games.run()</code> y le pasamos <code>game</code></p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <code>JSON.stringify()</code> guarda en texto plano arrays</p>
<ul>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> NO HACER Es sólo para simplificar ejercicio</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Crear más tablas y normalizar</li>
</ul>
</li>
<li>
<p>Ejecutar con <code>node</code> y comprobar con extensión <code>SQLite</code></p>
</li>
</ul>
</div>
</split-slide>
</step>
<step>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">DatabaseSync</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;node:sqlite&quot;</span>;
<span class="hljs-keyword">import</span> { cwd } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;node:process&quot;</span>;

<span class="hljs-keyword">const</span> db = <span class="hljs-keyword">new</span> <span class="hljs-title class_">DatabaseSync</span>(<span class="hljs-string">`<span class="hljs-subst">${cwd()}</span>/data/games.db`</span>);

<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> <span class="hljs-title function_">getAll</span> = (<span class="hljs-params"></span>) =&gt; {
  <span class="hljs-keyword">const</span> query = db.<span class="hljs-title function_">prepare</span>(<span class="hljs-string">&quot;SELECT slug FROM games&quot;</span>);
  <span class="hljs-keyword">return</span> query.<span class="hljs-title function_">all</span>();
};

<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> <span class="hljs-title function_">getBySlug</span> = slug =&gt; {
  <span class="hljs-keyword">const</span> query = db.<span class="hljs-title function_">prepare</span>(<span class="hljs-string">&quot;SELECT * FROM games WHERE slug = ?&quot;</span>);
  <span class="hljs-keyword">return</span> query.<span class="hljs-title function_">get</span>(slug);

</code></pre>
<div>
<ul>
<li>
<p>En <code>/data/games.js</code> Cambiamos repositorio</p>
<ul>
<li>Conectamos a la base de datos <code>/data/games.db</code></li>
</ul>
</li>
<li>
<p>Modificamos nuestros métodos para obtener datos</p>
</li>
<li>
<p>En <code>getAll()</code> obtenemos todos los juegos</p>
<ul>

<li><code>query.all()</code> devuelve todos los datos</li>
<li><img class="emoji" draggable="false" alt="👀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f440.svg" data-marp-twemoji=""/> Sólo queremos los <code>slug</code></li>
</ul>
</li>
<li>
<p>En <code>getBySlug()</code> obtenemos info de un juego</p>
<ul>
<li><code>db.prepare()</code> prepara consulta</li>
<li><code>query.get()</code> le pasa el parámetro <code>slug</code> a <code>?</code></li>
</ul>
</li>
</ul>
</div>
</split-slide>
</step>
<step>
<split-slide style="--left: 50%; --right: 50%; --font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> <span class="hljs-title function_">getByYear</span> = year =&gt; {
  <span class="hljs-keyword">const</span> query = db.<span class="hljs-title function_">prepare</span>(<span class="hljs-string">&quot;SELECT slug FROM games WHERE year = ?&quot;</span>);
  <span class="hljs-keyword">return</span> query.<span class="hljs-title function_">all</span>(year);
};

<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> <span class="hljs-title function_">getRandom</span> = (<span class="hljs-params"></span>) =&gt; {

<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> <span class="hljs-title function_">search</span> = (<span class="hljs-params">text</span>) =&gt; {

  <span class="hljs-keyword">return</span> query.<span class="hljs-title function_">all</span>(<span class="hljs-string">`%<span class="hljs-subst">${text}</span>%`</span>, <span class="hljs-string">`%<span class="hljs-subst">${text}</span>%`</span>);
};
</code></pre>
<div>
<ul>
<li>El método <code>getByYear()</code> similar a los anteriores
<ul>
<li>Recuperamos todo <code>query.all()</code></li>
</ul>
</li>
<li>El método <code>getRandom()</code> da un juego al azar
<ul>
<li>Utilizamos <code>ORDER BY RANDOM() LIMIT 1</code></li>

</li>
<li>El método <code>search()</code> busca textos

</li>
