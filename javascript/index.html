<span class="hljs-keyword">const</span> name = <span class="hljs-string">&quot;Alonso&quot;</span>;
<span class="hljs-keyword">const</span> text = <span class="hljs-string">&quot;Hola&quot;</span>;

<span class="hljs-comment">// También se pueden escribir con comilla simple:</span>
<span class="hljs-keyword">const</span> text = <span class="hljs-string">&#x27;Hola&#x27;</span>;

<span class="hljs-comment">// En general, se usan comillas dobles, pero hay un caso más interesante</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="string-templates-1">String templates</h2>
<ul>
<li>Puedes usar ambas opciones, pero se prefiere ser consistente</li>
<li>Strings template permite: Interpolación de variables y multilinea</li>
<li>Extensión <a href="https://marketplace.visualstudio.com/items?itemName=Tobermory.es6-string-html">ES6 String HTML</a></li>
</ul>
<pre><code class="language-js"><span class="hljs-comment">// Sin string templates:</span>
<span class="hljs-keyword">const</span> name = <span class="hljs-string">&quot;Alonso&quot;</span>;
<span class="hljs-keyword">const</span> text = <span class="hljs-string">&quot;Hola, soy &quot;</span> + name;   <span class="hljs-comment">// &quot;Hola, soy Alonso&quot;</span>

<span class="hljs-comment">// Con string templates:</span>
<span class="hljs-keyword">const</span> text = <span class="hljs-string">`Hola, soy <span class="hljs-subst">${name}</span>`</span>;   <span class="hljs-comment">// &quot;Hola, soy Alonso&quot;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="string-templates-2">String templates</h2>
<ul>
<li>Puedes usar ambas opciones, pero se prefiere ser consistente</li>
<li>Strings template permite: Interpolación de variables y multilinea</li>
<li>Extensión <a href="https://marketplace.visualstudio.com/items?itemName=Tobermory.es6-string-html">ES6 String HTML</a></li>
</ul>
<pre><code class="language-js"><span class="hljs-comment">// Esto es especialmente interesante, porque nos permitirá crear cosas más complejas:</span>
<span class="hljs-keyword">const</span> message = <span class="hljs-string">&quot;¡Hola a todos!&quot;</span>;
<span class="hljs-keyword">const</span> html = <span class="hljs-string">`&lt;div class=&quot;container&quot;&gt;&lt;p&gt;<span class="hljs-subst">${message}</span>&lt;/p&gt;&lt;/div&gt;`</span>;

<span class="hljs-comment">// O incluso colocarlo más legible:</span>
<span class="hljs-keyword">const</span> html = <span class="hljs-comment">/* html */</span><span class="hljs-string">`&lt;div class=&quot;container&quot;&gt;
  &lt;p&gt;<span class="hljs-subst">${message}</span>&lt;/p&gt;
&lt;/div&gt;`</span>;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="posici%C3%B3n-y-fragmentos">Posición y fragmentos</h2>
<ul>
<li>Los métodos <code>.search()</code>, <code>.indexOf()</code> e <code>.lastIndexOf()</code> buscan posiciones (index)</li>
<li>Los métodos <code>.substring()</code> e <code>.slice()</code> buscan y devuelven fragmentos</li>
<li>Los métodos <code>.replace()</code> y <code>.replaceAll()</code> buscan y reemplazan fragmentos</li>
</ul>
<pre><code class="language-js"><span class="hljs-comment">//            ↓0   ↓5        ↓15           ↓29</span>
<span class="hljs-keyword">const</span> text = <span class="hljs-string">&quot;Estamos en el curso de Multimedios&quot;</span>;

text.<span class="hljs-title function_">search</span>(<span class="hljs-string">&quot;curso&quot;</span>);    <span class="hljs-comment">// 14</span>
text.<span class="hljs-title function_">indexOf</span>(<span class="hljs-string">&quot;o&quot;</span>);          <span class="hljs-comment">// 5</span>
text.<span class="hljs-title function_">indexOf</span>(<span class="hljs-string">&quot;u&quot;</span>, <span class="hljs-number">6</span>);       <span class="hljs-comment">// 15</span>
text.<span class="hljs-title function_">lastIndexOf</span>(<span class="hljs-string">&quot;e&quot;</span>);      <span class="hljs-comment">// 29</span>
text.<span class="hljs-title function_">lastIndexOf</span>(<span class="hljs-string">&quot;z&quot;</span>, <span class="hljs-number">28</span>);  <span class="hljs-comment">// -1 (no se encuentra)</span>

</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="posici%C3%B3n-y-fragmentos-1">Posición y fragmentos</h2>
<ul>
<li>Los métodos <code>.search()</code>, <code>.indexOf()</code> e <code>.lastIndexOf()</code> buscan posiciones (index)</li>
<li>Los métodos <code>.substring()</code> e <code>.slice()</code> buscan y devuelven fragmentos</li>
<li>Los métodos <code>.replace()</code> y <code>.replaceAll()</code> buscan y reemplazan fragmentos</li>
</ul>
<pre><code class="language-js"><span class="hljs-comment">//            ↓0   ↓5        ↓15           ↓29</span>
<span class="hljs-keyword">const</span> text = <span class="hljs-string">&quot;Estamos en el curso de Multimedios&quot;</span>;

text.<span class="hljs-title function_">substring</span>(<span class="hljs-number">14</span>, <span class="hljs-number">22</span>);     <span class="hljs-comment">// &quot;curso&quot;</span>
text.<span class="hljs-title function_">substring</span>(<span class="hljs-number">14</span>);         <span class="hljs-comment">// &quot;curso de Multimedios&quot;</span>
text.<span class="hljs-title function_">slice</span>(<span class="hljs-number">14</span>, <span class="hljs-number">22</span>);         <span class="hljs-comment">// Igual a substring</span>
text.<span class="hljs-title function_">slice</span>(<span class="hljs-number">14</span>, -<span class="hljs-number">2</span>);         <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> &quot;curso de Multimedi&quot;</span>

<span class="hljs-comment">// Los métodos .match() también buscan (más avanzados)</span>

</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="posici%C3%B3n-y-fragmentos-2">Posición y fragmentos</h2>
<ul>
<li>Los métodos <code>.search()</code>, <code>.indexOf()</code> e <code>.lastIndexOf()</code> buscan posiciones (index)</li>
<li>Los métodos <code>.substring()</code> e <code>.slice()</code> buscan y devuelven fragmentos</li>
<li>Los métodos <code>.replace()</code> y <code>.replaceAll()</code> buscan y reemplazan fragmentos</li>
</ul>
<pre><code class="language-js"><span class="hljs-comment">//            ↓0   ↓5        ↓15           ↓29</span>
<span class="hljs-keyword">const</span> text = <span class="hljs-string">&quot;Estamos en el curso de Multimedios&quot;</span>;

<span class="hljs-comment">// Ojo, no reemplaza, devuelve una copia (esto es importante)</span>
text.<span class="hljs-title function_">replace</span>(<span class="hljs-string">&quot;curso&quot;</span>, <span class="hljs-string">&quot;clase&quot;</span>);   <span class="hljs-comment">// Reemplaza sólo el primero</span>
text.<span class="hljs-title function_">replaceAll</span>(<span class="hljs-string">&quot;a&quot;</span>, <span class="hljs-string">&quot;i&quot;</span>);            <span class="hljs-comment">// Reemplaza todas las &quot;a&quot;</span>
text.<span class="hljs-title function_">replaceAll</span>(<span class="hljs-regexp">/[aeiou]/</span>, <span class="hljs-string">&quot;i&quot;</span>);      <span class="hljs-comment">// Con expresiones regulares</span>

</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="separar-y-unir">Separar y unir</h2>
<ul>
<li>Los métodos <code>.split()</code> / <code>.join()</code> separar o unen (String → Array, y viceversa)</li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">const</span> text = <span class="hljs-string">&quot;Estamos en el curso de Multimedios&quot;</span>;

<span class="hljs-keyword">const</span> words = text.<span class="hljs-title function_">split</span>(<span class="hljs-string">&quot; &quot;</span>);      <span class="hljs-comment">// (6) [&#x27;Estamos&#x27;, &#x27;en&#x27;, &#x27;el&#x27;, &#x27;curso&#x27;, &#x27;de&#x27;, &#x27;Multimedios&#x27;]</span>
<span class="hljs-keyword">const</span> fragments = text.<span class="hljs-title function_">split</span>(<span class="hljs-string">&quot;o&quot;</span>);  <span class="hljs-comment">// (4) [&#x27;Estam&#x27;, &#x27;s en el b&#x27;, &#x27;&#x27;, &#x27;tcamp de Multimedios&#x27;]</span>

words.<span class="hljs-title function_">push</span>(<span class="hljs-string">&quot;todos&quot;</span>, <span class="hljs-string">&quot;juntos&quot;</span>);      <span class="hljs-comment">// (8) [&#x27;Estamos&#x27;, &#x27;en&#x27;, ..., &#x27;de&#x27;, &#x27;Multimedios&#x27;, &#x27;todos&#x27;, &#x27;juntos&#x27;]</span>
<span class="hljs-keyword">const</span> newText = words.<span class="hljs-title function_">join</span>(<span class="hljs-string">&quot; &quot;</span>);    <span class="hljs-comment">// &#x27;Estamos en el bootcamp de Multimedios todos juntos&#x27;</span>

</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="comprobaciones">Comprobaciones</h2>
<ul>
<li>Comprueba si un texto empieza/acaba por algo <code>.startsWith()</code> / <code>.endsWith()</code></li>
<li>Comprueba si un texto incluye un fragmento <code>.includes()</code></li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">const</span> firstMessage = <span class="hljs-string">&quot;yes&quot;</span>;
<span class="hljs-keyword">const</span> secondMessage = <span class="hljs-string">&quot;no&quot;</span>;
<span class="hljs-keyword">const</span> thirdMessage = <span class="hljs-string">&quot;yes, of course&quot;</span>;

<span class="hljs-keyword">const</span> isPositive = firstMessage.<span class="hljs-title function_">startsWith</span>(<span class="hljs-string">&quot;yes&quot;</span>);    <span class="hljs-comment">// true</span>
<span class="hljs-keyword">const</span> isPositive = secondMessage.<span class="hljs-title function_">startsWith</span>(<span class="hljs-string">&quot;yes&quot;</span>);   <span class="hljs-comment">// false</span>
<span class="hljs-keyword">const</span> isPositive = thirdMessage.<span class="hljs-title function_">startsWith</span>(<span class="hljs-string">&quot;yes&quot;</span>);    <span class="hljs-comment">// true</span>

<span class="hljs-comment">// Ojo: mayúsculas/minúsculas, espacios, variaciones, etc...</span>

</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="comprobaciones-1">Comprobaciones</h2>
<ul>
<li>Comprueba si un texto empieza/acaba por algo <code>.startsWith()</code> / <code>.endsWith()</code></li>
<li>Comprueba si un texto incluye un fragmento <code>.includes()</code></li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">const</span> text = <span class="hljs-string">&quot;Estamos en el curso de Multimedios&quot;</span>;

text.<span class="hljs-title function_">endsWith</span>(<span class="hljs-string">&quot;Multimedios&quot;</span>);   <span class="hljs-comment">// true</span>

text.<span class="hljs-title function_">includes</span>(<span class="hljs-string">&quot;Multimedios&quot;</span>);   <span class="hljs-comment">// true</span>
text.<span class="hljs-title function_">includes</span>(<span class="hljs-string">&quot;curso&quot;</span>);  <span class="hljs-comment">// true</span>
text.<span class="hljs-title function_">includes</span>(<span class="hljs-string">&quot;Alonso&quot;</span>);   <span class="hljs-comment">// false</span>

</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="manipulaci%C3%B3n-de-textos">Manipulación de textos</h2>
<ul>
<li>Mayúsculas y minúsculas con <code>.toLowerCase()</code> / <code>.toUpperCase()</code></li>
<li>Suprimir («afeitar») espacios con <code>.trimStart()</code> / <code>.trimEnd()</code> / <code>.trim()</code></li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">const</span> text = <span class="hljs-string">&quot;¿Has practicado flex y grid?&quot;</span>;
<span class="hljs-keyword">const</span> message = <span class="hljs-string">&quot;  ¿Todavía  nada?  &quot;</span>;

text.<span class="hljs-title function_">toUpperCase</span>();   <span class="hljs-comment">// &#x27;¿HAZ PRACTICADO FLEX Y GRID?&#x27;</span>
message.<span class="hljs-title function_">trimStart</span>();  <span class="hljs-comment">// &#x27;¿Todavía  nada?  &#x27;</span>
message.<span class="hljs-title function_">trim</span>();       <span class="hljs-comment">// &#x27;¿Todavía  nada?&#x27;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-scope-DrAWIuo4="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="15" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="39">
<h1 id="m%C3%A9todos-matem%C3%A1ticos">Métodos matemáticos</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="m%C3%A9todos-matem%C3%A1ticos-1">Métodos matemáticos</h2>
<ul>
<li>Math tiene muchos <a href="https://lenguajejs.com/javascript/number/objeto-math/">métodos matemáticos</a> → <a href="https://lenguajejs.com/javascript/cheatsheets/">CheatSheet JS</a><br />
Por ejemplo, redondeos, o uno de los más interesantes: <code>Math.random()</code> → Propuesta futura</li>
<li>Rellenar con (...) con métodos <code>.padStart()</code> / <code>.padEnd()</code></li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">const</span> lowNumber = <span class="hljs-number">42.3</span>;
<span class="hljs-keyword">const</span> highNumber = <span class="hljs-number">42.8</span>;

<span class="hljs-title class_">Math</span>.<span class="hljs-title function_">floor</span>(lowNumber);     <span class="hljs-comment">// 42</span>
<span class="hljs-title class_">Math</span>.<span class="hljs-title function_">floor</span>(highNumber);    <span class="hljs-comment">// 42</span>
<span class="hljs-title class_">Math</span>.<span class="hljs-title function_">ceil</span>(lowNumber);      <span class="hljs-comment">// 43</span>
<span class="hljs-title class_">Math</span>.<span class="hljs-title function_">ceil</span>(highNumber);     <span class="hljs-comment">// 43</span>
<span class="hljs-title class_">Math</span>.<span class="hljs-title function_">round</span>(lowNumber);     <span class="hljs-comment">// 42</span>
<span class="hljs-title class_">Math</span>.<span class="hljs-title function_">round</span>(highNumber);    <span class="hljs-comment">// 43</span>

</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="m%C3%A9todos-matem%C3%A1ticos-2">Métodos matemáticos</h2>
<ul>
<li>Math tiene muchos <a href="https://lenguajejs.com/javascript/number/objeto-math/">métodos matemáticos</a> → <a href="https://lenguajejs.com/javascript/cheatsheets/">CheatSheet JS</a><br />
Por ejemplo, redondeos, o uno de los más interesantes: <code>Math.random()</code> → Propuesta futura</li>
<li>Rellenar con (...) con métodos <code>.padStart()</code> / <code>.padEnd()</code></li>
</ul>
<pre><code class="language-js"><span class="hljs-title class_">Math</span>.<span class="hljs-title function_">random</span>();                  <span class="hljs-comment">// 0.15893673829326427   (Entre 0 y 1, con 16 decimales)</span>
<span class="hljs-title class_">Math</span>.<span class="hljs-title function_">random</span>() * <span class="hljs-number">6</span>;              <span class="hljs-comment">// 5.28581815715711717   (Entre 0 y 6, con 16 decimales)</span>
<span class="hljs-title class_">Math</span>.<span class="hljs-title function_">ceil</span>(<span class="hljs-title class_">Math</span>.<span class="hljs-title function_">random</span>() * <span class="hljs-number">6</span>);   <span class="hljs-comment">// 6                     (Entre 1 y 6, sin decimales)</span>

<span class="hljs-keyword">const</span> hours = <span class="hljs-number">3</span>;
<span class="hljs-keyword">const</span> minutes = <span class="hljs-number">8</span>;
<span class="hljs-keyword">const</span> time = <span class="hljs-string">`<span class="hljs-subst">${hours.padStart(<span class="hljs-number">2</span>, <span class="hljs-string">&quot;0&quot;</span>)}</span>:<span class="hljs-subst">${minutes.padStart(<span class="hljs-number">2</span>, <span class="hljs-string">&quot;0&quot;</span>)}</span>`</span>;   <span class="hljs-comment">// 03:08</span>

</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="m%C3%A9todos-de-array">Métodos de Array</h2>
<ul>
<li>Muchos métodos son similares a los que vimos en String</li>
<li>Otros permiten hacer cosas más relacionadas con Array</li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">const</span> letters = [<span class="hljs-string">&quot;A&quot;</span>, <span class="hljs-string">&quot;B&quot;</span>, <span class="hljs-string">&quot;C&quot;</span>, <span class="hljs-string">&quot;D&quot;</span>, <span class="hljs-string">&quot;E&quot;</span>];

letters.<span class="hljs-property">length</span>        <span class="hljs-comment">// 5</span>
letters.<span class="hljs-title function_">at</span>(<span class="hljs-number">0</span>)         <span class="hljs-comment">// &quot;A&quot;  (también letters[0])</span>
letters.<span class="hljs-title function_">at</span>(-<span class="hljs-number">1</span>)        <span class="hljs-comment">// &quot;E&quot;  (desde el final)</span>
letters[-<span class="hljs-number">1</span>]           <span class="hljs-comment">// undefined</span>
letters.<span class="hljs-title function_">with</span>(<span class="hljs-number">0</span>, <span class="hljs-string">&quot;Z&quot;</span>)  <span class="hljs-comment">// [&quot;Z&quot;, &quot;B&quot;, &quot;C&quot;, &quot;D&quot;, &quot;E&quot;];</span>

</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="mutaci%C3%B3n-de-variables-originales">Mutación de variables originales</h2>
<ul>
<li>Algunos métodos <img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> mutan el dato original, ¡identifícalos!<br />
Por ejemplo: <code>.push()</code>, <code>.pop()</code>, <code>.unshift()</code> o <code>.shift()</code></li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">const</span> letters = [<span class="hljs-string">&quot;A&quot;</span>, <span class="hljs-string">&quot;B&quot;</span>, <span class="hljs-string">&quot;C&quot;</span>, <span class="hljs-string">&quot;D&quot;</span>, <span class="hljs-string">&quot;E&quot;</span>];

letters.<span class="hljs-title function_">push</span>(<span class="hljs-string">&quot;F&quot;</span>);      <span class="hljs-comment">// Devuelve 6, <img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> letters muta: [&quot;A&quot;, &quot;B&quot;, &quot;C&quot;, &quot;D&quot;, &quot;E&quot;, &quot;F&quot;]</span>
letters.<span class="hljs-title function_">push</span>(<span class="hljs-string">&quot;G&quot;</span>);      <span class="hljs-comment">// Devuelve 7, <img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> letters muta: [&quot;A&quot;, &quot;B&quot;, &quot;C&quot;, &quot;D&quot;, &quot;E&quot;, &quot;F&quot;, &quot;G&quot;]</span>
letters.<span class="hljs-title function_">pop</span>();          <span class="hljs-comment">// Devuelve &quot;G&quot;, <img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> letters muta: [&quot;A&quot;, &quot;B&quot;, &quot;C&quot;, &quot;D&quot;, &quot;E&quot;, &quot;F&quot;]</span>

letters.<span class="hljs-title function_">unshift</span>(<span class="hljs-string">&quot;0&quot;</span>);   <span class="hljs-comment">// Devuelve 7, <img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> letters muta: [&quot;0&quot;, &quot;A&quot;, &quot;B&quot;, &quot;C&quot;, &quot;D&quot;, &quot;E&quot;, &quot;F&quot;]</span>
letters.<span class="hljs-title function_">shift</span>();        <span class="hljs-comment">// Devuelve &quot;0&quot;, <img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> letters muta: [&quot;A&quot;, &quot;B&quot;, &quot;C&quot;, &quot;D&quot;, &quot;E&quot;, &quot;F&quot;]</span>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="m%C3%A9todos-de-objetos">Métodos de Objetos</h2>
<ul>
<li>Un objeto en Javascript es una forma de organizar información</li>
<li>Propiedades y métodos</li>
</ul>
<div class="grid">
<pre><code class="language-js"><span class="hljs-keyword">const</span> user = {
  <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Alonso&quot;</span>,
  <span class="hljs-attr">life</span>: <span class="hljs-number">99</span>,
  <span class="hljs-attr">power</span>: <span class="hljs-number">10</span>,

  <span class="hljs-attr">talk</span>: <span class="hljs-keyword">function</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Hello!!&quot;</span>);
  }
}
</code></pre>
<pre><code class="language-js">user.<span class="hljs-property">name</span>           <span class="hljs-comment">// &quot;Alonso&quot;</span>
user[<span class="hljs-string">&quot;name&quot;</span>]        <span class="hljs-comment">// &quot;Alonso&quot;</span>

<span class="hljs-keyword">const</span> prop = <span class="hljs-string">&quot;name&quot;</span>;
user[prop]          <span class="hljs-comment">// &quot;Alonso&quot;</span>

user.<span class="hljs-property">role</span> = <span class="hljs-string">&quot;Teacher&quot;</span>;    <span class="hljs-comment">// Se pueden añadir</span>
user.<span class="hljs-title function_">talk</span>();        <span class="hljs-comment">// En consola: &quot;Hello!!&quot;</span>

</code></pre>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="formato-json">Formato JSON</h2>
<ul>
<li>Pasar a texto los datos de un objeto Javascript (con algunas limitaciones)</li>
<li>Pasar de objeto a JSON y viceversa: <code>JSON.stringify()</code> y <code>JSON.parse()</code></li>
</ul>
<div class="grid">
<pre><code class="language-js"><span class="hljs-keyword">const</span> user = {
  <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Alonso&quot;</span>,
  <span class="hljs-attr">life</span>: <span class="hljs-number">99</span>,
  <span class="hljs-attr">power</span>: <span class="hljs-number">10</span>,

  <span class="hljs-attr">talk</span>: <span class="hljs-keyword">function</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Hello!!&quot;</span>);
  }
}
</code></pre>
<pre><code class="language-js"><span class="hljs-keyword">const</span> json = <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">stringify</span>(user);
<span class="hljs-comment">// &#x27;{&quot;name&quot;:&quot;Alonso&quot;,&quot;life&quot;:99,&quot;power&quot;:10}&#x27;</span>

<span class="hljs-keyword">const</span> json = <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">stringify</span>(user, <span class="hljs-literal">null</span>, <span class="hljs-number">4</span>);
<span class="hljs-comment">// Te lo da «beautificado» a 4 espacios</span>

<span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">parse</span>(json);
<span class="hljs-comment">// { name: &quot;Alonso&quot;, life: 99, power: 10 }</span>

</code></pre>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="m%C3%A9todos-de-array-1">Métodos de Array</h2>
<ul>
<li>Desestructuración: spread y rest</li>
<li>Algunos ejemplos</li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">const</span> firstLetters = [<span class="hljs-string">&quot;A&quot;</span>, <span class="hljs-string">&quot;B&quot;</span>, <span class="hljs-string">&quot;C&quot;</span>, <span class="hljs-string">&quot;D&quot;</span>, <span class="hljs-string">&quot;E&quot;</span>];

<span class="hljs-comment">// Los sacas del array, y reestructuras:</span>
<span class="hljs-keyword">const</span> letters = [...firstLetters, <span class="hljs-string">&quot;F&quot;</span>];

<span class="hljs-comment">// [&#x27;A&#x27;, &#x27;B&#x27;, &#x27;C&#x27;, &#x27;D&#x27;, &#x27;E&#x27;, &#x27;F&#x27;]</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="m%C3%A9todos-de-array-2">Métodos de Array</h2>
<ul>
<li>Desestructuración: spread y rest</li>
<li>Algunos ejemplos</li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">let</span> first = <span class="hljs-number">1</span>;
<span class="hljs-keyword">let</span> last = <span class="hljs-number">99</span>;
<span class="hljs-keyword">let</span> aux;

<span class="hljs-comment">// Opción 1: Clásico</span>
aux = first;
first = last;
last = aux;

<span class="hljs-comment">// Opción 2: Reestructurando</span>
[first, last] = [last, first];
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="m%C3%A9todos-de-array-3">Métodos de Array</h2>
<ul>
<li>Desestructuración: spread y rest</li>
<li>Algunos ejemplos</li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">const</span> letters = [<span class="hljs-string">&quot;A&quot;</span>, <span class="hljs-string">&quot;B&quot;</span>, <span class="hljs-string">&quot;C&quot;</span>, <span class="hljs-string">&quot;D&quot;</span>, <span class="hljs-string">&quot;E&quot;</span>, <span class="hljs-string">&quot;F&quot;</span>];

<span class="hljs-keyword">const</span> halfSize = <span class="hljs-title class_">Math</span>.<span class="hljs-title function_">floor</span>(letters.<span class="hljs-property">length</span> / <span class="hljs-number">2</span>);  <span class="hljs-comment">// 3</span>
<span class="hljs-keyword">const</span> firstPart = letters.<span class="hljs-title function_">slice</span>(<span class="hljs-number">0</span>, halfSize);     <span class="hljs-comment">// [&#x27;A&#x27;, &#x27;B&#x27;, &#x27;C&#x27;]</span>
<span class="hljs-keyword">const</span> lastPart = letters.<span class="hljs-title function_">slice</span>(halfSize);         <span class="hljs-comment">// [&#x27;D&#x27;, &#x27;E&#x27;, &#x27;F&#x27;]</span>

<span class="hljs-keyword">const</span> result = [...firstPart, <span class="hljs-string">&quot;medio&quot;</span>, ...lastPart];
<span class="hljs-comment">// [&#x27;A&#x27;, &#x27;B&#x27;, &#x27;C&#x27;, &#x27;medio&#x27;, &#x27;D&#x27;, &#x27;E&#x27;, &#x27;F&#x27;]</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="m%C3%A9todos-de-array-4">Métodos de Array</h2>
<ul>
<li>Métodos para comprobar: <code>.includes()</code>, <code>.indexOf()</code> o <code>.lastIndexOf()</code></li>
<li>Métodos para fragmentos: <code>.slice()</code>, <img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> <code>.splice()</code> o <code>.toSpliced()</code></li>
</ul>
<pre><code class="language-js"><span class="hljs-comment">//              ↓0  ↓1   ↓2   ↓3   ↓4   ↓5   ↓6  ← Slice</span>
<span class="hljs-keyword">const</span> letters = [<span class="hljs-string">&quot;A&quot;</span>, <span class="hljs-string">&quot;B&quot;</span>, <span class="hljs-string">&quot;C&quot;</span>, <span class="hljs-string">&quot;D&quot;</span>, <span class="hljs-string">&quot;E&quot;</span>, <span class="hljs-string">&quot;F&quot;</span>];

letters.<span class="hljs-title function_">includes</span>(<span class="hljs-string">&quot;A&quot;</span>);      <span class="hljs-comment">// true</span>
letters.<span class="hljs-title function_">includes</span>(<span class="hljs-string">&quot;Z&quot;</span>);      <span class="hljs-comment">// false</span>
letters.<span class="hljs-title function_">indexOf</span>(<span class="hljs-string">&quot;B&quot;</span>);       <span class="hljs-comment">// 1</span>
letters.<span class="hljs-title function_">indexOf</span>(<span class="hljs-string">&quot;H&quot;</span>);       <span class="hljs-comment">// -1</span>
letters.<span class="hljs-title function_">slice</span>(<span class="hljs-number">1</span>, <span class="hljs-number">3</span>);        <span class="hljs-comment">// Devuelve [&quot;B&quot;, &quot;C&quot;]</span>

</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="m%C3%A9todos-de-array-5">Métodos de Array</h2>
<ul>
<li>Métodos para comprobar: <code>.includes()</code>, <code>.indexOf()</code> o <code>.lastIndexOf()</code></li>
<li>Métodos para fragmentos: <code>.slice()</code>, <img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> <code>.splice()</code> o <code>.toSpliced()</code></li>
</ul>
<pre><code class="language-js"><span class="hljs-comment">//                ↓0   ↓1   ↓2   ↓3   ↓4   ↓5   ← Splice</span>
<span class="hljs-keyword">const</span> letters = [<span class="hljs-string">&quot;A&quot;</span>, <span class="hljs-string">&quot;B&quot;</span>, <span class="hljs-string">&quot;C&quot;</span>, <span class="hljs-string">&quot;D&quot;</span>, <span class="hljs-string">&quot;E&quot;</span>, <span class="hljs-string">&quot;F&quot;</span>];

letters.<span class="hljs-title function_">toSpliced</span>(<span class="hljs-number">1</span>, <span class="hljs-number">3</span>);
<span class="hljs-comment">// Selecciona [&quot;B&quot;, &quot;C&quot;, &quot;D&quot;] y devuelve lo que queda: [&#x27;A&#x27;, &#x27;E&#x27;, &#x27;F&#x27;]</span>
<span class="hljs-comment">// letters no muta, queda igual</span>

letters.<span class="hljs-title function_">splice</span>(<span class="hljs-number">1</span>, <span class="hljs-number">3</span>);
<span class="hljs-comment">// Selecciona [&#x27;B&#x27;, &#x27;C&#x27;, &#x27;D&#x27;], lo extrae y lo devuelve</span>
<span class="hljs-comment">// <img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> letters muta a lo que queda: [&#x27;A&#x27;, &#x27;E&#x27;, &#x27;F&#x27;]</span>

</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-scope-nAOkWEx1="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="28" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="39">
<h1 id="ordenar-y-clonar">Ordenar y clonar</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="ordenar-array">Ordenar Array</h2>
<ul>
<li>Métodos para invertir: <img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> <code>.reverse()</code> y <code>.toReversed()</code></li>
<li>Métodos para ordenar: <img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> <code>.sort()</code> y <code>.toSorted()</code></li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">const</span> letters = [<span class="hljs-string">&quot;A&quot;</span>, <span class="hljs-string">&quot;B&quot;</span>, <span class="hljs-string">&quot;C&quot;</span>, <span class="hljs-string">&quot;D&quot;</span>, <span class="hljs-string">&quot;E&quot;</span>, <span class="hljs-string">&quot;F&quot;</span>];

<span class="hljs-keyword">const</span> inverseLetters = letters.<span class="hljs-title function_">toReversed</span>();
<span class="hljs-comment">// [&#x27;F&#x27;, &#x27;E&#x27;, &#x27;D&#x27;, &#x27;C&#x27;, &#x27;B&#x27;, &#x27;A&#x27;]</span>
<span class="hljs-comment">// letters no muta</span>

<span class="hljs-keyword">const</span> inverseLetters = letters.<span class="hljs-title function_">reverse</span>();
<span class="hljs-comment">// [&#x27;F&#x27;, &#x27;E&#x27;, &#x27;D&#x27;, &#x27;C&#x27;, &#x27;B&#x27;, &#x27;A&#x27;]</span>
<span class="hljs-comment">// <img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> letters muta: [&quot;A&quot;, &quot;B&quot;, &quot;C&quot;, &quot;D&quot;, &quot;E&quot;, &quot;F&quot;]</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="ordenar-array-1">Ordenar Array</h2>
<ul>
<li>Métodos para invertir: <img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> .reverse() y toReversed()</li>
<li>Métodos para ordenar: <img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> .sort() y .toSorted()</li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">const</span> letters = [<span class="hljs-string">&quot;C&quot;</span>, <span class="hljs-string">&quot;Z&quot;</span>, <span class="hljs-string">&quot;A&quot;</span>];

letters.<span class="hljs-title function_">toSorted</span>();   <span class="hljs-comment">// [&#x27;A&#x27;, &#x27;C&#x27;, &#x27;Z&#x27;]</span>
letters.<span class="hljs-title function_">sort</span>();       <span class="hljs-comment">// [&#x27;A&#x27;, &#x27;C&#x27;, &#x27;Z&#x27;]  <img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> letters muta: [&#x27;A&#x27;, &#x27;C&#x27;, &#x27;Z&#x27;]</span>

<span class="hljs-keyword">const</span> numbers = [<span class="hljs-number">1</span>, <span class="hljs-number">5</span>, <span class="hljs-number">8</span>, <span class="hljs-number">10</span>, <span class="hljs-number">4</span>, <span class="hljs-number">25</span>, <span class="hljs-number">2</span>];

numbers.<span class="hljs-title function_">toSorted</span>();   <span class="hljs-comment">// [1, 10, 2, 25, 4, 5, 8]     ???</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="ordenar-array-2">Ordenar Array</h2>
<ul>
<li>Métodos para invertir: <img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> .reverse() y toReversed()</li>
<li>Métodos para ordenar: <img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> .sort() y .toSorted()</li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">const</span> numbers = [<span class="hljs-number">1</span>, <span class="hljs-number">5</span>, <span class="hljs-number">8</span>, <span class="hljs-number">10</span>, <span class="hljs-number">4</span>, <span class="hljs-number">25</span>, <span class="hljs-number">2</span>];

numbers.<span class="hljs-title function_">toSorted</span>();                   <span class="hljs-comment">// ordenación alfabética</span>
<span class="hljs-comment">// [1, 10, 2, 25, 4, 5, 8]</span>

numbers.<span class="hljs-title function_">toSorted</span>(<span class="hljs-function">(<span class="hljs-params">a, b</span>) =&gt;</span> a - b);    <span class="hljs-comment">// ordenación numérica descendente</span>
numbers.<span class="hljs-title function_">toSorted</span>(<span class="hljs-function">(<span class="hljs-params">a, b</span>) =&gt;</span> b - a);    <span class="hljs-comment">// ordenación numérica ascendente</span>
letters.<span class="hljs-title function_">toSorted</span>(<span class="hljs-function">(<span class="hljs-params">a, b</span>) =&gt;</span> a.<span class="hljs-title function_">localeCompare</span>(b)); <span class="hljs-comment">// descendente [&#x27;A&#x27;, &#x27;C&#x27;, &#x27;Z&#x27;]</span>
letters.<span class="hljs-title function_">toSorted</span>(<span class="hljs-function">(<span class="hljs-params">a, b</span>) =&gt;</span> b.<span class="hljs-title function_">localeCompare</span>(a)); <span class="hljs-comment">// ascendente [&#x27;Z&#x27;, &#x27;C&#x27;, &#x27;A&#x27;]</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="39">
<h2 id="sobre-las-copias-de-estructuras">Sobre las copias de estructuras</h2>
<ul>
<li>Aprende a diferenciar cuando es un valor y cuando una referencia</li>
<li>Usa <code>...</code> para copias superficiales y <code>structuredClone()</code> para copias profundas</li>
</ul>

<h2 id="introducci%C3%B3n-a-array-functions">Introducción a Array functions</h2>
<ul>
<li>El método de array .forEach() ejecuta una función por cada elemento</li>
<li>Volveremos a ello más adelante.</li>
</ul>
<div class="grid">
<pre><code class="language-js"><span class="hljs-keyword">const</span> letters = [<span class="hljs-string">&quot;A&quot;</span>, <span class="hljs-string">&quot;L&quot;</span>, <span class="hljs-string">&quot;O&quot;</span>, <span class="hljs-string">&quot;N&quot;</span>];

<span class="hljs-keyword">function</span> <span class="hljs-title function_">show</span>(<span class="hljs-params">element</span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Elemento: &quot;</span> + element);
}

letters.<span class="hljs-title function_">forEach</span>(show);
</code></pre>
<pre><code class="language-js"><span class="hljs-keyword">const</span> letters = [<span class="hljs-string">&quot;A&quot;</span>, <span class="hljs-string">&quot;L&quot;</span>, <span class="hljs-string">&quot;O&quot;</span>, <span class="hljs-string">&quot;N&quot;</span>];

<span class="hljs-comment">// Abreviado con arrow function</span>
letters.<span class="hljs-title function_">forEach</span>(<span class="hljs-function">(<span class="hljs-params">el</span>) =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(el));

<span class="hljs-comment">// Elemento, posición, array</span>
letters.<span class="hljs-title function_">forEach</span>(<span class="hljs-function">(<span class="hljs-params">el, index, array</span>) =&gt;</span> {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Elemento #<span class="hljs-subst">${index}</span>: <span class="hljs-subst">${el}</span>`</span>);
});
</code></pre>
</section>

animals.<span class="hljs-title function_">forEach</span>(<span class="hljs-function">(<span class="hljs-params">el, index</span>) =&gt;</span> {

});
</code></pre>
<pre><code class="language-js"><span class="hljs-comment">// Transforma el array original en uno derivado</span>
<span class="hljs-keyword">const</span> sizes = animals.<span class="hljs-title function_">map</span>(<span class="hljs-function">(<span class="hljs-params">el, index, array</span>) =&gt;</span> {

});
