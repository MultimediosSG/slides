warning-badge<span class="hljs-selector-pseudo">::after</span> {

}

warning-badge<span class="hljs-selector-attr">[pulsing]</span><span class="hljs-selector-pseudo">::after</span> {

}
</code></pre>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="custom-elements-%F0%9F%92%96-clases-js">Custom Elements <img class="emoji" draggable="false" alt="💖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f496.svg" data-marp-twemoji=""/> Clases JS</h2>
<ul>
<li>Vamos a añadirle la <strong>potencia</strong> de Javascript con sus Clases (OOP)</li>
</ul>
<p><img src="../assets/wc-js.png" alt="contain" style="width:800px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="ciclo-de-vida-b%C3%A1sico">Ciclo de vida básico</h2>
<ul>
<li>Ejecutar lógica al cargar componente / iniciar cada custom element</li>
</ul>
<split-slide>
<pre><code class="language-js"><span class="hljs-number">1</span>️⃣ <span class="hljs-comment">// Código al inicio del archivo</span>

<span class="hljs-keyword">class</span> <span class="hljs-title class_">WarningBadge</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_ inherited__">HTMLElement</span> {
  <span class="hljs-title function_">constructor</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">super</span>();
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Etiqueta cargada&quot;</span>); <span class="hljs-number">2</span>️⃣
  }
}

customElements.<span class="hljs-title function_">define</span>(<span class="hljs-string">&quot;warning-badge&quot;</span>, <span class="hljs-title class_">WarningBadge</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Componente cargado&quot;</span>); <span class="hljs-number">3</span>
</code></pre>
<div>
<h3 id="inicio-del-archivo">Inicio del archivo:</h3>
<ul>
<li><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Se ejecuta cuando se importa el archivo</li>
<li>Útil para tareas iniciales (constantes, tareas previas)</li>
</ul>
<h3 id="constructor">Constructor:</h3>
<ul>
<li><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Se ejecuta cuando se crea una etiqueta HTML</li>
<li>Equivalente a <code>new WarningBadge()</code></li>
</ul>
<h3 id="inicializaci%C3%B3n">Inicialización:</h3>
<ul>
<li><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Se ejecuta cuando carga el componente (1 vez)</li>
<li>Similar a <img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/31-20e3.svg" data-marp-twemoji=""/> pero ya has definido todo</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="ciclo-de-vida-de-un-webcomponent">Ciclo de vida de un WebComponent</h2>
<ul>
<li>Al añadir/eliminar del DOM el custom element</li>
<li>Útil para tareas &quot;lazy&quot; de inicialización (al añadir al DOM)</li>
<li>Útil para tareas de &quot;limpieza&quot; (al eliminar del DOM)</li>
</ul>
<split-slide>
<pre><code class="language-js"><span class="hljs-keyword">class</span> <span class="hljs-title class_">WarningBadge</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_ inherited__">HTMLElement</span> {

  <span class="hljs-title function_">constructor</span>(<span class="hljs-params"></span>) { <span class="hljs-comment">/* ... */</span> }
  <span class="hljs-title function_">connectedCallback</span>(<span class="hljs-params"></span>) { <span class="hljs-comment">/* ... */</span> } <span class="hljs-number">1</span>️⃣
  <span class="hljs-title function_">disconnectedCallback</span>(<span class="hljs-params"></span>) { <span class="hljs-comment">/* ... */</span> } <span class="hljs-number">2</span>️⃣

}
</code></pre>
<div>
<h3 id="connected">Connected:</h3>
<ul>
<li><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Se añade al DOM, se llama <code>connectedCallback()</code></li>
<li>Se dispara al hacer <code>append()</code>, <code>prepend()</code>, <code>setHTML*()</code>, ...</li>
</ul>
<h3 id="disconnected">Disconnected:</h3>
<ul>
<li><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Cuando se elimina del DOM, se llama disconnectedCallback()</li>
<li>Se dispara al hacer <code>remove()</code>, <code>setHTML*()</code>, ...</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="clases-de-javascript">Clases de Javascript</h2>
<ul>
<li>Son clases, por lo que podemos usar sus características</li>
</ul>
<split-slide>
<pre><code class="language-js"><span class="hljs-keyword">class</span> <span class="hljs-title class_">WarningBadge</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_ inherited__">HTMLElement</span> {
  #private = <span class="hljs-number">42</span>;
  public = <span class="hljs-string">&quot;Alo&quot;</span>;

  <span class="hljs-keyword">get</span> <span class="hljs-title function_">value</span>() {
    <span class="hljs-keyword">return</span> <span class="hljs-string">`Data: <span class="hljs-subst">${<span class="hljs-variable language_">this</span>.#private}</span>`</span>;
  }

  <span class="hljs-title function_">method</span>(<span class="hljs-params"></span>) { <span class="hljs-comment">/* ... */</span> }
  #<span class="hljs-title function_">method</span>(<span class="hljs-params"></span>) { <span class="hljs-comment">/* ... */</span> }
}
</code></pre>
<div>
<ul>
<li><strong>Propiedades públicas</strong>: Accesibles desde la clase y desde fuera</li>
<li><strong>Propiedades privadas</strong> (prefijo <code>#</code>): Accesibles sólo desde la clase
<ul>
<li>Recuerda llamarlas con <code>#</code> incluido: <code>this.#prop</code></li>
</ul>
</li>
<li><strong>Getters/Setters</strong>: Define método (<code>get</code> o <code>set</code>), uso como propiedad
<ul>
<li>Se define <code>get value()</code>, se llama como <code>this.value</code></li>
<li>Cuidado con los bucles infinitos</li>
</ul>
</li>
<li><strong>Métodos</strong>: Funciones de clase para simplificar y hacer legible</li>
<li><strong>Métodos privados</strong> (prefijo <code>#</code>): Ejecutables sólo dentro de la clase
<ul>
<li>Recuerda llamarlas con <code>#</code> incluido: <code>this.#method()</code></li>
</ul>
</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="estructura-de-un-webcomponent">Estructura de un WebComponent</h2>
<split-slide>
<pre><code class="language-js"><span class="hljs-keyword">class</span> <span class="hljs-title class_">WarningBadge</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_ inherited__">HTMLElement</span> {
  <span class="hljs-title function_">constructor</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">super</span>();
  }

  <span class="hljs-title function_">connectedCallback</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">render</span>();
  }

  <span class="hljs-title function_">render</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">setHTMLUnsafe</span>(<span class="hljs-comment">/* html */</span><span class="hljs-string">`
      &lt;div class=&quot;container&quot;&gt;
        ...
      &lt;/div&gt;
    `</span>);
  }
}
</code></pre>
<div>
<h3 id="inicializaci%C3%B3n-1">Inicialización:</h3>
<ul>
<li>El <code>constructor</code> define las tareas <strong>urgentes</strong> e iniciales.</li>
<li>Intenta mantenerlo lo más ligero posible.</li>
</ul>
<h3 id="inicializaci%C3%B3n-lazy">Inicialización (lazy):</h3>
<ul>
<li>
<p>El <code>connectedCallback</code> define acciones más costosas.</p>
</li>
<li>
<p>El método <code>render</code> hace cambios visibles en el DOM.</p>
</li>
<li>
<p>Puedes crear un Custom element y no insertarlo inmediatamente en el DOM</p>
</li>
<li>
<p>Se puede usar el <code>connectedCallback()</code> para posponer ciertas tareas</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">

<steps>
<step>
<split-slide>
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- Definimos nuestro web component --&gt;</span>

<span class="hljs-comment">/* Se aplica al componente */</span>

<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">style</span>&gt;</span><span class="language-css">

  <span class="hljs-attribute">width</span>: <span class="hljs-built_in">var</span>(--size);
  <span class="hljs-attribute">height</span>: <span class="hljs-built_in">var</span>(--size);
  <span class="hljs-attribute">background</span>: indigo;
  <span class="hljs-attribute">border-radius</span>: <span class="hljs-number">50%</span>;
  <span class="hljs-attribute">animation</span>: bounce <span class="hljs-number">1s</span> infinite alternate;
}

<span class="hljs-keyword">@keyframes</span> bounce {
  <span class="hljs-number">0%</span> { <span class="hljs-attribute">translate</span>: <span class="hljs-number">0</span> -<span class="hljs-number">10px</span> }
  <span class="hljs-number">100%</span> { <span class="hljs-attribute">translate</span>: <span class="hljs-number">0</span> <span class="hljs-number">0</span> }
}
</span><span class="hljs-tag">&lt;/<span class="hljs-name">style</span>&gt;</span>
</code></pre>
</split-slide>
</step>
<step>
<split-slide style="--font-size: 1.1rem;">
<pre><code class="language-js"><span class="hljs-keyword">const</span> L = <span class="hljs-string">&quot;liberia+guanacaste&quot;</span>;
<span class="hljs-keyword">const</span> <span class="hljs-variable constant_">URL</span> = <span class="hljs-string">`https://goweather.xyz/v2/weather/<span class="hljs-subst">${L}</span>`</span>;

<span class="hljs-keyword">class</span> <span class="hljs-title class_">WeatherTime</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_ inherited__">HTMLElement</span> {
  data = {};

  <span class="hljs-title function_">constructor</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">super</span>();
    <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">init</span>();
  }

  <span class="hljs-keyword">async</span> <span class="hljs-title function_">init</span>(<span class="hljs-params"></span>) {
    <span class="hljs-keyword">const</span> response = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(<span class="hljs-variable constant_">URL</span>);
    <span class="hljs-built_in">setTimeout</span>(<span class="hljs-title function_">async</span> () =&gt; {                  <span class="hljs-number">1</span>️⃣
      <span class="hljs-variable language_">this</span>.<span class="hljs-property">data</span> = <span class="hljs-keyword">await</span> response.<span class="hljs-title function_">json</span>();
      <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">render</span>();
    }, <span class="hljs-number">2000</span>);
  }

  <span class="hljs-title function_">connectedCallback</span>(<span class="hljs-params"></span>) { <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">render</span>() }
}
</code></pre>
<pre><code class="language-js"><span class="hljs-keyword">class</span> <span class="hljs-title class_">WeatherTime</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_ inherited__">HTMLElement</span> {
  <span class="hljs-comment">/* ... */</span>

  <span class="hljs-title function_">render</span>(<span class="hljs-params"></span>) {
    <span class="hljs-keyword">if</span> (!<span class="hljs-variable language_">this</span>.<span class="hljs-property">data</span>?.<span class="hljs-property">temperature</span>) {            <span class="hljs-number">2</span>️⃣
      <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Cargando datos...&quot;</span>);
      <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">setHTMLUnsafe</span>(
        <span class="hljs-comment">/* html */</span><span class="hljs-string">`&lt;div class=&quot;loading&quot;&gt;&lt;/div&gt;`</span>.<span class="hljs-title function_">repeat</span>(<span class="hljs-number">3</span>));
    }
    <span class="hljs-keyword">else</span> {
      <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Datos cargados.&quot;</span>);
      <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">setHTMLUnsafe</span>(
        <span class="hljs-comment">/* html */</span><span class="hljs-string">`&lt;main&gt;<span class="hljs-subst">${<span class="hljs-variable language_">this</span>.data?.temperature}</span>&lt;/main&gt;`</span>);
    }
  }
}

customElements.<span class="hljs-title function_">define</span>(<span class="hljs-string">&quot;weather-time&quot;</span>, <span class="hljs-title class_">WeatherTime</span>);
</code></pre>
</split-slide>
</step>
<step>
<split-slide style="--font-size: 1.1rem;">
<pre><code class="language-js"><span class="hljs-keyword">const</span> L = <span class="hljs-string">&quot;liberia+guanacaste&quot;</span>;
<span class="hljs-keyword">const</span> <span class="hljs-variable constant_">URL</span> = <span class="hljs-string">`https://goweather.xyz/v2/weather/<span class="hljs-subst">${L}</span>`</span>;

<span class="hljs-keyword">class</span> <span class="hljs-title class_">WeatherTime</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_ inherited__">HTMLElement</span> {
  data = {};

  <span class="hljs-title function_">constructor</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">super</span>();
    <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">init</span>();
  }

  <span class="hljs-keyword">async</span> <span class="hljs-title function_">init</span>(<span class="hljs-params"></span>) {
    <span class="hljs-keyword">const</span> response = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(<span class="hljs-variable constant_">URL</span>);
    <span class="hljs-variable language_">this</span>.<span class="hljs-property">data</span> = <span class="hljs-keyword">await</span> response.<span class="hljs-title function_">json</span>(); <span class="hljs-number">1</span>️⃣
    <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">render</span>();
  }

  <span class="hljs-title function_">connectedCallback</span>(<span class="hljs-params"></span>) { <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">render</span>() }
}
</code></pre>
<pre><code class="language-js"><span class="hljs-keyword">class</span> <span class="hljs-title class_">WeatherTime</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_ inherited__">HTMLElement</span> {
  <span class="hljs-comment">/* ... */</span>

  <span class="hljs-keyword">get</span> <span class="hljs-title function_">temperature</span>() { <span class="hljs-number">2</span>️⃣
    <span class="hljs-keyword">return</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">data</span>?.<span class="hljs-property">temperature</span>;
  }

  <span class="hljs-title function_">render</span>(<span class="hljs-params"></span>) { <span class="hljs-number">3</span>️⃣
    <span class="hljs-keyword">const</span> loading = <span class="hljs-string">`&lt;div class=&quot;loading&quot;&gt;&lt;/div&gt;`</span>.<span class="hljs-title function_">repeat</span>(<span class="hljs-number">3</span>);
    <span class="hljs-keyword">const</span> loaded = <span class="hljs-string">`&lt;main&gt;<span class="hljs-subst">${<span class="hljs-variable language_">this</span>.temperature}</span>&lt;/main&gt;`</span>;
    <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">setHTMLUnsafe</span>(!<span class="hljs-variable language_">this</span>.<span class="hljs-property">temperature</span> ? loading : loaded);
  }
}

customElements.<span class="hljs-title function_">define</span>(<span class="hljs-string">&quot;weather-time&quot;</span>, <span class="hljs-title class_">WeatherTime</span>);
</code></pre>
</split-slide>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-scope-diOul9jF="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="11" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="28">
<h1 id="dom-en-webcomponents">DOM en WebComponents</h1>
<ul>
<li>Atributos</li>
<li>Reactividad</li>
<li>Plantillas HTML</li>
<li>Organizando componentes</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="atributos-html-en-webcomponents">Atributos HTML en WebComponents</h2>
<split-slide style="--left: 60%; --right: 40%;">
<pre><code class="language-js"><span class="hljs-keyword">const</span> <span class="hljs-variable constant_">DEFAULT_VALUE</span> = <span class="hljs-number">42</span>;

<span class="hljs-keyword">class</span> <span class="hljs-title class_">WarningBadge</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_ inherited__">HTMLElement</span> {
  <span class="hljs-title function_">constructor</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">super</span>();
  }

  <span class="hljs-title function_">connectedCallback</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">this</span>.<span class="hljs-property">value</span> = <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">getAttribute</span>(<span class="hljs-string">&quot;value&quot;</span>) ?? <span class="hljs-variable constant_">DEFAULT_VALUE</span>;
    <span class="hljs-variable language_">this</span>.<span class="hljs-property">isOpen</span> = <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">hasAttribute</span>(<span class="hljs-string">&quot;open&quot;</span>) ?? <span class="hljs-literal">false</span>;
    <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">render</span>();
  }
}
</code></pre>
<div>
<ul>
<li>
<p>En el <code>connectedCallback</code>:</p>
<ul>
<li>Se leen atributos</li>
<li>Se guardan en propiedades</li>
<li>↑ (Más fácil el acceso)</li>
</ul>
</li>
<li>
<p>Utilizar el <code>??</code> para definir un valor por defecto</p>
</li>
<li>
<p>Separar en una constante el valor</p>
<ul>
<li>Es más legible</li>
<li>Es más fácil de modificar en el futuro</li>
</ul>
</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="recuerda-propiedad--atributo-html">Recuerda: Propiedad != Atributo HTML</h2>
<ul>
<li>Un atributo HTML siempre es <code>String</code>, se modifica en el HTML</li>
<li>Una propiedad JS no tiene porque ser <code>String</code>, se modifica en JS</li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">const</span> element = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">createElement</span>(<span class="hljs-string">&quot;data-element&quot;</span>);   <span class="hljs-comment">// &lt;data-element&gt;&lt;/data-element&gt;</span>

element.<span class="hljs-title function_">setAttribute</span>(<span class="hljs-string">&quot;value&quot;</span>, <span class="hljs-number">42</span>);                        <span class="hljs-comment">// &lt;data-element value=&quot;42&quot;&gt;&lt;/data-element&gt;</span>

element.<span class="hljs-property">value</span> = <span class="hljs-number">100</span>;                                      <span class="hljs-comment">// Propiedad JS, no atributo HTML</span>

element.<span class="hljs-title function_">getAttribute</span>(<span class="hljs-string">&quot;value&quot;</span>);                            <span class="hljs-comment">// &quot;42&quot; (String, atributo HTML)</span>
element.<span class="hljs-property">value</span>;                                            <span class="hljs-comment">// 100  (Number, propiedad JS)</span>
</code></pre>
<ul>
<li>Hay algunas excepciones donde se <strong>reflejan</strong> (se modifican ambas) Ej: <code>id</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="reactividad-en-webcomponents">Reactividad en WebComponents</h2>
<split-slide style="--left: 60%; --right: 40%;">
<pre><code class="language-js"><span class="hljs-keyword">class</span> <span class="hljs-title class_">WarningBadge</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_ inherited__">HTMLElement</span> {

  <span class="hljs-keyword">static</span> <span class="hljs-keyword">get</span> <span class="hljs-title function_">observedAttributes</span>() {
    <span class="hljs-keyword">return</span> [<span class="hljs-string">&quot;src&quot;</span>, <span class="hljs-string">&quot;disabled&quot;</span>]
  }

  <span class="hljs-title function_">attributeChangedCallback</span>(<span class="hljs-params">name, old, now</span>) {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`El atributo <span class="hljs-subst">${name}</span>: <span class="hljs-subst">${old}</span> → <span class="hljs-subst">${now}</span>`</span>);
  }
}

customElements.<span class="hljs-title function_">define</span>(<span class="hljs-string">&quot;warning-badge&quot;</span>, <span class="hljs-title class_">WarningBadge</span>);
</code></pre>
<div>
<ul>
<li><code>static get observedAttributes()</code>
<ul>
<li>Definir los atributos que vamos a vigilar</li>
</ul>
</li>
<li><code>attributeChangedCallback()</code>
<ul>
<li>Se dispara cuando cambia un valor</li>
</ul>
</li>
</ul>
<p>Ejemplos:</p>
<ul>
<li><code>.setAttribute()</code> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Detectable</li>
<li><code>.value = ...</code> <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> No cambias atributo</li>
<li>Atributos HTML inician en valor <code>null</code></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">

<p>En ambos casos, los estilos son globales:</p>

</step>
</steps>
<div>
<ul>
<li><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Mediante <code>@scope</code>
<ul>
<li><img class="emoji" draggable="false" alt="💖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f496.svg" data-marp-twemoji=""/> CSS interno</li>
<li><img class="emoji" draggable="false" alt="💔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f494.svg" data-marp-twemoji=""/> Afecta desde fuera</li>
</ul>
</li>
<li><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Mediante <strong>Shadow DOM</strong>
<ul>
<li><img class="emoji" draggable="false" alt="💖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f496.svg" data-marp-twemoji=""/> CSS interno</li>
<li><img class="emoji" draggable="false" alt="💖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f496.svg" data-marp-twemoji=""/> No afecta desde fuera</li>
</ul>
</li>
</ul>
<p><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/31-20e3.svg" data-marp-twemoji=""/> @scope:</p>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> La regla <code>@scope</code> sólo aplica CSS desde el padre del <code>&lt;style&gt;</code> a sus hijos.</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> El CSS de fuera afecta al componente (no protege del CSS de fuera)</li>
</ul>
<p><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Shadow DOM:</p>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> El CSS sólo se aplica al componente</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> El CSS de fuera no afecta al componente</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-scope-kW8yX2Ip="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="19" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="28">
<h1 id="shadow-dom">Shadow DOM</h1>
<ul>
<li>Crear un Shadow DOM</li>
<li>Light DOM</li>
<li>Slots</li>
<li>Aplicar CSS</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="crear-un-shadow-dom">Crear un Shadow DOM</h2>
<split-slide style="--font-size: 1rem;">
<steps>
<step>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;element&quot;</span>&gt;</span>Contenido<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript">
  <span class="hljs-keyword">const</span> $el = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.element&quot;</span>);

  <span class="hljs-comment">// Modificamos el DOM normal de la página</span>
  $el.<span class="hljs-title function_">setHTMLUnsafe</span>(<span class="hljs-comment">/* html */</span><span class="hljs-string">`Light DOM`</span>);

  <span class="hljs-comment">// Añadimos un Shadow DOM (oculta el DOM normal)</span>
  $el.<span class="hljs-title function_">attachShadow</span>({ <span class="hljs-attr">mode</span>: <span class="hljs-string">&quot;open&quot;</span> });

  <span class="hljs-comment">// Modificamos el DOM particular (Shadow DOM)</span>
  $el.<span class="hljs-property">shadowRoot</span>.<span class="hljs-title function_">setHTMLUnsafe</span>(<span class="hljs-comment">/* html */</span><span class="hljs-string">`Shadow DOM`</span>);
</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
</code></pre>
</step>
<step>
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- Declarative Shadow DOM (SSR/Backend) --&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;element&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">template</span> <span class="hljs-attr">shadowrootmode</span>=<span class="hljs-string">&quot;open&quot;</span>&gt;</span>
    Shadow DOM
  <span class="hljs-tag">&lt;/<span class="hljs-name">template</span>&gt;</span>
  Light DOM
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
</step>
</steps>
<div>
<ul>
<li>
<p><strong>Shadow DOM</strong> es un DOM particular en un elemento.</p>
</li>
<li>
<p>Cuando lo añades, ocultas el <strong>DOM general</strong> (Light DOM).</p>
</li>
<li>
<p>Sigue existiendo y es modificable, pero no se ve.</p>
</li>
<li>
<p>Con <code>element</code> accedes → Light DOM (no visible)</p>
</li>
<li>
<p>Con <code>element.shadowRoot</code> accedes → Shadow DOM (visible)</p>
</li>
<li>
<p>El CSS añadido al <strong>Shadow DOM</strong>, sólo afecta a ese DOM.</p>
</li>
<li>
<p><a href="https://lenguajecss.com/cascada-css/alcance/declarative-shadow-dom/"><img class="emoji" draggable="false" alt="➡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/27a1.svg" data-marp-twemoji=""/> Declarative Shadow DOM</a>: ideal para backend y SSR</p>
</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="webcomponent-con-shadow-dom">WebComponent con Shadow DOM</h2>
<split-slide style="--font-size: 1rem;">
<steps>
<step>
<pre><code class="language-js"><span class="hljs-keyword">class</span> <span class="hljs-title class_">UserCard</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_ inherited__">HTMLElement</span> {
  <span class="hljs-title function_">constructor</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">super</span>();
    <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">attachShadow</span>({ <span class="hljs-attr">mode</span>: <span class="hljs-string">&quot;open&quot;</span> }); <span class="hljs-number">1</span>️⃣
  }

  <span class="hljs-title function_">connectedCallback</span>(<span class="hljs-params"></span>) { <span class="hljs-number">2</span>️⃣
    <span class="hljs-variable language_">this</span>.<span class="hljs-property">shadowRoot</span>.<span class="hljs-title function_">setHTMLUnsafe</span>(<span class="hljs-comment">/* html */</span><span class="hljs-string">`
      &lt;style&gt;
        .container {
          background: black;
          color: white;
          padding: 5px;
        }
      &lt;/style&gt;
      &lt;div class=&quot;container&quot;&gt;Alo&lt;/div&gt;
    `</span>);
  }
}
customElements.<span class="hljs-title function_">define</span>(<span class="hljs-string">&quot;user-card&quot;</span>, <span class="hljs-title class_">UserCard</span>);
</code></pre>
</step>
<step>
<pre><code class="language-js"><span class="hljs-keyword">import</span> styles <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./UserCard.css&quot;</span> <span class="hljs-keyword">with</span> { <span class="hljs-attr">type</span>: <span class="hljs-string">&quot;css&quot;</span> };

<span class="hljs-keyword">class</span> <span class="hljs-title class_">UserCard</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_ inherited__">HTMLElement</span> {
  <span class="hljs-title function_">constructor</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">super</span>();
    <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">attachShadow</span>({ <span class="hljs-attr">mode</span>: <span class="hljs-string">&quot;open&quot;</span> });
    <span class="hljs-variable language_">this</span>.<span class="hljs-property">shadowRoot</span>.<span class="hljs-property">adoptedStyleSheets</span>.<span class="hljs-title function_">push</span>(styles);
  }

  <span class="hljs-title function_">connectedCallback</span>(<span class="hljs-params"></span>) {
    <span class="hljs-keyword">const</span> html = <span class="hljs-comment">/* html */</span><span class="hljs-string">`&lt;div class=&quot;container&quot;&gt;
      Alo
    &lt;/div&gt;`</span>;
    <span class="hljs-variable language_">this</span>.<span class="hljs-property">shadowRoot</span>.<span class="hljs-title function_">setHTMLUnsafe</span>(html);
  }
}
customElements.<span class="hljs-title function_">define</span>(<span class="hljs-string">&quot;user-card&quot;</span>, <span class="hljs-title class_">UserCard</span>);
</code></pre>
</step>
</steps>
<div>
Nuestro WebComponent quedaría así:
<ul>
<li><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/31-20e3.svg" data-marp-twemoji=""/> El <code>.attachShadow()</code> se hace sobre <code>this</code> (la clase)</li>
<li><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/32-20e3.svg" data-marp-twemoji=""/> El <code>.setHTML*()</code> sobre <code>this.shadowRoot</code> (Shadow DOM)</li>
</ul>
<p><img class="emoji" draggable="false" alt="➡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/27a1.svg" data-marp-twemoji=""/> Pero el CSS tiende a hacerse MUY grande...</p>
<ul>
<li>Podemos usar <code>import</code> y <code>.adoptedStyleSheets</code> para externalizarlo.</li>
<li><img class="emoji" draggable="false" alt="💖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f496.svg" data-marp-twemoji=""/> Separamos en diferentes ficheros (más manejable)</li>
<li><img class="emoji" draggable="false" alt="💖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f496.svg" data-marp-twemoji=""/> Evita FOUC (Son módulos y se aplica antes del render)</li>
<li><img class="emoji" draggable="false" alt="💔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f494.svg" data-marp-twemoji=""/> Requiere descargar 2 archivos (importante sólo en HTTP/1)</li>
</ul>
<p><img class="emoji" draggable="false" alt="✨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2728.svg" data-marp-twemoji=""/> <strong>TRUCAZO</strong>: Las variables CSS si atraviesan el Shadow DOM.</p>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="slots-ranuras-html">Slots (ranuras HTML)</h2>
<ul>
<li>Con <strong>Shadow DOM</strong> podemos crear ranuras en el HTML</li>
</ul>
<steps>
<step>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- Web Component --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">slot</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">slot</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">style</span>&gt;</span><span class="language-css">
  <span class="hljs-selector-pseudo">::slotted</span>(<span class="hljs-selector-tag">span</span>) {
    <span class="hljs-attribute">background</span>: black;
    <span class="hljs-attribute">color</span>: white;
    <span class="hljs-attribute">padding</span>: <span class="hljs-number">4px</span>;
  }
</span><span class="hljs-tag">&lt;/<span class="hljs-name">style</span>&gt;</span>
</code></pre>
<div>
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- Documento HTML --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">user-card</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">span</span>&gt;</span>Alo<span class="hljs-tag">&lt;/<span class="hljs-name">span</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">user-card</span>&gt;</span>
</code></pre>
<div>
<p><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Slots</p>
<ul>
<li>
<p>Son ranuras para enviar datos<br />
-<img class="emoji" draggable="false" alt="🌔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f314.svg" data-marp-twemoji=""/> Light DOM → <img class="emoji" draggable="false" alt="🌒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f312.svg" data-marp-twemoji=""/> Shadow DOM</p>
</li>
<li>
<p>Vía ::slotted() → <img class="emoji" draggable="false" alt="💖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f496.svg" data-marp-twemoji=""/> Dar estilo a elementos en un <slot></p>
</li>
<li>
<p>Vía ::slotted() → <img class="emoji" draggable="false" alt="💔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f494.svg" data-marp-twemoji=""/> Dar estilo SÓLO a elementos de nivel 1</p>
</li>
</ul>
</div>
</div>
</split-slide>
</step>
<step>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- Web Component --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">style</span>&gt;</span><span class="language-css">
  <span class="hljs-selector-pseudo">::slotted</span>(<span class="hljs-selector-tag">h2</span>) {
    <span class="hljs-attribute">background</span>: red;
    <span class="hljs-attribute">color</span>: white;
  }
</span><span class="hljs-tag">&lt;/<span class="hljs-name">style</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>
  Name: <span class="hljs-tag">&lt;<span class="hljs-name">slot</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;name&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">slot</span>&gt;</span>
  Text: <span class="hljs-tag">&lt;<span class="hljs-name">slot</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;description&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">slot</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
<div>
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- Documento HTML --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">user-card</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">h2</span> <span class="hljs-attr">slot</span>=<span class="hljs-string">&quot;name&quot;</span>&gt;</span>Nombre<span class="hljs-tag">&lt;/<span class="hljs-name">h2</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">slot</span>=<span class="hljs-string">&quot;description&quot;</span>&gt;</span>Descripción<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">user-card</span>&gt;</span>
</code></pre>
<div>
<p><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Slots nombrados</p>
<ul>
<li>Puedes tener múltiples <slot> con un name para diferenciarlos</li>
<li>Cada <slot> se conecta con el elemento con slot y su nombre</li>
<li><img class="emoji" draggable="false" alt="💔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f494.svg" data-marp-twemoji=""/> Misma limitación: solo a elementos HTML de nivel 1</li>
</ul>
</div>
</div>
</split-slide>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="utilizar-variables-de-css-en-shadow-dom">Utilizar variables de CSS en Shadow DOM</h2>
<ul>
<li>Forma recomendada de enviar datos de estilos desde fuera</li>
</ul>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-css">user-card {
  <span class="hljs-attr">--theme-color</span>: deeppink; <span class="hljs-number">2</span>️⃣
}

<span class="hljs-number">1</span>️⃣ El <span class="hljs-attribute">color</span> temático por defecto es indigo
<span class="hljs-number">2</span>️⃣ Si el usuario define un <span class="hljs-attribute">color</span>, se toma ese como temático
<span class="hljs-number">3</span>️⃣ El interior <span class="hljs-selector-tag">del</span> componente crea colores derivados

<span class="hljs-comment">/* Recuerda:
   Las variables CSS se filtran a través del Shadow DOM
*/</span>
</code></pre>
<pre><code class="language-css"><span class="hljs-comment">/* Dentro del componente */</span>
<span class="hljs-selector-class">.container</span> { <span class="hljs-number">3</span>️⃣
  <span class="hljs-attr">--light-color</span>: <span class="hljs-built_in">color-mix</span>(
    in srgb, <span class="hljs-built_in">var</span>(--theme-color, indigo), white <span class="hljs-number">50%</span>
  );

  <span class="hljs-attribute">background</span>: black;
  <span class="hljs-attribute">color</span>: white;
  <span class="hljs-attribute">border-bottom</span>: <span class="hljs-number">2px</span> solid <span class="hljs-built_in">var</span>(--theme-color, indigo);

  <span class="hljs-selector-tag">strong</span> { <span class="hljs-attribute">color</span>: <span class="hljs-built_in">var</span>(--light-color); }

  <span class="hljs-selector-class">.decoration</span> { <span class="hljs-attribute">background</span>: <span class="hljs-built_in">var</span>(--theme-color, indigo); }
}
</code></pre>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="css-scoping-css-en-shadow-dom">CSS Scoping (CSS en Shadow DOM)</h2>
<ul>
<li>Forma recomendada de estilar con CSS en un Shadow DOM</li>
<li>Compatibilidad: <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> :host <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> :host() <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> :host-context()</li>
</ul>
<split-slide style="--left: 40%; --right: 60%; --font-size: 1rem;">
<pre><code class="language-css"><span class="hljs-selector-pseudo">:host</span> {
  <span class="hljs-attribute">display</span>: block flow;
  <span class="hljs-attribute">background</span>: indigo;
  <span class="hljs-attribute">padding</span>: <span class="hljs-number">0.5rem</span>;
}

<span class="hljs-selector-pseudo">:host</span>(<span class="hljs-selector-attr">[open]</span>) {
  <span class="hljs-comment">/* ... */</span>
}

<span class="hljs-selector-pseudo">:host-context</span>(<span class="hljs-selector-class">.dark</span>) {
  <span class="hljs-comment">/* ... */</span>
}
</code></pre>
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- `:host` es el contenedor del custom element: `&lt;user-card&gt;` --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">user-card</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">user-card</span>&gt;</span>

<span class="hljs-comment">&lt;!-- `:host()` es el contenedor con un selector específico --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">user-card</span> <span class="hljs-attr">open</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">user-card</span>&gt;</span>

<span class="hljs-comment">&lt;!-- `:host-context()` es el contenedor dentro de un contexto --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">body</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;dark&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;container&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">user-card</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">user-card</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>

</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="css-parts">CSS Parts</h2>
<ul>
<li>Forma de preparar un WebComponent para que otros desarrolladores le puedan dar estilo a ciertas partes desde fuera del componente, simplificándolo todo.</li>
</ul>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-keyword">class</span> <span class="hljs-title class_">UserCard</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_ inherited__">HTMLElement</span> {
  <span class="hljs-comment">/* ... */</span>

  <span class="hljs-title function_">connectedCallback</span>(<span class="hljs-params"></span>) { <span class="hljs-number">2</span>️⃣
    <span class="hljs-variable language_">this</span>.<span class="hljs-property">shadowRoot</span>.<span class="hljs-title function_">setHTMLUnsafe</span>(<span class="hljs-comment">/* html */</span><span class="hljs-string">`
      &lt;div class=&quot;container&quot;&gt;
        &lt;img part=&quot;image&quot; src=&quot;image.png&quot; alt=&quot;Image&quot;&gt;
        &lt;h2 part=&quot;name&quot;&gt;<span class="hljs-subst">${<span class="hljs-variable language_">this</span>.name}</span>&lt;/h2&gt;
      &lt;/div&gt;
    `</span>);
  }
}

customElements.<span class="hljs-title function_">define</span>(<span class="hljs-string">&quot;user-card&quot;</span>, <span class="hljs-title class_">UserCard</span>);
</code></pre>
<div>
<pre><code class="language-css">user-card<span class="hljs-selector-pseudo">::part</span>(<span class="hljs-selector-tag">image</span>) {
  <span class="hljs-comment">/* ... */</span>
}

user-card<span class="hljs-selector-pseudo">::part</span>(name) {
  <span class="hljs-comment">/* ... */</span>
}
</code></pre>
<p>Con <code>::part()</code> podemos preparar partes de un componente para que los devs que usen el componente puedan dar estilo a partes del mismo desde fuera.</p>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-marpit-scope-5NLcZsMt="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="26" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="28">
<h1 id="comunicar-componentes">Comunicar componentes</h1>
<ul>
<li>Atributos / propiedades</li>
<li>Eventos Javascript</li>
<li>Emisores de eventos</li>
<li>Gestores de estado</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="comunicar-componentes-1">Comunicar componentes</h2>
<ul>
<li>En algún momento necesitaremos pasar información de un componente a otro (hay varias formas)</li>
</ul>
<steps>
<step>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- Si es sencillo, atributos es buena opción --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">user-card</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;CatLord&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">user-card</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">user-card</span>
  <span class="hljs-attr">name</span>=<span class="hljs-string">&#x27;{&quot;name&quot;:&quot;Alo&quot;,&quot;role&quot;:&quot;Profesor&quot;}&#x27;</span>&gt;</span> <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/>
<span class="hljs-tag">&lt;/<span class="hljs-name">user-card</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript">
  <span class="hljs-keyword">const</span> userCard = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;user-card&quot;</span>);
  userCard.<span class="hljs-title function_">setAttribute</span>(<span class="hljs-string">&quot;name&quot;</span>, <span class="hljs-string">&quot;Alo&quot;</span>); <span class="hljs-comment">// Reactividad</span>
</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
</code></pre>
<div>
<p>A un componente:</p>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Mediante Atributos HTML</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Mediante setAttribute() (Reactividad)</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> Si no son sencillas, no uses atributos</li>
</ul>
</div>
</split-slide>
</step>
<step>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">user-card</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">user-card</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript">
  <span class="hljs-keyword">const</span> userCard = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;user-card&quot;</span>);

  <span class="hljs-keyword">const</span> data = { <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Alo&quot;</span>, <span class="hljs-attr">role</span>: <span class="hljs-string">&quot;Profesor&quot;</span> };

  userCard.<span class="hljs-title function_">setData</span>(data);       <span class="hljs-comment">// (Manual → método)</span>
  userCard.<span class="hljs-property">data</span>                 <span class="hljs-comment">// (Manual → prop/getter)</span>
</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
</code></pre>
<div>
A un componente:
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Mediante Propiedades (API Javascript)</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Utiliza métodos para inyectar datos</li>
</ul>
</div>
</split-slide>
</step>
<step>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-keyword">class</span> <span class="hljs-title class_">UserCard</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_ inherited__">HTMLElement</span> {
  <span class="hljs-title function_">connectedCallback</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">userConfirm</span>(); <span class="hljs-comment">// Usuario confirma. Enviemos esos datos</span>
  }

  <span class="hljs-title function_">userConfirm</span>(<span class="hljs-params"></span>) {
    <span class="hljs-keyword">const</span> options = {
      <span class="hljs-attr">bubbles</span>: <span class="hljs-literal">true</span>,    <span class="hljs-comment">// Envia eventos burbujeando por el DOM</span>
      <span class="hljs-attr">composed</span>: <span class="hljs-literal">true</span>    <span class="hljs-comment">// Atraviesa Shadow DOM</span>
    };
    <span class="hljs-keyword">const</span> event = <span class="hljs-keyword">new</span> <span class="hljs-title class_">CustomEvent</span>(<span class="hljs-string">&quot;usercard:confirm&quot;</span>, options);
    <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">dispatchEvent</span>(event);
  }
}
</code></pre>
<div>
<p>A múltiples componentes:</p>
<ul>
<li>
<p><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> Desacoplar: No «atarse» al DOM</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Mediante eventos Javascript</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Llamamos al método cuando nos interese</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Le damos un nombre al evento</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Enviamos evento a quien lo escuche</p>
</li>
</ul>
</div>
</split-slide>
</step>
<step>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-keyword">class</span> <span class="hljs-title class_">OtherComponent</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_ inherited__">HTMLElement</span> {
  <span class="hljs-title function_">connectedCallback</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;usercard:confirm&quot;</span>, <span class="hljs-function">() =&gt;</span> {
      <span class="hljs-comment">// Escuchamos el evento en el raíz del HTML</span>
      <span class="hljs-comment">// Si algún otro componente lo ha enviado lo</span>
      <span class="hljs-comment">// escucharemos desde aquí</span>
    });

    <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;usercard:confirm&quot;</span>, <span class="hljs-function">() =&gt;</span> {
      <span class="hljs-comment">// Escuchamos el evento en el componente</span>
      <span class="hljs-comment">// Puede ser útil si otro componente hijo lo</span>
      <span class="hljs-comment">// ha enviado y ha burbujeando hasta llegar a él</span>
    });
  }
}
</code></pre>
<div>
<p>Otras opciones:</p>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Escuchar en document es más fácil.
<ul>
<li>Si burbujeas, acabarás llegando al raíz y lo escucharás.</li>
</ul>
</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> Escuchar en this → menos riesgo de leaks.
<ul>
<li>Si eliminas componente del DOM, más fácil.</li>
<li>Si escuchas document, debes limpiar listeners manualmente.</li>
</ul>
</li>
</ul>
</div>
</split-slide>
</step>
<step>
<split-slide style="--font-size: 1rem;">
<pre><code class="language-js"><span class="hljs-comment">// https://github.com/developit/mitt</span>

<span class="hljs-keyword">import</span> mitt <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;mitt&quot;</span>;

<span class="hljs-keyword">const</span> emitter = <span class="hljs-title function_">mitt</span>();

emitter.<span class="hljs-title function_">on</span>(<span class="hljs-string">&quot;foo&quot;</span>, <span class="hljs-function">(<span class="hljs-params">e</span>) =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;foo&quot;</span>, e));
emitter.<span class="hljs-title function_">on</span>(<span class="hljs-string">&quot;*&quot;</span>, <span class="hljs-function">(<span class="hljs-params">type, e</span>) =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(type, e));

emitter.<span class="hljs-title function_">emit</span>(<span class="hljs-string">&quot;foo&quot;</span>, { <span class="hljs-attr">a</span>: <span class="hljs-string">&quot;b&quot;</span> });
</code></pre>
<div>
<p>Otras opciones:</p>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Mediante librerías de terceros</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Mediante gestores de estado</li>
</ul>
<p>Gestores de estado:</p>
<ul>
<li><img class="emoji" draggable="false" alt="🏹" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3f9.svg" data-marp-twemoji=""/> <a href="https://github.com/nanostores/nanostores">NanoStores</a></li>
<li><img class="emoji" draggable="false" alt="🏹" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3f9.svg" data-marp-twemoji=""/> <a href="https://zustand.docs.pmnd.rs/learn/getting-started/introduction">Zustand</a></li>
</ul>
<p>Librerías reactivas:</p>
<ul>
<li><img class="emoji" draggable="false" alt="🏹" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3f9.svg" data-marp-twemoji=""/> <a href="https://github.com/paldepind/flyd">flyd</a></li>
<li><img class="emoji" draggable="false" alt="🏹" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3f9.svg" data-marp-twemoji=""/> <a href="https://github.com/stackblitz/alien-signals">alien-signals</a></li>
<li><img class="emoji" draggable="false" alt="🏹" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3f9.svg" data-marp-twemoji=""/> <a href="https://preactjs.com/blog/introducing-signals/">signals preact</a></li>
</ul>
</div>
</split-slide>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
